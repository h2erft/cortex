<!DOCTYPE html>
<html lang="en">
<!-- Cortex — local-first LG VRF central controller. Developer notes: docs/HANDOFF.md · protocol: LGAP_reference.md -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex</title>
<!-- Web fonts load in the background (never blocking the page): a controller on a site network with no
     internet must still paint instantly — it simply falls back to the system fonts. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* AIROW Control — custom LG VRF central controller UI (prototype)
   layout: top bar + left nav + unit grid/list + right control drawer + modals */
:root{
  --bg:#eef0f2; --surface:#fff; --surface-2:#f7f8fa; --border:#dde1e6; --border-strong:#c7ccd3;
  --text:#1b2027; --text-dim:#5a6372; --text-faint:#8a93a1;
  --accent:#0e7c66; --accent-ink:#0b5f4e; --accent-soft:#d9efe9;
  --cool:#1f74c4; --cool-soft:#e2eefb; --heat:#d2652a; --heat-soft:#faeadf;
  --auto:#0e7c66; --auto-soft:#d9efe9; --dry:#6a54c0; --dry-soft:#e9e5f7; --fanm:#64748b; --fanm-soft:#e8ebef;
  --ok:#2e9e5b; --stopped:#9aa3b0; --err:#d93b3b; --err-soft:#fbe6e6;
  --warn:#c98a12; --warn-soft:#fbf0d8; --crit:#b3261e; --crit-soft:#fbe3e1; --info:#3a6ea5; --info-soft:#e4eef8;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 8px 40px rgba(16,24,40,.18); color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171c23; --surface-2:#1c222b; --border:#2a313b; --border-strong:#3a434f;
  --text:#e7ebf0; --text-dim:#9aa4b2; --text-faint:#6b7585;
  --accent:#2fb79a; --accent-ink:#8fe6d4; --accent-soft:#143029;
  --cool:#5aa6e8; --cool-soft:#13263a; --heat:#e8955a; --heat-soft:#33251a;
  --auto:#2fb79a; --auto-soft:#143029; --dry:#a594ec; --dry-soft:#231d38; --fanm:#9aa6b4; --fanm-soft:#232a33;
  --ok:#43c072; --stopped:#6b7585; --err:#f26a6a; --err-soft:#331c1c;
  --warn:#e0a53a; --warn-soft:#352a16; --crit:#f26a6a; --crit-soft:#3a1d1a; --info:#6ba3dd; --info-soft:#15293c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --surface-2:#1c222b; --border:#2a313b; --border-strong:#3a434f;
  --text:#e7ebf0; --text-dim:#9aa4b2; --text-faint:#6b7585;
  --accent:#2fb79a; --accent-ink:#8fe6d4; --accent-soft:#143029;
  --cool:#5aa6e8; --cool-soft:#13263a; --heat:#e8955a; --heat-soft:#33251a;
  --auto:#2fb79a; --auto-soft:#143029; --dry:#a594ec; --dry-soft:#231d38; --fanm:#9aa6b4; --fanm-soft:#232a33;
  --ok:#43c072; --stopped:#6b7585; --err:#f26a6a; --err-soft:#331c1c;
  --warn:#e0a53a; --warn-soft:#352a16; --crit:#f26a6a; --crit-soft:#3a1d1a; --info:#6ba3dd; --info-soft:#15293c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand .logo{width:30px;height:30px;display:grid;place-items:center;color:var(--accent)}
.site{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:var(--text-dim);font-size:13px}
.bus{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.spacer{flex:1}
.clock{font-size:13px;color:var(--text-dim)}
.who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
.who .rolebadge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);display:grid;place-items:center}
.icon-btn.lit{border-color:var(--accent);color:var(--accent)}

.shell{flex:1;display:flex;min-height:0}
nav{flex:0 0 212px;background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;overflow:auto}
.nav-group{margin-bottom:18px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-faint);padding:0 8px 6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text-dim);font-size:14px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nav-item .count{font-size:12px;color:var(--text-faint);flex:0 0 auto}
.nav-item .tech-tag{font-size:10px;font-weight:600;color:var(--warn)}
.nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.nav-item.sub{padding-left:28px;font-size:13px}
.nav-item.row{cursor:pointer}
.nav-arrow{flex:0 0 14px;text-align:center;color:var(--text-faint);cursor:pointer;font-size:10px;user-select:none}
.nav-pen{flex:0 0 auto;color:var(--text-dim);cursor:pointer;font-size:14px;opacity:.55;padding:0 4px}
.nav-item:hover .nav-pen,.nav-pen:hover{opacity:1;color:var(--accent)}
main{flex:1;min-width:0;overflow:auto;padding:18px 22px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:left;transition:border-color .12s,transform .12s}
button.tile:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile .n{font-size:28px;font-weight:600;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:6px}
.tile .l .dot{width:7px;height:7px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text-dim)}
.search input{border:none;background:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;width:100%}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
.segmented button{border:none;background:none;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--text-dim);display:inline-flex;align-items:center;gap:5px}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s,transform .12s;overflow:hidden;display:flex;flex-direction:column;gap:11px;min-width:0}
.card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,var(--stopped))}
.card.off{opacity:.72}
.card-top{display:flex;align-items:center;gap:10px;min-width:0}
.card-id{flex:1 1 auto;min-width:0}
.card-name{font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:break-word}
.dname .card-name{display:block;white-space:nowrap}
.lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500;white-space:nowrap;flex:none}
.pill.run{background:var(--accent-soft);color:var(--accent-ink)}
.pill.stop{background:var(--surface-2);color:var(--text-dim)}
.pill.err{background:var(--err-soft);color:var(--err);cursor:pointer}
.pill.noresp{background:var(--warn-soft);color:var(--warn)}
/* the two readings (what it is set to / what the room is) carry equal weight, each labelled */
.card-read{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:9px 12px}
.card-read.one{grid-template-columns:1fr}
.card-read.dual{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.rd{min-width:0;overflow:hidden}
.rd + .rd{border-left:1px solid var(--border);padding-left:12px}
.rd-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin-bottom:4px;white-space:nowrap}
.rd-v{font-size:26px;font-weight:600;line-height:1;white-space:nowrap}
.rd-v small{font-size:13px;color:var(--text-dim);font-weight:400;margin-left:1px}
.rd-v i{font-style:normal;color:var(--text-faint);font-weight:400;font-size:17px;margin:0 2px}
.rd-v.idle{color:var(--text-faint)}
.card-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip,.modechip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;line-height:1.4;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip{background:var(--surface-2);color:var(--text-dim)}
.err-note{font-size:11.5px;line-height:1.4;color:var(--err);background:var(--err-soft);border-radius:8px;padding:7px 9px;display:flex;align-items:flex-start;gap:6px;cursor:pointer}
.err-note:hover{text-decoration:underline}
.grid.compact .card{padding:11px 11px 11px 13px;gap:9px}
.grid.compact .card-meta{display:none}
.grid.compact .card-top{gap:8px}
.grid.compact .card-name{font-size:13.5px}
.grid.compact .pill{font-size:10px;padding:2px 6px}
.grid.compact .ugmini{width:30px;height:30px}
.grid.compact .card-read{padding:7px 9px}
.grid.compact .rd + .rd{padding-left:9px}
.grid.compact .rd-v{font-size:21px}
.grid.compact .rd-v small{font-size:11.5px}
.grid.compact .rd-v i{font-size:14px;margin:0 1px}

/* list view */
.listv{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.lrow{display:grid;grid-template-columns:18px 1.6fr .9fr .7fr .7fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13.5px}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--surface-2)}
.lrow .st{width:9px;height:9px;border-radius:50%}
.lrow .lname{font-weight:500}
.lrow .lsub{font-size:11.5px;color:var(--text-faint)}
.lhead{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);background:var(--surface-2);cursor:default}
.lhead:hover{background:var(--surface-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .2s ease;z-index:50;display:flex;flex-direction:column;visibility:hidden}
.drawer.show{visibility:visible}
.drawer.show{transform:none}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer-body{padding:16px 18px;overflow:auto;flex:1}
.field{margin-bottom:18px}
.field > .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.opt.sel.cool{border-color:var(--cool);background:var(--cool-soft);color:var(--cool)}
.opt.sel.heat{border-color:var(--heat);background:var(--heat-soft);color:var(--heat)}
.opt.sel.dry{border-color:var(--dry);background:var(--dry-soft);color:var(--dry)}
.opt.sel.fan{border-color:var(--fanm);background:var(--fanm-soft);color:var(--text)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);font-size:22px;color:var(--text);line-height:1}
.stepper .val{font-size:40px;font-weight:600}
.stepper .val small{font-size:17px;color:var(--text-dim);font-weight:400}
.dualset{display:flex;flex-direction:column;gap:8px}
.dualset .dsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:11px;padding:6px 12px}
.dualset .dslbl{font-size:12px;font-weight:600;flex:0 0 auto}
.dualset .stepper{gap:10px}
.dualset .stepper .val{font-size:30px}
.dualset .stepper button{width:38px;height:38px;font-size:20px}
.frame-box{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-size:12.5px}
.frame-box .k{color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.frame-box .hex{color:var(--accent-ink);font-weight:500}
.frame-box .pending{color:var(--text-faint)}
.pwr{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pwr button{border:none;background:var(--surface-2);color:var(--text-dim);padding:9px 20px;font-size:14px;font-weight:600}
.pwr button.on-sel{background:var(--ok);color:#fff}
.pwr button.off-sel{background:var(--stopped);color:#fff}

/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:460px;max-width:100%;max-height:88vh;overflow:auto}
.modal.wide{width:620px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-body{padding:18px}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 12px;border-radius:8px 8px 0 0;color:var(--text-dim);font-size:13.5px;font-weight:500;border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .lock{font-size:11px;color:var(--text-faint)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:none}
.setrow .sl{font-size:14px}.setrow .sd{font-size:12px;color:var(--text-dim)}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--border-strong);border:none;position:relative;transition:background .15s;flex:0 0 auto}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on::after{transform:translateX(18px)}
.sel-box{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13.5px;font-family:inherit}
.pin-input{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-family:"IBM Plex Mono",monospace}
.err-text{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}
.sev{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.ed-row{display:flex;gap:10px;margin-top:14px}.ed-row .k{flex:0 0 96px;color:var(--text-faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.ed-row .v{font-size:14px}
.urow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.urow:last-child{border-bottom:none}
.rchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-dim)}
.rchip.owner{background:var(--warn-soft);color:var(--warn)}
.rchip.admin{background:var(--accent-soft);color:var(--accent-ink)}
.rchip.tech{background:var(--info-soft);color:var(--info)}
.linklike{color:var(--accent);background:none;border:none;font-size:13px;padding:4px 6px}
.recovery{font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:2px;background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:10px;padding:12px;text-align:center;color:var(--accent-ink)}

.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gauge{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.gauge .gv{font-size:26px;font-weight:600}.gauge .gv small{font-size:14px;color:var(--text-dim);font-weight:400}
.gauge .gl{font-size:12.5px;color:var(--text-dim);margin-top:3px}.gauge.sample{opacity:.6}
.cyc-note{background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:12px 15px;color:var(--text-dim);font-size:13.5px;margin-bottom:16px;display:flex;gap:9px;align-items:center}

@media (max-width:860px){nav{display:none}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){main{padding:14px}.drawer{width:100%}.lrow{grid-template-columns:14px 1.4fr .8fr .8fr}.lrow .lc-hide{display:none}}

/* login + setup screens */
#screen-setup,#screen-login{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none}
#screen-setup.show,#screen-login.show{display:block}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:420px;max-width:100%;overflow:hidden}
.auth-card.wiz{width:580px}
.auth-head{padding:20px 24px;border-bottom:1px solid var(--border)}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.auth-logo .logo{width:34px;height:34px;display:grid;place-items:center;color:var(--accent)}
.auth-body{padding:24px}
.auth-body h2{margin:0 0 4px;font-size:19px;font-weight:600}
.auth-sub{color:var(--text-dim);font-size:13.5px;margin-bottom:18px}
.inp{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-family:inherit;font-size:15px;margin-bottom:12px}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.flabel{font-size:12.5px;color:var(--text-dim);margin-bottom:6px;display:block}
.wiz-steps{display:flex;gap:6px;padding:14px 24px 0}

/* ---- Cortex brain mark + "thinking" loader ----
   One inline SVG (brainMark). 'calm' = header/login (nodes breathe slowly); 'live' = loader (pulse,
   halo, and sparks travelling in/out along the leads). All motion is CSS, so it is simply absent
   under prefers-reduced-motion (the mark stays as a static picture). */
.cx-brain{display:block;overflow:visible;flex:none}
.cx-brain .bh{fill:currentColor;fill-opacity:.13;stroke:currentColor;stroke-linejoin:round;stroke-linecap:round}
.cx-brain .bt{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.cx-brain .bn{fill:currentColor}
.cx-brain .bl{fill:none;stroke:currentColor;stroke-opacity:.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 3.4}
.cx-brain .bp{fill:currentColor;opacity:0}
.cx-brain .bhalo{fill:none;stroke:currentColor;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .cx-brain.calm .bn{animation:cxtw 5s ease-in-out infinite}
  .cx-brain.live .bcore{transform-box:fill-box;transform-origin:center;animation:cxpulse 2.4s ease-in-out infinite}
  .cx-brain.live .bh{animation:cxfill 2.4s ease-in-out infinite}
  .cx-brain.live .bhalo{transform-box:fill-box;transform-origin:center;animation:cxhalo 2.4s ease-out infinite}
  .cx-brain.live .bn{animation:cxtw 1.6s ease-in-out infinite}
  @supports (offset-path:path("M0 0")){
    .cx-brain.live .bp{animation:cxin 2.2s linear infinite}
    .cx-brain.live .bp.out{animation-name:cxout}
  }
}
@keyframes cxtw{0%,100%{opacity:1}50%{opacity:.35}}

@keyframes cxin{0%{offset-distance:0%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes cxout{0%{offset-distance:100%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:0%;opacity:0}}

<script>
const MODES=[["cool","Cool","❄"],["heat","Heat","☀"],["auto","Auto","⇅"],["dry","Dry","💧"],["fan","Fan","✦"]];
const FANS=[["low","Low"],["med","Med"],["high","High"],["auto","Auto"]];
// Speeds you can CHOOSE. "Auto" is shown when a unit reports it, but it is not offered as a command:
// its code on the bus is not confirmed, and picking it used to send the unit's last-seen speed instead.
const FANS_SEL=FANS.filter(f=>f[0]!=="auto");
const MC={cool:"cool",heat:"heat",auto:"auto",dry:"dry",fan:"fan"};

/* ---- LG Multi V error code reference (verify against the unit's service manual) ---- */
const ERRORS={
 "CH01":{t:"Indoor air / remote sensor",cause:"Return-air or wall-remote temperature sensor open or shorted.",act:"Check sensor wiring and resistance; replace sensor.",sev:"medium",who:"Indoor"},
 "CH02":{t:"Indoor pipe (inlet) sensor",cause:"Inlet pipe thermistor open or shorted.",act:"Check thermistor resistance; replace if out of range.",sev:"medium",who:"Indoor"},
 "CH03":{t:"Remote controller comms",cause:"Communication lost between the wired remote (zone) controller and the indoor unit.",act:"Check the remote's 2-wire link and connector.",sev:"medium",who:"Indoor"},
 "CH04":{t:"Condensate drain / float",cause:"Drain pump failure or float switch tripped (high water level).",act:"Clean the drain pan and line, verify the pump and float.",sev:"medium",who:"Indoor"},
 "CH05":{t:"Indoor ↔ outdoor comms lost",cause:"Communication failure between indoor and outdoor PCBs; miswired or damaged 2-wire bus.",act:"Check comm cable polarity and continuity; look for address conflicts.",sev:"high",who:"Both"},
 "CH06":{t:"Indoor pipe (outlet) sensor",cause:"Outlet pipe thermistor open or shorted.",act:"Check thermistor resistance; replace if faulty.",sev:"medium",who:"Indoor"},
 "CH07":{t:"Mode conflict",cause:"Indoor units are set to conflicting modes (one heat, one cool) on the same system.",act:"Set all indoor units to the same mode (all cool or all heat).",sev:"low",who:"System"},

 "CH21":{t:"Inverter overcurrent (IPM)",cause:"Compressor inverter drew over-current / IPM fault.",act:"Technician: check compressor, IPM, and inverter PCB.",sev:"critical",who:"Outdoor"},
 "CH22":{t:"DC link over-voltage",cause:"Inverter DC bus voltage too high (power spike).",act:"Check incoming power and DC bus capacitors; add surge protection.",sev:"critical",who:"Outdoor"},
 "CH27":{t:"High pressure trip",cause:"High-pressure switch tripped (~590 psi R-410A). Dirty coil, low airflow, or overcharge.",act:"Clean the outdoor coil, confirm all ODU fans run, verify charge.",sev:"critical",who:"Outdoor"},
 "CH53":{t:"Address duplication / comms",cause:"Two units share a central address, or indoor↔central communication failed.",act:"Re-run auto-addressing and set unique central control addresses.",sev:"medium",who:"System"},

 "CH36":{t:"Low compression ratio",cause:"Compression ratio stayed too low (<1.6 scroll / <1.8 rotary) after a reversing-valve change or compressor start — the unit isn't building a normal high/low pressure difference.",act:"Check for failed/locked-out compressors, low charge, and that the 4-way (reversing) valve is shifting and seating. Often paired with CH151.",sev:"high",who:"Outdoor"},
 "CH38":{t:"EEV fault",cause:"Electronic expansion valve not operating correctly.",act:"Check the EEV coil and operation; replace if faulty.",sev:"high",who:"Outdoor"},
 "CH40":{t:"Current (CT) sensor",cause:"Compressor current-transformer sensor fault.",act:"Technician: check the CT sensor and inverter PCB.",sev:"high",who:"Outdoor"},
 "CH44":{t:"Outdoor air sensor",cause:"Outdoor-air temperature thermistor open or shorted.",act:"Check/replace the outdoor air thermistor.",sev:"medium",who:"Outdoor"},
 "CH45":{t:"Compressor overload",cause:"Compressor protection trip / overload.",act:"Check amps, voltage, charge, and airflow; look for a restricted system.",sev:"critical",who:"Outdoor"},
 "CH62":{t:"Heatsink temperature",cause:"Inverter heatsink (IPM) over-temperature.",act:"Check outdoor fan operation and heatsink airflow.",sev:"high",who:"Outdoor"},
 "CH67":{t:"Outdoor fan motor",cause:"Outdoor fan motor or its PCB driver fault.",act:"Check the fan motor amps and the fan driver PCB.",sev:"high",who:"Outdoor"},
 "CH104":{t:"Main ODU lost a sub unit",cause:"On a multi-outdoor system the master outdoor unit lost communication with a slave outdoor unit.",act:"Check the outdoor-to-outdoor comm wiring and that all ODUs are powered.",sev:"high",who:"Outdoor"},
 "CH105":{t:"Outdoor unit comms",cause:"Communication error between outdoor PCBs.",act:"Check the ODU-to-ODU comm bus.",sev:"high",who:"Outdoor"},
 "CH204":{t:"HR box comm error",cause:"Communication error with a heat-recovery (HR) box.",act:"Check HR box power and comm wiring.",sev:"high",who:"System"},
 "CH206":{t:"Duplicate HR address",cause:"Two heat-recovery boxes share the same address.",act:"Set unique HR box addresses.",sev:"medium",who:"System"},
 "CH237":{t:"ODU↔IDU RS-485 comms",cause:"RS-485 communication error between indoor and outdoor units.",act:"Check comm bus wiring, polarity, and addressing.",sev:"high",who:"Both"},
 "CH238":{t:"ODU PCB comms",cause:"Outdoor PCB communication error with the indoor unit.",act:"Check the outdoor main PCB and comm bus.",sev:"high",who:"Outdoor"},
 "501":{t:"3-phase power error",cause:"Outdoor unit three-phase power not connected properly / phase loss.",act:"Technician: check breaker, phase order, and connections.",sev:"critical",who:"Outdoor"},
 "502":{t:"ODU ↔ IDU comms",cause:"Communication error between outdoor main PCB and indoor unit PCB(s).",act:"Check the indoor-outdoor comm bus wiring.",sev:"high",who:"Outdoor"}
};
// Always return something, even for a code we don't have a reference for, so the UI never crashes.
function errInfo(code){return ERRORS[code]||{t:"Unrecognized code",cause:"No reference for "+code+" yet — check the unit's service manual for this model.",act:"Look up "+code+" in the LG service manual.",sev:"medium",who:"Unit"};}
const SEVC={info:"info",low:"ok",medium:"warn",high:"err",critical:"crit"};

/* ---- state ---- */
const DEF_SETTINGS={view:"grid",density:"comfortable",unit:"F",theme:"auto",accent:"slate",defaultGroup:0,clock24:false,landing:"units",
  groupBy:"location",showTiles:true,showWeather:true,notif:{push:true,email:false},
  show:{mode:true,room:true,fan:false,tags:true}};
const ACCENTS={
  slate:{n:"Slate",c:"#0e7c66",l:["#0e7c66","#0b5f4e","#d9efe9"],d:["#2fb79a","#8fe6d4","#143029"]},
  arctic:{n:"Arctic",c:"#1f74c4",l:["#1f74c4","#15568f","#e2eefb"],d:["#5aa6e8","#bcd8f5","#13263a"]},
  ember:{n:"Ember",c:"#d2652a",l:["#d2652a","#9a4718","#faeadf"],d:["#e8955a","#f4c7a6","#33251a"]},
  forest:{n:"Forest",c:"#2f9e44",l:["#2f9e44","#1f6e30","#e4f3e6"],d:["#51c866","#b7e8c0","#15301b"]},
  grape:{n:"Grape",c:"#7a4fd0",l:["#7a4fd0","#55369a","#ece4fb"],d:["#a98cf0","#d7c8f7","#241a3a"]}};
const DIMS=[["location","Groups (your layout)"],["system","System (physical)"],["floor","Floor"],["suite","Suite"],["tag","Tag"]];
const TREESEP=" ▸ ";                                       // separates group ▸ subgroup in a leaf key
function grpOf(u){return (u.grp&&u.grp.trim())||"Ungrouped";}
function subOf(u){return (u.subgrp&&u.subgrp.trim())||"General";}
function leafKey(u){return grpOf(u)+TREESEP+subOf(u);}
let WEATHER={place:"Site",now:null,cond:"Loading…",hi:null,lo:null,hours:[],live:false,ts:0};
const WMO={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Rain showers",81:"Rain showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm w/ hail",99:"Thunderstorm w/ hail"};
async function getCoords(){
  if(CFG&&CFG.site&&CFG.site.lat!=null&&CFG.site.lon!=null)return {lat:CFG.site.lat,lon:CFG.site.lon};
  if(navigator.geolocation)return new Promise(res=>{navigator.geolocation.getCurrentPosition(
    p=>{const c={lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)};if(CFG&&CFG.site){CFG.site.lat=c.lat;CFG.site.lon=c.lon;saveCfg(CFG);}res(c);},
    ()=>res(null),{timeout:8000,maximumAge:3600000});});
  return null;
}
async function loadWeather(){
  try{
    const c=await getCoords();
    if(!c){WEATHER.live=false;WEATHER.cond="Set the site location in Settings";if(view==="units")renderAll();return;}
    const unit=settings.unit==="C"?"celsius":"fahrenheit";
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&hourly=temperature_2m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=${unit}&timezone=auto&forecast_days=1`;
    const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
    WEATHER.now=Math.round(j.current.temperature_2m);WEATHER.cond=WMO[j.current.weather_code]||"—";
    WEATHER.hi=Math.round(j.daily.temperature_2m_max[0]);WEATHER.lo=Math.round(j.daily.temperature_2m_min[0]);
    const times=j.hourly.time,temps=j.hourly.temperature_2m,nowh=new Date();
    let start=times.findIndex(t=>new Date(t)>nowh);if(start<0)start=0;
    WEATHER.hours=[];for(let i=start;i<start+5&&i<times.length;i++){WEATHER.hours.push([new Date(times[i]).toLocaleTimeString([],{hour:"numeric"}),Math.round(temps[i])]);}
    WEATHER.live=true;WEATHER.ts=Date.now();
  }catch(e){WEATHER.live=false;if(WEATHER.now==null)WEATHER.cond="Weather unavailable";}
  if(view==="units")renderAll();
}
function detectLocation(){
  if(!window.isSecureContext){toast("Browsers only share location on secure (https) pages. This page was opened over plain http, so either open Cortex at its https:// address (Device health shows it once secure access is turned on) or tap “Enter manually” and type the site’s coordinates — you only do it once.");return;}
  if(!navigator.geolocation){toast("This browser can't share location — use “Enter manually”");return;}
  toast("Getting your location…");navigator.geolocation.getCurrentPosition(
    p=>{if(CFG&&CFG.site){CFG.site.lat=+p.coords.latitude.toFixed(4);CFG.site.lon=+p.coords.longitude.toFixed(4);saveCfg(CFG);}WEATHER.ts=0;loadWeather();toast("Location set — loading weather");if(setTab)drawSettings();},
    ()=>toast("Couldn't get location — allow location access, or set it manually"),{timeout:9000});}
let settings=loadSettings();
let session={admin:false,tech:false};
// Access codes and the recovery code are PER SITE (set in the setup wizard, changed in Settings ▸
// Advanced). There are deliberately no built-in defaults: a default in public source is no lock at all.
let users=[];
let view="units", groupFilter="all", statusFilter="all", query="", aboutTaps=0;
let selMode=false; let selSet=new Set(); // multi-select / batch control

/* Persist units (incl. imported ones) so they survive reload AND app updates.
   localStorage is keyed to this local file, so a new cortex.html keeps the data. */
/* The unit list is ALSO kept on the appliance (/api/units), so every computer and phone that opens
   Cortex sees the same units and their last readings — not just the browser that ran the bus scan.
   The screen that is connected to the equipment pushes fresh readings; the others read them. */
let BOOTED=false;                                              // set once boot has loaded config + units
let unitsRev=0,unitsPushT=null,unitsPushing=false,unitsPushAgain=false,lastUnitsPushAt=0;
let SRV={masterAlive:false,at:0};                             // what the appliance last told us about the live link
function unitsSynced(){try{return localStorage.getItem("airow_units_rev")!=null;}catch(e){return false;}}
function noteUnitsRev(r){unitsRev=r;try{localStorage.setItem("airow_units_rev",String(r));}catch(e){}}
function cleanUnits(){return units.map(u=>{const o={};for(const k in u){if(k[0]!=="_")o[k]=u[k];}return o;});}  // drop runtime-only fields
function saveUnits(){try{localStorage.setItem("airow_units",JSON.stringify(cleanUnits()));}catch(e){}queueUnitsPush();}
function queueUnitsPush(){if(location.protocol==="file:"||!BOOTED||unitsPushT)return;
  unitsPushT=setTimeout(()=>{unitsPushT=null;pushUnits();},isMaster()?3000:400);}
let unitsForce=false;                                          // next push replaces the shared list outright (restore from backup)
async function pushUnits(force){
  if(location.protocol==="file:")return;
  if(force)unitsForce=true;
  if(!units.length&&!unitsSynced()&&!unitsForce)return;        // never let a screen that has no units blank the shared list
  if(unitsPushing){unitsPushAgain=true;return;}unitsPushing=true;
  try{do{unitsPushAgain=false;const m=isMaster(),f=unitsForce;unitsForce=false;
    const body={units:cleanUnits(),live:m&&!f,master:m};if(!f)body.base=unitsRev;
    const r=await fetch('/api/units',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409){const j=await r.json();
      // The appliance has a different list. Normally theirs wins — but a screen holding real units
      // never gives them up to an EMPTY list (that would silently erase a site's units).
      if(units.length&&Array.isArray(j.units)&&!j.units.length){unitsRev=j.rev;unitsPushAgain=true;continue;}
      adoptUnits(j);break;}
    if(r.ok){const j=await r.json();noteUnitsRev(j.rev);lastUnitsPushAt=Date.now();}
  }while(unitsPushAgain);}catch(e){}finally{unitsPushing=false;}}
function adoptUnits(j){
  if(!j||!Array.isArray(j.units))return;
  const prev=new Map(units.map(u=>[u.addr,u]));
  try{if(units.length)localStorage.setItem("airow_units_prev",JSON.stringify(cleanUnits()));}catch(e){}   // one-step safety copy
  units=normalizeIds(j.units);migrateUnits(true);
  units.forEach(u=>{const o=prev.get(u.addr);if(!o)return;
    if(o._hist)u._hist=o._hist;
    if(rt(u.addr).hold>Date.now()){["on","mode","fan","swing","coolC","heatC","twoset","modeLock","fanLock","tempLock","sp"].forEach(k=>{u[k]=o[k];});}});  // a command we just sent wins for a few seconds
  noteUnitsRev(j.rev);
  try{localStorage.setItem("airow_units",JSON.stringify(cleanUnits()));}catch(e){}
  if(openId!=null)drawerStale=true;
  if(BOOTED&&currentUser){renderGroupNav();liveRefresh(true);}}
async function pullUnits(){
  if(location.protocol==="file:")return;
  const was=SRV.masterAlive;
  try{const r=await fetch('/api/units',{cache:'no-store'});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
    SRV.masterAlive=!!j.masterAlive;SRV.at=Date.now();
    if(j.rev!==unitsRev&&!unitsPushing&&!unitsPushT){
      if(units.length&&(j.rev===0||(!j.units.length&&!unitsSynced()))){unitsRev=j.rev;await pushUnits();}   // first screen with a unit list shares it
      else adoptUnits(j);}
    else if(was!==SRV.masterAlive){fillLiveBanner();updateBusHealth();}
  }catch(e){SRV.masterAlive=false;if(was){fillLiveBanner();updateBusHealth();}}}   // the controller itself is unreachable
setInterval(()=>{if(BOOTED&&!isMaster()&&document.visibilityState!=="hidden")pullUnits();},4000);
function loadUnits(){try{const u=JSON.parse(localStorage.getItem("airow_units"));if(Array.isArray(u))return normalizeIds(u);}catch(e){}return [];}
// Guarantee every unit has a unique numeric id. Repairs units imported by an older build that
// saved id:"" (which made the control drawer fail to open and broke selection/delete).
function normalizeIds(arr){const seen=new Set();let next=1;
  arr.forEach(u=>{let id=(typeof u.id==="number"&&isFinite(u.id))?u.id:null;
    if(id===null||seen.has(id)){while(seen.has(next))next++;id=next;}
    u.id=id;seen.add(id);while(seen.has(next))next++;});
  return arr;}
let units=loadUnits();
/* Migrate older saved units up to the current model: dual (cool/heat) setpoints in °C,
   plus mode/fan/temp locks. Runs once on load; new fields default sensibly. */
function migrateUnits(noSave){let changed=false;units.forEach(u=>{
  if(u.coolC==null){const f=(u.sp!=null?u.sp:72);u.coolC=Math.round((f-32)*5/9*2)/2;changed=true;}
  if(u.heatC==null){u.heatC=Math.max(16,Math.round((u.coolC-2)*2)/2);changed=true;}
  if(u.twoset==null){u.twoset=false;changed=true;}
  if(u.modeLock==null){u.modeLock=false;changed=true;}
  if(u.fanLock==null){u.fanLock=false;changed=true;}
  if(u.tempLock==null){u.tempLock=false;changed=true;}
  if(u.grp==null){u.grp=u.system||("Group "+(u.group!=null?u.group:""))||"Ungrouped";changed=true;}  // logical top-level group
  if(u.subgrp==null){u.subgrp="";changed=true;}                                                       // logical sub-group (floor/room)
  if(u.kind==null){u.kind="wall";changed=true;}                                                        // indoor-unit body type (tech sets it)
});if(changed&&!noSave)saveUnits();}
migrateUnits();

/* ---- organization helpers ---- */
function getMeta(u){const m=(CFG&&CFG.unitMeta&&CFG.unitMeta[u.name])||{};
  return {alias:m.alias||"",tags:m.tags||[],floor:m.floor!=null?m.floor:u.floor,suite:m.suite||u.suite};}
// The name people see. A nickname wins; a unit nobody has named yet shows as "Unit N" — never its
// bus address (older imports stored "Addr 0x17" as the label). Technicians read the address in the drawer.
function defaultName(u){const l=(u.label||"").trim();return (!l||/^Addr 0x[0-9a-f]{1,2}$/i.test(l))?("Unit "+u.id):l;}
function dispName(u){return getMeta(u).alias||defaultName(u);}
// Who is looking: customers never see addresses, channels, outdoor-system ids, frames or hex.
function isTechView(){return !!session.tech;}
function isStaff(){return !!(session.tech||session.admin);}
function userDims(){return DIMS.filter(d=>d[0]!=="system"||isTechView());}       // "System (physical)" is a technician grouping
function gdim(){return (settings.groupBy==="system"&&!isTechView())?"location":settings.groupBy;}
function tnum(f){return settings.unit==="C"?Math.round((f-32)*5/9):f;}             // stored °F -> number in the user's unit
function inService(u){return !!(CFG&&CFG.unitMeta&&CFG.unitMeta[u.name]&&CFG.unitMeta[u.name].service&&CFG.unitMeta[u.name].service.inService);}
function setMeta(u,patch){if(!CFG)return;CFG.unitMeta=CFG.unitMeta||{};
  CFG.unitMeta[u.name]=Object.assign({},CFG.unitMeta[u.name],patch);saveCfg(CFG);}
function catVals(u,dim){const m=getMeta(u);
  if(dim==="location")return[grpOf(u),leafKey(u)];            // both the top group and the group▸sub leaf
  if(dim==="system")return[u.system];
  if(dim==="group")return["Group "+u.group];
  // a freshly discovered unit carries its outdoor-system name in "floor" until someone sets a real one
  if(dim==="floor")return[(m.floor==null||m.floor===""||String(m.floor)===String(u.system))?"No floor set":"Floor "+m.floor];
  if(dim==="suite")return[m.suite||"No suite set"];
  if(dim==="tag")return m.tags.length?m.tags.slice():["Untagged"];
  return["All"];}
function catList(dim){const s=new Set();units.forEach(u=>catVals(u,dim).forEach(c=>s.add(c)));
  return [...s].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
function unitsInCat(cat,dim){return units.filter(u=>catVals(u,dim).includes(cat));}

/* ---- helpers ---- */

/* ===== LGAP — decoded from the ACP's OWN firmware 2026-11-07 (see HANDOFF NOTES) =====
   Checksum (confirmed, code + wire): (sum of all bytes except the last) XOR 0x55.
   An indoor unit uses TWO frames:
   (A) 8-byte basic frame  80 00 A0 addr b4 b5 b6 ck  — power / mode / fan ONLY.
       b4 bit0=power, bit1="change" (CC sends 03/02 once, then 01/00).
       b5 HIGH nibble=fan (1 low,2 med,3 high) · LOW nibble=mode (0 cool,3 auto,4 heat).
       b6 is NOT the setpoint (some other field) — which is why it never tracked
       temperature. Cortex preserves the last-seen b6.
   (B) 16-byte "cmd5" frame — carries the SETPOINTS. FULLY CONFIRMED 2026-11-08 by
       disassembling the ACP's OWN builder (CopyControlData_to_sendControlacCmd5). The
       header is no longer a guess — exact byte layout:
         [0]=A8  [1]=00  [2]=A0  [3]=addr  [4]=10 (cmd5 id)  [5]=flags(bit0=power on)
         [6..9] = limits: (byte & 0x7F)°C + (top bit ? 0.5 : 0)  (cool lo/hi, heat lo/hi)
         [10] & 0x7F = COOLING setpoint whole °C ; [11] & 0x7F = HEATING whole °C
         [12] hi nibble=cool decimal, lo nibble=heat decimal ; °C = whole + dec*0.1
         [13] = reserved/mode
         [14] = ap_mkchksum(buf,14) = (sum[0..13] ^ 0x55) & 0xFF
         [15] = (ap_mkchksum(buf,15) + 1) & 0xFF = ((sum[0..14] ^ 0x55) + 1) & 0xFF
       NOTE: cmd5 marker is A8 (the 80 00 A0 basic frame is a DIFFERENT command).
       TWO checksums (14 AND 15); ap_mkchksum == lgapCk (sum XOR 0x55), confirmed in code.
   (C) 8-byte "cmd4" frame  A0 00 A0 addr b4 b5 b6 ck — carries the WALL-CONTROLLER LOCKS.
       LIVE-DECODED on a running ACP 2026-11-13 (unit 0x5E, each lock isolated on the wire):
         b4 bit0=power · bit1=TEMP lock (0x02) · bit2=FAN lock (0x04) · bit3=MODE lock (0x08)
         (all-unlocked 0x01, temp-only 0x03, fan-only 0x05, mode-only 0x09, all three 0x0F)
       b5,b6 are a STATIC per-unit payload (0x85 0x08 on 0x5E) — they did NOT move for mode,
       setpoint OR lock changes, so they are NOT live settings; we replay each unit's own
       observed b5/b6 verbatim and NEVER send cmd4 blind (a guessed cmd4 overwrites settings).
       The "hard lock" produced no bit in this frame (likely a separate path) — not handled.
       cmd0 (80-frame) carries NO locks; its b4 bit2 tracks mode, not a lock. */
const MODELO={cool:0,dry:1,fan:2,auto:3,heat:4};  // ALL CONFIRMED 2026-11-08 from firmware mode→code converter (strcmp chain @0x380c8)
const FANHI={low:1,med:2,high:3};       // low + med confirmed on wire; high by LG convention
const SP_CONFIRMED=true;                // cmd0 basic frame b6 = °C-15 (community-confirmed, checksum-verified)
function spByte(o){const c=Math.round((o.sp-32)*5/9);return Math.max(0,Math.min(31,c-13));} // legacy, unused
/* setpoint helpers — source of truth is °C (coolC/heatC); display in the user's unit */
const SP_MINC=16,SP_MAXC=30;
function spMinC(){const f=CFG&&CFG.spMinF;return f!=null?(f-32)*5/9:SP_MINC;}   // site setpoint floor (stored °F)
function spMaxC(){const f=CFG&&CFG.spMaxF;return f!=null?(f-32)*5/9:SP_MAXC;}   // site setpoint ceiling (stored °F)

/* (A) basic power/mode/fan command (8-byte) */
function cmdBytesFor(addr,o,change){
  const seen5=(o.d5!=null?o.d5:0x33);
  const fanN=FANHI[o.fan]!=null?FANHI[o.fan]:((o.fanRaw!=null?o.fanRaw:(seen5>>4))&7);   // unknown fan (e.g. auto) -> keep exactly what the unit reported
  const modeN=MODELO[o.mode]!=null?MODELO[o.mode]:(seen5&0x0f);
  const b5=(fanN<<4)|modeN;
  // b6 = setpoint in whole °C minus 15 (cmd0 write — community-confirmed: 22°C -> 0x07, frame
  // 80 00 A0 31 03 30 07 DE checksum-validates). Half-degree rides b0 bit2 (0x04). When no
  // setpoint is supplied, preserve the last-seen b6 so a power/mode/fan-only write doesn't move it.
  let b0=o.b0||0x80, b6;
  if((b0&0x78)!==0||!(b0&0x80))b0=0x80;                       // whatever was last seen, a command is always cmd0
  let setC=(o.setC!=null)?o.setC:(o.mode==="heat"?o.heatC:o.coolC);
  if(setC!=null&&isFinite(setC)){
    const whole=Math.max(15,Math.min(30,Math.round(setC*2)/2)), intp=Math.floor(whole);
    b6=Math.max(0,Math.min(15,intp-15));                      // the field is 15–30°C (one nibble in the reply); never send outside it
    b0&=~0x04;                                                // clear a half-degree flag left over from the last-seen frame…
    if(whole-intp>=0.5&&intp<30)b0|=0x04;                     // …and set it only when THIS setpoint has the half degree
  }else{
    b6=(o.d6!=null?o.d6:0x06);                                // no setpoint known — preserve last-seen
  }
  const b4=(o.on?1:0)|(change===false?0:2);
  const b=[b0,0x00,0xA0,addr,b4,b5,b6,0];b[7]=cksum(b);return b;}
function cmdFrameFor(addr,o){return toHexBytes(cmdBytesFor(addr,o));}
function cmdFrame(u){return cmdFrameFor(u.addr,u);}
/* (B) 16-byte setpoint (cmd5): decode is certain; encode reuses a last-seen template header */
function decodeCmd5(b){ if(!b||b.length<16) return null;

function cmd5SetpointBytes(addr,coolC,heatC,opt){
  opt=opt||{};

  b[0]=opt.marker!=null?opt.marker:0xA8;   // firmware constant (mvn #0x57)
  b[1]=0x00;
  b[2]=0xA0;
  b[3]=addr;
  b[4]=opt.cmd!=null?opt.cmd:0x10;          // cmd5 sub-id
  // byte5 flags: bit0 = power on; keep any extra mode/lock bits the caller supplies
  let flags=(opt.flags!=null?opt.flags:0)&0xff;
  if(opt.on===false) flags&=~0x01; else flags|=0x01;
  b[5]=flags&0xff;
  // bytes 6-9 limits (cool lo/hi, heat lo/hi): (whole & 0x7F) | (half ? 0x80 : 0)
  const lim=opt.limits||[coolC-2,coolC+2,heatC-2,heatC+2];

  b[15]=(lgapCk(b,15)+1)&0xff;               // checksum over bytes 0..14, +1

async function applyAndSend(list,mut){
  list=(list||[]).filter(ctlAllowed);
  if(!list.length){toast("Nothing to change");return 0;}
  if(!canReach()&&!isDemo()){toast(notConnMsg());return 0;}
  holdUnits(list);
  list.forEach(u=>{mut(u);u.coolC=clampC(u.coolC);u.heatC=clampC(u.heatC);u.sp=Math.round(activeC(u)*9/5+32);});
  let n=list.length;
  if(canReach()){if(list.length>1)toast(`Sending to ${list.length} units…`);n=await sendUnits(list);}
  if(liveTx()||isDemo())saveUnits();

function renderLocationTree(nav){

    `<button class="nav-item ${groupFilter==="all"&&view==="units"?'active':''}" data-cat="${encodeURIComponent("all")}"><span class="nm">All units</span><span class="count">${units.length}</span></button>`;

          <span class="nm">${ue(s)}</span>

}

/* byte5 LOW nibble = mode, HIGH nibble = fan — from controlled changes at the real CC
   on 2026-11-07 (A7 cool/low = 0x10, A6 heat/med = 0x24). The older "mode in high nibble"
   read was wrong: that nibble is fan. dry/fan mode codes are LG-convention guesses. */
const BMODE={0:"cool",1:"dry?",2:"fan?",3:"auto",4:"heat"};
const BFAN={1:"low",2:"med",3:"high"};
function spTxt(d){return d.setF!=null?d.setF+"°F":"sp? b6="+hx(d.b6!=null?d.b6:0);}
function validFrame(f){return f[2]===0xA0 && cksum(f)===f[7];}
function frameType(f){
  if(f[0]===0x80&&f[1]===0x00)return "cmd";
  if(f[0]===0x84&&f[1]===0x00)return "cmd";
  if(f[0]===0xA0&&f[1]===0x00)return "cmd4";     // cmd4 (0xA0): carries the wall-controller LOCKS in byte4 (live-decoded 2026-11-13)
  if(f[0]===0x80&&(f[1]===0xB0||f[1]===0xB2))return "poll";
  if((f[0]===0xF0||f[0]===0xC8)&&f[1]===0xC0)return "scan";
  return "other";}
function decodeFrame(f){
  const t=frameType(f),d={addr:f[3],type:t,hex:[...f].map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(" ")};
  if(t==="cmd"){d.power=(f[4]&0x01)?"on":"off";d.writing=!!(f[4]&0x02);
    d.change=!!(f[4]&0x02);d.b0=f[0];d.b5=f[5];d.b6=f[6];     // NOTE: cmd0 byte4 bit2 is NOT a lock (it tracks mode); locks live in cmd4
    d.mode=BMODE[f[5]&0x0f]||("m"+(f[5]&0x0f));d.fan=BFAN[f[5]>>4]||("f"+(f[5]>>4));
    d.setC=f[6]+15+((f[0]&0x04)?0.5:0);                       // b6 = °C-15; header bit2 = +0.5°C
    d.setF=SP_CONFIRMED?Math.round(d.setC*9/5+32):null;}
  else if(t==="cmd4"){                                          // byte4: bit0 power · bit1 temp-lock · bit2 fan-lock · bit3 mode-lock
    d.power=(f[4]&0x01)?"on":"off";
    d.tempLock=!!(f[4]&0x02);d.fanLock=!!(f[4]&0x04);d.modeLock=!!(f[4]&0x08);
    d.locked=d.tempLock||d.fanLock||d.modeLock;
    d.c4b4=f[4];d.c4b5=f[5];d.c4b6=f[6];}                      // b5/b6 = this unit's static cmd4 payload (replayed verbatim when we send locks)

function crc16xmodem(buf,n){let c=0;for(let i=0;i<n;i++){c^=(buf[i]&0xff)<<8;for(let k=0;k<8;k++)c=(c&0x8000)?((c<<1)^0x1021)&0xffff:(c<<1)&0xffff;}return c&0xffff;}
/* ---- MASTER / CC mode (beta) — Cortex drives the bus like the LG ACP ----
   Cortex becomes the single master: it sends a cmd0 READ (EXE clear, zero payload) addressed to
   each unit, waits ~1s, and reads the 16-byte reply (validated with the LG sum checksum, lgapCk).
   Discovery is just a sweep of cmd0 reads — unused addresses stay silent (silence is the only "no").
   SAFETY (from a community replicator): only cmd0 with EXE clear, and cmd14 with bytes 5-6 zero,
   are safe to send blind. cmd4 (0xA0), cmd5 (0xA8) and cmd9 (0xC8) OVERWRITE stored settings even
   with an all-zero payload (cmd4 also wipes the central's per-unit settings), and address 0xFF is a
   broadcast to every ODU — Cortex never sweeps 0xFF and refuses to blind-sweep a write command. */
/* Per-unit runtime facts — never saved: when it last answered, missed polls, last frames, and a short
   "hold" after we send a command so a reply that hasn't caught up yet can't flip the screen back. */
const RT=new Map();
function rt(addr){let r=RT.get(addr);if(!r){r={seen:0,miss:0,ok:0,hold:0,lastRx:"",lastTx:"",txAt:0};RT.set(addr,r);}return r;}
/* Browsers slow a background tab's timers to once a second and, after five minutes, to once a MINUTE.
   The poll loop lives in this page, so a dashboard left behind another tab would all but stop polling

   bus timing runs off one. Falls back to ordinary timers if a Worker can't be created. */
const WT=(()=>{try{

/* ---- schedule engine: evaluates schedules each half-minute and fires bus commands ---- */
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function schNthMatches(s,now){const nth=s.nth||"every";if(nth==="every")return true;
  const dom=now.getDate();if(nth==="last")return dom+7>daysInMonth(now.getFullYear(),now.getMonth());
  return Math.floor((dom-1)/7)+1===parseInt(nth,10);}

function schCondOk(s){if(!s.cond||!s.cond.op)return true;const t=outdoorTemp();if(t==null)return false;
  if(s.cond.op==="above")return t>s.cond.temp;if(s.cond.op==="below")return t<s.cond.temp;return true;}
function schTargetUnits(s){const t=s.target||{};
  if(t.type==="all")return units.slice();
  if(t.type==="unit")return units.filter(u=>u.id===t.val);
  if(t.type==="group")return units.filter(u=>grpOf(u)===t.val);
  if(t.type==="sub")return units.filter(u=>leafKey(u)===t.val);
  return [];}

    if(a.sp!=null){const c=settings.unit==="C"?a.sp:(a.sp-32)*5/9;u.coolC=Math.round(c*2)/2;u.heatC=Math.round(c*2)/2;}});
  if(view==="schedule")renderAll();
  toast(`⏱ Schedule "${s.name}" ran → ${n} of ${tgt.length} unit${tgt.length>1?"s":""}`);}
// a schedule acts for the site, not for whoever happens to be signed in — it is not subject to the customer lock
async function applyAndSendAs(list,mut){
  holdUnits(list);
  list.forEach(u=>{mut(u);u.coolC=clampC(u.coolC);u.heatC=clampC(u.heatC);u.sp=Math.round(activeC(u)*9/5+32);});
  let n=list.length;if(canReach())n=await sendUnits(list);

/* Which run of each schedule has already happened is remembered by THIS screen (not in the shared
   config), so firing a schedule never rewrites site settings from a screen with an old copy. */
const SCH_GRACE=10*60000;
function loadFired(){try{return JSON.parse(localStorage.getItem("airow_sched_fired"))||{};}catch(e){return {};}}
function saveFired(f){try{localStorage.setItem("airow_sched_fired",JSON.stringify(f));}catch(e){}}
function schDue(s,now){const m=/^(\d\d):(\d\d)$/.exec(s.time||"");if(!m)return null;const d=new Date(now);d.setHours(+m[1],+m[2],0,0);return d;}
function schKey(s,now){return now.toDateString()+" "+s.time;}
function schTick(){if(!CFG||!CFG.schedules||!CFG.schedules.length)return;
  // Only the screen connected to the equipment runs schedules; other screens just display them.
  if(location.protocol!=="file:"&&!liveTx())return;
  const now=new Date(),fired=loadFired();let dirty=false;
  CFG.schedules.forEach(s=>{
    if(!s.enabled)return;
    const due=schDue(s,now);if(!due)return;
    // Due any time in the last few minutes — not "this exact minute". A browser that throttled its
    // timers, reloaded for an update, or briefly lost the adapter no longer skips the run.
    const late=now-due;if(late<0||late>SCH_GRACE)return;
    if(!(s.days&&s.days.includes(now.getDay())))return;
    if(!schNthMatches(s,now))return;
    const key=schKey(s,now);if(fired[s.id]===key)return;
    if(!schCondOk(s))return;
    fired[s.id]=key;dirty=true;fireSchedule(s);});
  if(dirty)saveFired(fired);}

  catch(e){DEVERR="Couldn't reach the appliance's device service (/api/device). The Cortex backend may be stopped or an older build — check the cortex service on the mini-PC (sudo systemctl status cortex-appliance).";}

    if(send.dataset.busy)return;

    if(!canReach()&&!isDemo()){toast(notConnMsg());return;}
    send.dataset.busy="1";send.disabled=true;send.textContent="Sending…";
    holdUnits([u]);
    u.on=p.on;u.mode=p.mode;u.fan=p.fan;u.swing=p.swing;u.coolC=clampC(p.coolC);u.heatC=clampC(p.heatC);u.twoset=p.twoset;u.modeLock=p.modeLock;u.fanLock=p.fanLock;u.tempLock=p.tempLock;

    pend=snap(u);refreshUnderDrawer();if(liveTx()||isDemo())saveUnits();if(openId===u.id)drawDrawer(u);};
  const del=document.getElementById("delunit");if(del)del.onclick=()=>{
    if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Tap again to remove "+dispName(u);del.classList.add("danger");return;}
    MASTER.found.delete(u.addr);MASTER.prompted.add(u.addr);ignoreAddr(u.addr,true);   // stop polling it, and don't offer it back on its own
    units=units.filter(x=>x.id!==u.id);saveUnits();toast("Removed "+dispName(u));closeDrawer();renderAll();};
  if(!locked){
    const re2=()=>drawDrawer(u);
    const g=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
    g("pon",()=>{p.on=true;re2();});g("poff",()=>{p.on=false;re2();});
    g("swon",()=>{p.swing=true;re2();});g("swoff",()=>{p.swing=false;re2();});
    drawer.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{p.mode=b.dataset.mode;re2();});
    drawer.querySelectorAll("[data-fan]").forEach(b=>b.onclick=()=>{p.fan=b.dataset.fan;re2();});
    g("spup",()=>{setActiveC(p,spStep(activeC(p),+1));re2();});
    g("spdn",()=>{setActiveC(p,spStep(activeC(p),-1));re2();});
    g("cup",()=>{p.coolC=spStep(p.coolC,+1);re2();});
    g("cdn",()=>{p.coolC=spStep(p.coolC,-1);re2();});
    g("hup",()=>{p.heatC=spStep(p.heatC,+1);re2();});
    g("hdn",()=>{p.heatC=spStep(p.heatC,-1);re2();});
    g("lk-mode",()=>{p.modeLock=!p.modeLock;re2();});
    g("lk-fan",()=>{p.fanLock=!p.fanLock;re2();});
    g("lk-temp",()=>{p.tempLock=!p.tempLock;re2();});
    g("two-toggle",()=>{p.twoset=!p.twoset;re2();});
  }
}

function saveUnitName(u,name){const v=String(name||"").replace(/\s+/g," ").trim().slice(0,40);
  if(v===getMeta(u).alias)return false;
  if(!v&&!getMeta(u).alias)return false;
  setMeta(u,{alias:v});return true;}
function startRename(u){const box=document.getElementById("dname");if(!box)return;const cur=dispName(u);

  const inp=document.getElementById("ren-inp");inp.focus();inp.select();

      if(v!==cur&&saveUnitName(u,v)){toast(v?("Renamed to "+v.slice(0,40)):"Name cleared");refreshUnderDrawer();}}
    if(openId===u.id)drawDrawer(u);};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();done(true);}else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done(false);}};
  document.getElementById("ren-ok").onclick=()=>done(true);
  document.getElementById("ren-x").onclick=()=>done(false);}

// The channel toggle reads the FAST local endpoint and renders independently of the (possibly slow,
// GitHub-dependent) update check, so it never appears frozen.
function renderChannelRow(el,chan){
  let h=`<div style="margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint)">Update channel</div>`;
  h+=`<div class="setrow"><div><div class="sl">Beta testing</div><div class="sd">Also install <b>pre-release</b> (alpha / beta / rc) builds on this controller. Off = stable releases only, which is what you want on a customer site.</div></div>`;
  h+= canAdmin() ? `<button class="toggle ${chan==='beta'?'on':''}" id="chan-tog"></button>`
                 : `<span style="color:var(--text-faint);font-size:12px">${chan==='beta'?'on':'off'} · admins only</span>`;
  h+=`</div>`;
  if(chan==='beta') h+=`<div class="note-box warn" style="margin-top:8px">⚠ This controller is on the <b>beta channel</b> and will install pre-release builds. Use on test sites, not production.</div>`;

async function loadChannelRow(){
  const el=document.getElementById("setchan");if(!el)return;
  if(location.protocol==="file:"){el.innerHTML="";return;}     // no controller behind a local file — nothing to switch
  let chan='stable';
  try{const r=await fetch('/api/update-channel',{cache:'no-store'});if(r.ok)chan=(await r.json()).channel||'stable';}catch(e){}
  renderChannelRow(el,chan);
}
async function setUpdateChannel(beta){
  if(!canAdmin()){toast("Admins only");return;}
  const el=document.getElementById("setchan");
  if(el)renderChannelRow(el,beta?'beta':'stable');      // flip instantly — don't wait on the network
  let ok=false;
  try{const r=await fetch('/api/update-channel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:beta?'beta':'stable'})});ok=r.ok;}catch(e){}
  if(ok){toast(beta?"Beta testing on — pre-release updates enabled":"Beta testing off — stable updates only");
    loadChannelRow();        // reconcile with the server (fast, local)
    loadSettingsUpdates();}   // refresh the available-version area for the new channel (may be slow)
  else{toast("Couldn't save the channel — check the appliance");loadChannelRow();}   // revert to server truth
}
let _skipVer=null;try{_skipVer=localStorage.getItem("airow_skipver");}catch(e){}
async function loadSettingsUpdates(){
  loadChannelRow();   // paint the channel toggle immediately, independent of the (slow) update check
  let st;if(location.protocol==="file:")st={error:"Updates are handled by the Cortex controller. This copy was opened as a file on this computer."};
  else{try{const r=await fetch('/api/update/check',{cache:'no-store'});st=await r.json();}catch(e){st={error:"Couldn't reach the controller to check for updates."};}}
  const el=document.getElementById("setupd");if(!el)return;
  const cur=st.current||"—";
  let h=`<div class="setrow"><div><div class="sl">This controller</div><div class="sd">Cortex <span class="mono">v${ue(cur)}</span>${st.name?" · "+ue(st.name):""}</div></div>`;
  if(st.checking)h+='<span class="badge-ok">…</span>';
  else if(st.updateAvailable&&st.latest!==_skipVer)h+='<span class="badge-new">v'+ue(st.latest)+" available</span>";
  else if(st.updateAvailable&&st.latest===_skipVer)h+='<span class="badge-ok">skipped</span>';
  else if(st.latest)h+='<span class="badge-ok">up to date</span>';
  else h+='<span class="badge-ok">—</span>';
  h+="</div>";
  if(st.updateAvailable){
    h+=`<div class="note-box" style="margin-top:10px"><b>v${ue(st.latest)}</b> is available.${st.notes?" "+ue(st.notes):""} Updates verify themselves and roll back automatically if anything goes wrong.</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn primary" id="upd-now">⬇ Download &amp; install now</button>
        <button class="btn" id="upd-skip">${st.latest===_skipVer?"Un-skip":"Skip this version"}</button></div>`;
  } else if(st.configured===false){
    h+='<div class="note-box" style="margin-top:10px">Automatic updates aren\'t turned on for this controller yet.</div>';
  } else if(st.error){
    h+='<div class="note-box" style="margin-top:10px">'+ue(st.error)+"</div>";
  } else {
    h+='<div class="note-box" style="margin-top:10px">You\'re on the latest version. This controller also checks and updates itself automatically.</div>';
  }
  el.innerHTML=h;
  const now=document.getElementById("upd-now");if(now)now.onclick=async()=>{now.disabled=true;now.textContent="Starting…";
    try{await fetch('/api/update/apply',{method:"POST"});}catch(e){}
    el.innerHTML='<div class="note-box">Update started — the controller will download, install, and restart. This page reconnects in a minute or two, and it rolls back on its own if the new version has a problem.</div>';};
  const skip=document.getElementById("upd-skip");if(skip)skip.onclick=()=>{
    if(st.latest===_skipVer){try{localStorage.removeItem("airow_skipver");}catch(e){}_skipVer=null;}
    else{try{localStorage.setItem("airow_skipver",st.latest);}catch(e){}_skipVer=st.latest;}
    loadSettingsUpdates();};
}

function inlineMd(s){return s.replace(/`([^`]+)`/g,'<code class="md-code">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function mdLite(md){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const lines=esc(md).split('\n');let out=[],inCode=false,inList=false;
  for(const ln of lines){
    if(/^```/.test(ln)){out.push(inCode?'</pre>':'<pre class="md-pre">');inCode=!inCode;continue;}
    if(inCode){out.push(ln);continue;}
    let m;
    if((m=ln.match(/^(#{1,6})\s(.*)/))){if(inList){out.push('</ul>');inList=false;}const l=m[1].length;out.push(`<div class="md-h md-h${l}">${inlineMd(m[2])}</div>`);continue;}
    if(/^\s*[-*]\s/.test(ln)){if(!inList){out.push('<ul class="md-ul">');inList=true;}out.push(`<li>${inlineMd(ln.replace(/^\s*[-*]\s/,''))}</li>`);continue;}
    if(/^\s*\|/.test(ln)){out.push(`<div class="md-tr mono">${inlineMd(ln)}</div>`);continue;}
    if(/^(---+|===+)\s*$/.test(ln)){out.push('<hr class="md-hr">');continue;}
    if(inList){out.push('</ul>');inList=false;}
    out.push(ln.trim()===''?'<div class="md-sp"></div>':`<p class="md-p">${inlineMd(ln)}</p>`);
  }
  if(inCode)out.push('</pre>');if(inList)out.push('</ul>');
  return out.join('\n');
}

let pinFails=0,pinLockUntil=0;
function askPin(kind){const want=kind==="admin"?(CFG&&CFG.adminPin):(CFG&&CFG.techPin);const label=kind==="admin"?"Admin":"Technician";
  if(!want){toast("No "+label.toLowerCase()+" access code is set for this site — sign in with "+(kind==="admin"?"an admin":"a technician")+" account.");return;}
  if(Date.now()<pinLockUntil){toast("Too many wrong codes — try again in "+Math.ceil((pinLockUntil-Date.now())/1000)+" seconds");return;}
  modal(head(`${label} passcode`)+`<div class="modal-body">
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:12px">Enter the ${label.toLowerCase()} passcode to unlock ${kind==="tech"?"technician / cycle diagnostics":"advanced settings"} for this session.</div>
    <input id="pin" class="pin-input" inputmode="numeric" maxlength="4" placeholder="••••">
    <div class="err-text" id="pinerr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="pinok">Unlock</button></div></div>`);
  const inp=document.getElementById("pin");inp.focus();
  const submit=()=>{if(inp.value===want){pinFails=0;if(kind==="admin")elev.admin=true;else{elev.tech=true;view="cycle";}recomputeSession();
      renderWho();closeModal();if(kind==="admin")openSettings();else renderAll();}
    else{pinFails++;if(pinFails>=5){pinFails=0;pinLockUntil=Date.now()+60000;closeModal();toast("Too many wrong codes — locked for one minute");return;}
      document.getElementById("pinerr").textContent="Incorrect passcode.";inp.value="";inp.focus();}};
  document.getElementById("pinok").onclick=submit;inp.onkeydown=e=>{if(e.key==="Enter")submit();};
}

function snowBurst(icon){let l=document.getElementById("fxlayer");if(!l){l=document.createElement("div");l.id="fxlayer";document.body.appendChild(l);}

const KINDS={wall:"Wall mount",cassette4:"4-way cassette",cassette1:"1-way cassette",ducted:"Ducted",floor:"Floor standing",ceiling:"Ceiling suspended"};
/* top-down airflow directions per indoor-unit type (N/E/S/W, viewed from the ceiling) */
const KIND_DIRS={wall:["S"],cassette4:["N","E","S","W"],cassette1:["S"],ducted:["S"],ceiling:["E","W"],floor:["N"]};
/* top-down body box [x,y,w,h] in the 96x96 viewBox */
const KIND_BOX={wall:[16,11,64,15],cassette4:[27,27,42,42],cassette1:[21,30,54,30],ducted:[19,24,58,20],ceiling:[12,40,72,16],floor:[34,54,28,30]};
function modeColor(u){if(!u.on)return "var(--stopped,#8a94a6)";return ({heat:"#f5713b",cool:"#2f8ff5",dry:"#13b6c8",fan:"#9aa3b2"})[u.mode]||"#2fbf71";}
/* one animated airflow "puff" leaving a body edge in direction d */
function ugPuff(d,bx,by,bw,bh,off,reach,dur,begin,col){
  const cx=bx+bw/2,cy=by+bh/2;let x,y,w,h,tx=0,ty=0;
  if(d==="S"){x=cx+off;y=by+bh+2;w=11;h=3.4;ty=reach;}
  else if(d==="N"){x=cx+off;y=by-2;w=11;h=3.4;ty=-reach;}
  else if(d==="E"){x=bx+bw+2;y=cy+off;w=3.4;h=11;tx=reach;}
  else {x=bx-2;y=cy+off;w=3.4;h=11;tx=-reach;}
  const r=Math.min(w,h)/2;
  return `<g opacity="0"><rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="${r}" fill="${col}"/>`
    +`<animateTransform attributeName="transform" type="translate" values="0 0;${tx} ${ty}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`
    +`<animate attributeName="opacity" values="0;.9;0" keyTimes="0;.25;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
}
/* top-down SVG of an indoor unit that animates its live state. lite = fewer streams (cards) */
function unitGraphic(u,cls,lite){
  const kind=KINDS[u.kind]?u.kind:"wall";const on=!!u.on;const col=on?modeColor(u):"#8a94a6";
  const [bx,by,bw,bh]=KIND_BOX[kind];const cx=bx+bw/2,cy=by+bh/2;
  const dur=({low:2.4,med:1.5,high:.85})[u.fan]||1.5;
  const panel='fill="rgba(130,138,150,.16)" stroke="rgba(130,138,150,.55)" stroke-width="1.4"';
  const grille='fill="none" stroke="rgba(130,138,150,.5)" stroke-width="1.2"';
  const led=`<circle cx="C" cy="Y" r="R" fill="${col}" opacity="${on?.95:.6}"/>`;
  let body="";
  if(kind==="cassette4"){
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" ${panel}/>`
      +`<rect x="${bx+6}" y="${by+6}" width="${bw-12}" height="${bh-12}" rx="3" ${grille}/>`
      +`<line x1="${bx+9}" y1="${by+6}" x2="${bx+bw-9}" y2="${by+6}" ${grille}/>`
      +`<line x1="${bx+9}" y1="${by+bh-6}" x2="${bx+bw-9}" y2="${by+bh-6}" ${grille}/>`
      +`<line x1="${bx+6}" y1="${by+9}" x2="${bx+6}" y2="${by+bh-9}" ${grille}/>`
      +`<line x1="${bx+bw-6}" y1="${by+9}" x2="${bx+bw-6}" y2="${by+bh-9}" ${grille}/>`
      +led.replace("C",cx).replace("Y",cy).replace("R",5.6);

/* ---- 30-day timestamped data log + trends ---- */
const DAY=86400000, TPAL=["#3b82f6","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16"];
function trendChart(series,range){
  const W=720,H=300,pl=42,pr=14,ptp=16,pb=48,now=Date.now(),t0=now-range;
  const S=series.map((s,i)=>({...s,color:s.color||TPAL[i%TPAL.length],P:s.pts.filter(p=>p.t>=t0)}));
  const ys=[].concat(...S.map(s=>s.P.map(p=>p.y)));
  if(!ys.length)return '<div style="color:var(--text-faint);padding:24px">No data in this range.</div>';
  let mn=Math.floor(Math.min(...ys)-2),mx=Math.ceil(Math.max(...ys)+2);if(mn===mx){mn--;mx++;}
  const X=t=>pl+(t-t0)/range*(W-pl-pr),Y=v=>H-pb-(v-mn)*(H-ptp-pb)/(mx-mn);
  const grid=[mn,Math.round((mn+mx)/2),mx].map(v=>`<line x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${W-pr}" y2="${Y(v).toFixed(1)}" stroke="var(--border)"/><text x="6" y="${(Y(v)+4).toFixed(1)}" fill="var(--text-faint)" font-size="11">${v}</text>`).join("");
  const ticks=[0,.25,.5,.75,1].map(f=>{const t=t0+f*range,d=new Date(t);const lab=range<=2*DAY?d.toLocaleTimeString([], {hour:'2-digit'}):(d.getMonth()+1)+'/'+d.getDate();return `<text x="${X(t).toFixed(1)}" y="${H-pb+16}" fill="var(--text-faint)" font-size="10" text-anchor="middle">${lab}</text>`;}).join("");

   <div class="auth-body"><h2>Sign in</h2><div class="auth-sub">${ue(site)}</div>
    <label class="flabel">Username</label><input id="li-user" class="inp" autocomplete="off">
    <label class="flabel">Password</label><input id="li-pass" type="password" class="inp">
    <div class="err-text" id="li-err">${ue(err||"")}</div>
    <button class="btn primary" id="li-go" style="width:100%;justify-content:center;padding:12px">Sign in</button>
    <div style="display:flex;justify-content:space-between;margin-top:14px">
      <button class="linklike" id="li-recover">Trouble signing in?</button></div>
   </div></div></div>`;
  // (The old "Re-run setup" link is gone from this screen: it let anyone who could reach the login page
  //  replace every account and wipe the site without a password. Setup is re-run from Settings ▸ Advanced.)
  const go=()=>{
    if(Date.now()<authLockUntil){showLogin("Too many attempts — wait "+Math.ceil((authLockUntil-Date.now())/1000)+" seconds and try again.");return;}
    const un=document.getElementById("li-user").value.trim();const pw=document.getElementById("li-pass").value;
    const u=(CFG.users||[]).find(x=>x.username===un);
    if(u&&u.passhash===hash(pw)){authFails=0;enterApp(u);}
    else{authFail();showLogin("Wrong username or password.");}};
  document.getElementById("li-go").onclick=go;
  document.getElementById("li-pass").onkeydown=e=>{if(e.key==="Enter")go();};
  document.getElementById("li-user").onkeydown=e=>{if(e.key==="Enter")document.getElementById("li-pass").focus();};
  document.getElementById("li-recover").onclick=recoverFlow;}
let authFails=0,authLockUntil=0;                               // slow down guessing: 5 misses → 30 s pause
function authFail(){authFails++;if(authFails>=5){authFails=0;authLockUntil=Date.now()+30000;}}
function recoverFlow(){showScreen("login");
  document.getElementById("screen-login").innerHTML=`<div class="auth"><div class="auth-card">
   <div class="auth-head"><div class="auth-logo"><span class="logo">${LOGO}</span>Account recovery</div></div>
   <div class="auth-body"><h2>Enter recovery code</h2><div class="auth-sub">The per-site code from commissioning. Resets the owner password.</div>
    <input id="rc" class="inp mono" placeholder="CORTEX-SITE-XXXX-XXXX">
    <div class="err-text" id="rc-err"></div>
    <button class="btn primary" id="rc-go" style="width:100%;justify-content:center;padding:12px">Verify</button>
    <div style="text-align:center;margin-top:14px"><button class="linklike" onclick="showLogin()">Back to sign in</button></div>
   </div></div></div>`;
  document.getElementById("rc-go").onclick=()=>{
    if(Date.now()<authLockUntil){document.getElementById("rc-err").textContent="Too many attempts — wait "+Math.ceil((authLockUntil-Date.now())/1000)+" seconds.";return;}
    const code=document.getElementById("rc").value.trim().toUpperCase();
    if(CFG&&CFG.recovery&&code&&code===String(CFG.recovery).toUpperCase()){authFails=0;resetOwner();}
    else{authFail();document.getElementById("rc-err").textContent="That code doesn't match this site.";}};}
function resetOwner(){const owner=CFG.users.find(u=>u.protected)||CFG.users[0];

    if(a.length<4){document.getElementById("np-err").textContent="Use at least 4 characters.";return;}

    owner.passhash=hash(a);saveCfg(CFG);enterApp(owner);};}

// Real bus discovery during setup. Connects the adapter (the button click is the user gesture that
// Web Serial needs), runs the cmd0 sweep, and stashes results in MASTER.found. Units are actually
// created at provision() time (after CFG exists), so this can't touch the not-yet-provisioned app.
async function runScan(){
  WZ.scan={prog:0,cur:0,found:[],done:false,scanning:true,error:""};renderWizard();
  try{ if(!bus.port) await busConnect(); }catch(e){}
  if(!bus.port){WZ.scan={prog:0,cur:0,found:[],done:false,scanning:false,
    error:"Couldn't open the adapter. Plug in your USB-RS485 adapter and try again — or skip this and scan later from Tech → Bus scan."};renderWizard();return;}
  const tick=setInterval(()=>{if(WZ.scan&&MASTER.scan){WZ.scan.cur=MASTER.scan.cur;WZ.scan.prog=MASTER.scan.done/MASTER.scan.total;
    WZ.scan.found=[...MASTER.found.entries()].map(([a,r])=>({addr:a,ch:"CH1",group:r&&r.parsed?r.parsed.group:0}));wzScanTick();}},300);
  let n=0;try{n=await masterDiscover();}catch(e){}
  clearInterval(tick);
  WZ.scan={prog:1,cur:0xFE,done:true,scanning:false,error:"",
    found:[...MASTER.found.entries()].map(([a,r])=>({addr:a,ch:"CH1",group:r&&r.parsed?r.parsed.group:0}))};
  renderWizard();
}
function wzScanStat(s){if(s.done)return "✓ Scan complete";
  const secs=Math.ceil((0xFE-s.cur)*(MASTER.turnaround+MASTER.timeout)/1000);return "Checking address "+hx(s.cur)+" · about "+fmtEta(secs)+" left";}
function wzScanFound(s){return s.found.map(f=>`<div>✓ ${hx(f.addr)} · system #${ue(f.group)}</div>`).join("")||'<div style="color:var(--text-faint)">listening…</div>';}
// While the scan runs only the numbers change — updating them in place keeps the loader animation smooth
// (a full re-render every 300 ms would restart it each time).
function wzScanTick(){const s=WZ&&WZ.scan,bar=document.getElementById("wz-bar");
  if(!s||!bar){renderWizard();return;}
  bar.style.width=Math.round(s.prog*100)+"%";
  const st=document.getElementById("wz-stat");if(st)st.textContent=wzScanStat(s);
  const ct=document.getElementById("wz-cnt");if(ct)ct.textContent=s.found.length+" found";
  const fl=document.getElementById("wz-found");if(fl)fl.innerHTML=wzScanFound(s);}
function renderWizard(){const s=WSTEPS[WZi];
  document.getElementById("screen-setup").innerHTML=`<div class="auth"><div class="auth-card wiz">
    <div class="auth-head"><div class="auth-logo"><span class="logo">${LOGO}</span>Cortex · Setup</div></div>
    <div class="wiz-steps">${WSTEPS.map((_,i)=>`<div class="wiz-dot ${i<WZi?'done':''} ${i===WZi?'cur':''}"></div>`).join("")}</div>
    <div class="auth-body"><div class="step-num">Step ${WZi+1} of ${WSTEPS.length}</div>
      <h2>${s.title}</h2>${s.sub?`<div class="auth-sub">${s.sub}</div>`:""}
      <div id="wzerr" class="err-text"></div>${s.body()}</div>
    <div class="wiz-foot"><button class="btn" id="wback" ${WZi===0?'style="visibility:hidden"':''}>Back</button>
      <button class="btn primary" id="wnext">${WZi===WSTEPS.length-1?'Finish setup':'Continue'}</button></div>
  </div></div>`;
  if(s.wire)s.wire();
  document.getElementById("wback").onclick=()=>{if(WZi>0){WZi--;renderWizard();}};
  document.getElementById("wnext").onclick=()=>{const err=s.save?s.save():null;
    if(err){document.getElementById("wzerr").textContent=err;return;}
    if(WZi===WSTEPS.length-1)provision();else{WZi++;renderWizard();}};}
function provision(){
  const rc="CORTEX-"+(WZ.site.name||"SITE").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+"-"+Math.random().toString(16).slice(2,6).toUpperCase()+"-"+Math.random().toString(16).slice(2,6).toUpperCase();
  const old=(CFG&&CFG.provisioned)?CFG:null;                      // re-running setup on a working site
  const scanned=!!(WZ.scan&&WZ.scan.done);                        // did THIS run of the wizard scan the bus?
  CFG={provisioned:true,site:{name:WZ.site.name,location:WZ.site.location,unit:WZ.site.unit},
    protocols:(WZ.protocols&&WZ.protocols.length?WZ.protocols:["lg"]),
    adminPin:WZ.adminPin,techPin:WZ.techPin,recovery:rc,remote:WZ.remote,unitMeta:{},
    schedules:[],                                              // start empty — users build their own
    users:[{id:1,name:WZ.owner.name,username:WZ.owner.username,passhash:hash(WZ.owner.pass),role:"owner",protected:true},
      ...WZ.team.map((t,i)=>({id:2+i,name:t.name,username:t.username,passhash:hash(t.pass),role:t.role}))]};
  settings.unit=WZ.site.unit;CFG.gen=WZ.gen||"4";CFG.baud=(WZ.gen==="5")?9600:4800;
  // Re-running setup replaces the site details, logins and access codes — it must NOT throw away the
  // work that is already there: unit names/tags, schedules, floor plans, limits, the weather location.
  if(old){["unitMeta","schedules","floorplans","spMinF","spMaxF","sessionTimeoutMin","wxOverride","custCtl","custAll","ignoreAddrs"].forEach(k=>{if(old[k]!==undefined)CFG[k]=old[k];});
    if(old.site){["lat","lon"].forEach(k=>{if(old.site[k]!=null)CFG.site[k]=old.site[k];});}}
  WZ=null;
  saveSettings();saveCfg(CFG);
  // keep the appliance's own site name (used by /health and the fleet console) in step with this one
  if(location.protocol!=="file:"){try{fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:CFG.site.name})}).catch(()=>{});}catch(e){}}
  enterApp(CFG.users[0]);
  if(scanned&&MASTER.found&&MASTER.found.size){masterImport(); // add units found by the wizard's bus scan…
    if(bus.port&&!MASTER.running)masterLoopRun();}             // …and go live straight away (the scan step already had the LG central disconnected)
  else pullUnits();
}

boot();
