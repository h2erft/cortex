  BUS / FRAME FORMAT  (confidence: CONFIRMED / LIKELY / GUESS)
  - Serial 4800 8N1                                                     CONFIRMED
  - Every frame is 8 bytes:  b0 b1 A0 addr b4 b5 b6 ck                  CONFIRMED
  - ck = (sum of b0..b6) & 0xFF, XOR 0x55                               CONFIRMED
  - Addresses seen on a live bus: 0x81-0xD3 plus 0x25.
  - Frame types by b0 b1:
      80 00 / 84 00  CC -> unit "state" frame, repeated every sweep. Also carries changes.
                     (80 vs 84 is fixed per address; meaning unknown. Preserve it.)
      80 B0 / 80 B2  poll frames, payload all zeros.
      80 A3 / 84 A3  same payload as 80 00, sent occasionally. Meaning unknown.
      A0 00          unit status reply (b4=09, b5=8x, b6). b6 here did NOT follow the
                     command's b6 after a change — it is not the setpoint.
      F0 C0 / C8 C0  scan / system frames, unknown.
      09 20 A0 00 87 08 05 08  seen 4x, unknown.

  THE COMMAND (decoded from the operator's 2026-11-07 capture at the CC)
  - A change is just the 80/84 00 frame with b4 bit1 set:
      b4 = 03 (on + change) or 02 (off + change), sent ONCE; then the CC goes back to
      sending 01 (on) / 00 (off) every sweep.                           CONFIRMED
  - b5 LOW nibble = MODE:  cool=0, dry=1, fan=2, auto=3, heat=4 — ALL CONFIRMED 2026-11-08
      from the firmware mode->code strcmp chain (@0x380c8). MODELO now matches.
  - b5 HIGH nibble = FAN:  low=1, med=2, high=3 — CONFIRMED 2026-11-08 (AC stores fan as
      "fan1".."fan6"; the digit IS the speed code). "AUTO" fan is a separate token (code TBD).
  - b6 = NOT the setpoint. SOLVED 2026-11-07 by disassembling the ACP firmware: the
      8-byte basic frame carries only power/mode/fan. The setpoint travels in a
      SEPARATE 16-byte "cmd5" frame (see SETPOINT below). Cortex preserves last-seen b6.
  - Swing: no data yet.

  SETPOINT — SOLVED 2026-11-07 from firmware (UpdateMonitorCmd5 / ProcessRxDataFromACCmd5
  in the control-engine ELF; constants read straight out of the binary):
  - Temperature rides a 16-byte "cmd5" frame, checksum same rule over the first 15 bytes.
  - byte10 & 0x7F = COOLING setpoint whole °C ; byte11 & 0x7F = HEATING setpoint whole °C
    (LG keeps cool & heat setpoints SEPARATELY).
  - byte12 high nibble (0-9) = cool decimal, low nibble (0-9) = heat decimal;
    setpoint °C = whole + decimal * 0.1  (0.1°C resolution, multiplier 0.1 confirmed in code).
  - bytes 6-9 = temp limits: (byte & 0x7F)°C + (top bit ? 0.5 : 0).
  - Simpler status frames encode a setpoint as (nibble + 15) °C for the 15-30°C range.
  - Wire is CELSIUS. Code: decodeCmd5() + cmd5SetpointBytes() in cortex.html.
  - HEADER — SOLVED 2026-11-08 by disassembling the builder CopyControlData_to_sendControlacCmd5
    (ELF elf_36345344, func @0x343b0). The outgoing cmd5 is FULLY known now, no guessing:
      [0]=A8 (mvn #0x57)  [1]=00  [2]=A0  [3]=addr  [4]=10 (cmd5 id)  [5]=flags(bit0=power on)
      [6..9]=limits (cool lo/hi, heat lo/hi): (byte&0x7F)degC + (top bit ? 0.5 : 0)
      [10]=cool whole degC &0x7F   [11]=heat whole degC &0x7F   [12]=(cool_dec<<4)|heat_dec
      [13]=reserved/mode
      [14]=ap_mkchksum(buf,14)=(sum[0..13]^0x55)&0xFF
      [15]=(ap_mkchksum(buf,15)+1)&0xFF
    cmd5 marker is A8 (NOT the 80 of the basic frame). TWO checksums (14 and 15). ap_mkchksum
    (func @0x21674) = (sum ^ 0x55) & 0xFF — verified in code, == our lgapCk.
    Cortex's cmd5SetpointBytes() now builds this exactly. Verified round-trip:
      cool 23.5 / heat 20 -> A8 00 A0 A7 10 01 95 99 12 16 17 14 50 00 84 01.
    LAST STEP IS JUST A REAL-UNIT SANITY TX (does the unit obey) — the bytes are certain.

  - We spent most of a session trying to CAPTURE a real setpoint command off the bench ACP.
    It cannot work: the operator's bench ACP has NO indoor units on it, so the ACP only POLLS

    him down this path again. A setpoint command on the wire requires a real IDU present.
  - Serial-capture gotchas we burned hours on (so you don't): (a) CoolTerm defaults to 9600;
    the LG bus is 4800 -> 2x/4x byte "smear". (b) Web Serial in Chrome CHOKES on this noisy
    2-wire RS485 line (RXD lights then dies) - CoolTerm's native FTDI driver is fine; this is
    why the appliance backend (serialport lib) exists. (c) A COM port is single-owner: CoolTerm
    and Cortex can't both hold it. (d) Parity/databits mismatch leaves structure but mangles
    values (tell: a constant low-bit pattern in the address field every frame). Adapter = FT232R
    on COM9. Even at 4800 8N1/8E1/8O1 the bench poll frames (FE BF.. / 36 7E.. / F0 FC.. / 3E 7E..)
    never matched the documented 80 00 A0 format or validated a checksum - consistent with
    "this is unit-less poll traffic in a different frame type", not the command frame.
  - WHAT THE FIRMWARE ACTUALLY SAYS (control-engine ELF, strings + ARM disasm, confirmed):
    * Setpoints live in a SQLite 'ac' table as cool_settemp / heat_settemp, stored as degC
      with ONE decimal (%.1f). Dual-setpoint is real: twoset_automode, twoset_avail, deadband.
    * To command a unit the engine sets exe_cmd5='ON', exe_cmd5_cnt='10' on that addr, then
      CopyControlData_to_sendControlacCmd5() copies the control-data struct into rs485buf_tx
      and ap_mkchksum stamps the checksum. So the cmd5 TEMPERATURE bytes we already encode are
      correct; the header bytes come from that struct (runtime state), not literal constants.
    * cmd5 vs cmd6 are SEPARATE per-unit actions (exe_cmd5 / exe_cmd6). cmd5 carries setpoint.
    * SQL seen: "UPDATE ac SET cool_settemp=%.1f, exe_cmd5='ON', exe_cmd5_cnt='10' WHERE addr=%s"
      and the heat_settemp twin. This is the authoritative setpoint path.
  - 2026-11-08 FIRMWARE CONFIRMS (all from static analysis, no wire needed):
    * MODE codes: cool=0 dry=1 fan=2 auto=3 heat=4 (strcmp chain @0x380c8). In Cortex MODELO.
    * FAN codes: low=1 med=2 high=3 (fanN token digit = speed). In Cortex FANHI.
    * LOCK bits in the cmd4 control frame byte4: modelock=0x08, fanlock=0x04, settemplock=0x02,
      power=0x01 (from SELECT col order modelock,fanlock,settemplock + struct offsets). Locks
      are stored/shown in Cortex; not yet transmitted (unsure if they also ride the 80 frame).
    * cmd6 is a sibling 16-byte A8 frame (second per-unit control; occupancy/setback-ish).
  - RECOMMENDED NEXT MOVE (cheap, honest): don't capture. Either (a) get the cmd5 frame layout
    from the operator's outside collaborator (he pulled it from this same firmware) and cross-check,
    or (b) at a REAL site, have Cortex TX its firmware-derived cmd5 to ONE unit, CC unplugged,
    and watch the unit obey. One of those closes the header-byte gap for good.

  HISTORY / LESSONS
  - The first decode (by the earlier chat) had mode in the HIGH nibble (auto=1, cool=2,
    heat=3) and setpoint = degC-15. That was wrong: the high nibble is FAN. So Cortex's
    earlier "cool" commands actually went out as auto mode + med fan, and "heat" as
    auto + HIGH fan. That probably explains the "fan went high" result.
  - Lesson: only trust byte meanings from a controlled change made at the real CC
    (one unit, one setting, written down), never from steady-state traffic.

  CAPTURE 2026-11-07 (bus_capture_1794089122388.txt)
  - A7 at CC: cool, low fan, 64F, on, swing clear -> 80 00 A0 A7 03 10 05 8A, then 01 10 05
  - A6 at CC: heat, med fan, 80F, on, swing clear -> 80 00 A0 A6 03 24 06 A6, then 01 24 06
  - Later in the same capture A6 went 02 34 06 (OFF, heat, fan high) twice. the operator did
    not mention doing this. Ask him: was it him, a CC schedule, or something else?

  NEXT STEPS
  1. DONE 2026-11-08: cmd5 header fully recovered from the firmware builder (see SETPOINT block).
     Cortex's cmd5SetpointBytes() is firmware-exact. Only remaining: a single real-unit sanity
     TX at a live site (CC unplugged) to confirm the unit obeys. No more bench captures needed.
  2. Fan high / auto, and dry / fan modes, to fill in the remaining mode/fan GUESS rows.
  3. Wire decodeCmd5()/cmd5SetpointBytes() into the UI (show cool+heat setpoints; send).
  4. Bench test TX on the spare ACP / one unit after hours, CC unplugged.
  5. Cycle view (outdoor-unit temps/pressures) is NOT on the CC bus as far as the operator knows —
     the LG CC has never been able to show it; it lives on a different bus. Don't assume the
     CC bus can provide it. (The earlier chat knew this; corrected 2026-11-07.)

/* AIROW Control — custom LG VRF central controller UI (prototype)
   layout: top bar + left nav + unit grid/list + right control drawer + modals */
:root{

}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}

button{font-family:inherit;cursor:pointer}

header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}

.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s,transform .12s;overflow:hidden}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
.card-name{font-weight:600;font-size:14.5px}

/* ---- updates ---- real OTA check against the appliance backend ---- */
let updateState=null;  // null = not checked yet; else {current,latest,updateAvailable,configured,error,checkedAt,checking}
function ue(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function doUpdateCheck(){
  updateState={checking:true}; renderUpdates();
  try{
    const r=await fetch('/api/update/check',{cache:'no-store'});
    updateState=await r.json();
  }catch(e){
    updateState={error:'Could not reach the update service — this screen works on the installed appliance, not the file:// demo.'};
  }
  renderUpdates();
}
function renderUpdates(){renderGroupNav();
  if(updateState===null){ doUpdateCheck(); return; }   // auto-check the first time the page opens
  const s=updateState, cur=s.current||'—';
  let badge='', body='';
  if(s.checking){ badge='<span class="badge-ok">Checking…</span>'; }
  else if(s.updateAvailable){ badge='<span class="badge-new">Update available</span>';
    body=`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-weight:600">v${ue(s.latest)} is available</div>
      ${s.notes?`<div style="font-size:13.5px;color:var(--text-dim);margin-top:6px">${ue(s.notes)}</div>`:''}
      <div class="note-box" style="margin-top:12px">This controller installs updates automatically within about 30 minutes — it verifies the download first and rolls back on its own if anything's wrong. No action needed here.</div></div>`; }
  else if(s.configured===false){ body=`<div class="note-box" style="margin-top:12px">Automatic updates aren't turned on for this controller yet.</div>`; }
  else if(s.error){ body=`<div class="note-box" style="margin-top:12px">Couldn't check for updates: ${ue(s.error)}</div>`; }
  else if(s.latest){ badge='<span class="badge-ok">Up to date</span>'; }
  main.innerHTML=`<div class="update-card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div>
      <div style="font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px">This controller</div>
      <div class="ver-big">Cortex v${ue(cur)}</div>
      <div style="font-size:13px;color:var(--text-dim)">${ue((CFG&&CFG.site&&CFG.site.name)||'Site')}${s.checkedAt?' · checked '+new Date(s.checkedAt).toLocaleTimeString():''}</div></div>
      ${badge}</div>
    ${body}
    <div style="margin-top:14px"><button class="btn" id="check" ${s.checking?'disabled':''}>${s.checking?'Checking…':'Check for updates'}</button></div>
  </div>`;
  const ch=document.getElementById("check"); if(ch) ch.onclick=doUpdateCheck;}

    drawer.querySelectorAll("[data-fan]").forEach(b=>b.onclick=()=>{p.fan=b.dataset.fan;re2();});
    g("spup",()=>{setActiveC(p,spStep(activeC(p),+1));re2();});
    g("spdn",()=>{setActiveC(p,spStep(activeC(p),-1));re2();});
    g("cup",()=>{p.coolC=spStep(p.coolC,+1);re2();});
    g("cdn",()=>{p.coolC=spStep(p.coolC,-1);re2();});
    g("hup",()=>{p.heatC=spStep(p.heatC,+1);re2();});
    g("hdn",()=>{p.heatC=spStep(p.heatC,-1);re2();});
    g("lk-mode",()=>{p.modeLock=!p.modeLock;re2();});
    g("lk-fan",()=>{p.fanLock=!p.fanLock;re2();});
    g("lk-temp",()=>{p.tempLock=!p.tempLock;re2();});
    g("two-toggle",()=>{p.twoset=!p.twoset;re2();});
  }
}

/* ---- protocol reference viewer (the "what we know" doc, served by the appliance) ---- */
function inlineMd(s){return s.replace(/`([^`]+)`/g,'<code class="md-code">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function mdLite(md){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const lines=esc(md).split('\n');let out=[],inCode=false,inList=false;
  for(const ln of lines){
    if(/^```/.test(ln)){out.push(inCode?'</pre>':'<pre class="md-pre">');inCode=!inCode;continue;}
    if(inCode){out.push(ln);continue;}
    let m;
    if((m=ln.match(/^(#{1,6})\s(.*)/))){if(inList){out.push('</ul>');inList=false;}const l=m[1].length;out.push(`<div class="md-h md-h${l}">${inlineMd(m[2])}</div>`);continue;}
    if(/^\s*[-*]\s/.test(ln)){if(!inList){out.push('<ul class="md-ul">');inList=true;}out.push(`<li>${inlineMd(ln.replace(/^\s*[-*]\s/,''))}</li>`);continue;}
    if(/^\s*\|/.test(ln)){out.push(`<div class="md-tr mono">${inlineMd(ln)}</div>`);continue;}
    if(/^(---+|===+)\s*$/.test(ln)){out.push('<hr class="md-hr">');continue;}
    if(inList){out.push('</ul>');inList=false;}
    out.push(ln.trim()===''?'<div class="md-sp"></div>':`<p class="md-p">${inlineMd(ln)}</p>`);
  }
  if(inCode)out.push('</pre>');if(inList)out.push('</ul>');
  return out.join('\n');
}

/* ---- 30-day timestamped data log + trends ---- */
const DAY=86400000, TPAL=["#3b82f6","#ef4444","#10b981","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#f97316","#6366f1","#84cc16"];
function histLog(u){ // ~30 days of timestamped samples, generated once per unit and cached
  if(u._hist)return u._hist;
  const N=360, step=DAY*30/N, now=Date.now(), pts=[];let r=u.room||72;
  let errIdx = u.err ? N-3 : (u.id%4===0 ? N-1-((u.id*7)%250) : -1); // ongoing error, or a past transient
  let transient = !u.err;
  for(let i=0;i<N;i++){const t=now-(N-1-i)*step;const hr=new Date(t).getHours();
    const night=hr<6||hr>=20;const sp=(u.sp||72)+(night?(u.mode==='heat'?-3:3):0);
    r+=(Math.random()-0.5)*1.4+(sp-r)*0.1;
    let err=null,errStart=false;
    if(errIdx>=0){
      if(i>=errIdx-7&&i<errIdx)r+=(u.mode==='heat'?1.3:-1.3); // pre-error drift
      if(i===errIdx)errStart=true;
      if(i>=errIdx)err=u.err?u.code:"CH05";
      if(transient&&i>errIdx+5)err=null; // transient cleared
    }
    pts.push({t,room:+r.toFixed(1),sp,load:Math.max(0,Math.min(100,Math.round((u.zoneLoad||40)+(Math.random()-0.5)*22))),pipeOut:(u.pipeOut||62)+Math.round((Math.random()-0.5)*6),err,errStart});
  }
  u._hist=pts;return pts;}
function trendChart(series,range){
  const W=720,H=300,pl=42,pr=14,ptp=16,pb=48,now=Date.now(),t0=now-range;
  const S=series.map((s,i)=>({...s,color:s.color||TPAL[i%TPAL.length],P:s.pts.filter(p=>p.t>=t0)}));
  const ys=[].concat(...S.map(s=>s.P.map(p=>p.y)));
  if(!ys.length)return '<div style="color:var(--text-faint);padding:24px">No data in this range.</div>';
  let mn=Math.floor(Math.min(...ys)-2),mx=Math.ceil(Math.max(...ys)+2);if(mn===mx){mn--;mx++;}
  const X=t=>pl+(t-t0)/range*(W-pl-pr),Y=v=>H-pb-(v-mn)*(H-ptp-pb)/(mx-mn);
  const grid=[mn,Math.round((mn+mx)/2),mx].map(v=>`<line x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${W-pr}" y2="${Y(v).toFixed(1)}" stroke="var(--border)"/><text x="6" y="${(Y(v)+4).toFixed(1)}" fill="var(--text-faint)" font-size="11">${v}</text>`).join("");
  const ticks=[0,.25,.5,.75,1].map(f=>{const t=t0+f*range,d=new Date(t);const lab=range<=2*DAY?d.toLocaleTimeString([], {hour:'2-digit'}):(d.getMonth()+1)+'/'+d.getDate();return `<text x="${X(t).toFixed(1)}" y="${H-pb+16}" fill="var(--text-faint)" font-size="10" text-anchor="middle">${lab}</text>`;}).join("");
  const marks=S.map(s=>(s.markers||[]).filter(m=>m>=t0).map(m=>`<line x1="${X(m).toFixed(1)}" y1="${ptp}" x2="${X(m).toFixed(1)}" y2="${H-pb}" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="3 3" opacity=".75"/>`).join("")).join("");
  const lines=S.map(s=>`<path d="${s.P.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`).join("");
  const legend=S.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin:0 14px 6px 0;font-size:12px"><span style="width:11px;height:11px;border-radius:3px;background:${s.color}"></span>${s.name}${s.err?' <span style="color:var(--err)">⚠ error</span>':''}</span>`).join("");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${grid}${ticks}${marks}${lines}</svg><div style="margin-top:10px;display:flex;flex-wrap:wrap">${legend}</div>`;}
let trendCtx=null, trendRange=DAY;
function openTrends(ids,opts){trendCtx={ids:ids.slice(),opts:opts||{}};if(trendRange==null)trendRange=DAY;drawTrends();}
function drawTrends(){const {ids,opts}=trendCtx;const us=units.filter(u=>ids.includes(u.id));if(!us.length){closeModal();return;}
  const metric=opts.odu?"load":"room";
  const series=us.map(u=>{const h=histLog(u);return {name:dispName(u),pts:h.map(p=>({t:p.t,y:p[metric]})),markers:h.filter(p=>p.errStart).map(p=>p.t),err:u.err};});
  const title=(opts.odu?"Outdoor-cycle trend · ":"Trends · ")+(us.length>1?us.length+" units":dispName(us[0]));
  modal(head(title)+`<div class="modal-body">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      ${[["24 h",DAY],["7 days",7*DAY],["30 days",30*DAY]].map(r=>`<button class="btn sm ${trendRange===r[1]?'primary':''}" data-range="${r[1]}">${r[0]}</button>`).join("")}
      <div style="flex:1"></div><div style="font-size:12px;color:var(--text-dim)">${opts.odu?"Outdoor-unit load index":"Room temperature (°"+settings.unit+")"}</div></div>
    ${trendChart(series,trendRange)}
    <div class="note-box" style="margin-top:12px">Every reading is timestamped and kept ~30 days. Dashed lines mark when a unit tripped into error — widen the range to see how it was behaving beforehand. Sample data until the live bus is logging.</div>
  </div>`,true);
  mroot.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{trendRange=+b.dataset.range;drawTrends();});}

    <div><label class="flabel">Confirm</label><input id="wz-oconf" type="password" class="inp" value="${WZ.owner.confirm}"></div></div>`,
  save:()=>{WZ.owner.name=v("wz-oname").trim();WZ.owner.username=v("wz-ouser").trim();WZ.owner.pass=v("wz-opass");WZ.owner.confirm=v("wz-oconf");
    if(!WZ.owner.name||!WZ.owner.username)return "Enter your name and a username.";
    if(WZ.owner.pass.length<4)return "Password needs at least 4 characters.";
    if(WZ.owner.pass!==WZ.owner.confirm)return "Passwords don't match.";return null;}},
 {title:"Access codes",sub:"Short codes that unlock elevated features on top of a login.",
  body:()=>`<div class="note-box"><b>Admin code</b> unlocks advanced settings &amp; user management. <b>Technician code</b> reveals the hidden outdoor cycle diagnostics — customers never see it exists.</div>
   <div class="pinpair"><div><label class="flabel">Admin code (4 digits)</label><input id="wz-apin" class="inp mono" inputmode="numeric" maxlength="4" value="${WZ.adminPin}" placeholder="••••"></div>
    <div><label class="flabel">Technician code (4 digits)</label><input id="wz-tpin" class="inp mono" inputmode="numeric" maxlength="4" value="${WZ.techPin}" placeholder="••••"></div></div>`,
  save:()=>{WZ.adminPin=v("wz-apin").trim();WZ.techPin=v("wz-tpin").trim();
    if(!/^\d{4}$/.test(WZ.adminPin)||!/^\d{4}$/.test(WZ.techPin))return "Both codes must be 4 digits.";
    if(WZ.adminPin===WZ.techPin)return "Use different codes for admin and technician.";return null;}},
 {title:"Your team",sub:"Add people now, or skip and add them later in Settings.",
  body:()=>`${WZ.team.length?`<div style="margin-bottom:10px">${WZ.team.map((t,i)=>`<div class="team-row"><div><b>${t.name}</b> <span class="rchip ${t.role}">${t.role}</span><div style="font-size:12px;color:var(--text-faint)">${t.username}</div></div><button class="linklike" style="color:var(--err)" data-rm="${i}">Remove</button></div>`).join("")}</div>`:`<div class="note-box">No team members yet. Add one below, or continue.</div>`}
   <label class="flabel">Add a person</label>
   <input id="tm-name" class="inp" placeholder="Name"><input id="tm-user" class="inp" placeholder="Username">
   <div class="pinpair"><div><input id="tm-pass" type="password" class="inp" placeholder="Temp password"></div>
    <div><select id="tm-role" class="inp"><option value="customer">Customer</option><option value="admin">Admin</option><option value="technician">Technician</option></select></div></div>
   <button class="btn" id="tm-add">+ Add to team</button>`,
  wire:()=>{document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{WZ.team.splice(+b.dataset.rm,1);renderWizard();});
    const add=document.getElementById("tm-add");if(add)add.onclick=()=>{const n=v("tm-name").trim(),u=v("tm-user").trim();
      if(!n||!u){document.getElementById("wzerr").textContent="Name and username required to add.";return;}
      WZ.team.push({name:n,username:u,pass:v("tm-pass")||"changeme",role:v("tm-role")});renderWizard();};},
  save:()=>null},
 {title:"Remote access",sub:"Reach this controller securely from anywhere.",
  body:()=>`<div class="note-box">Recommended: <b>Tailscale</b> — a private network with no port forwarding, so the controller never sits on the open internet. (WireGuard works too.)</div>
   <div class="setrow"><div><div class="sl">Enable remote access</div><div class="sd">Sets up this controller's end at finish</div></div><button class="toggle ${WZ.remote.enabled?'on':''}" id="rm-tog"></button></div>
   <div id="rm-detail" class="${WZ.remote.enabled?'':'hide'}" style="margin-top:12px">
     <label class="flabel">This controller will join as</label><div class="recovery" style="color:var(--text)">cortex-${(WZ.site.name||'site').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,18)}</div>
     <div class="note-box" style="margin-top:12px">At finish you'll get a one-time join link. Install Tailscale on your phone or laptop, approve the device, and reach the dashboard at its private name — no public IP, no open ports.</div></div>`,
  wire:()=>{const t=document.getElementById("rm-tog");if(t)t.onclick=()=>{WZ.remote.enabled=!WZ.remote.enabled;renderWizard();};},
  save:()=>null},
 {title:"Equipment manufacturer",sub:"Which system are you installing on? This sets how Cortex listens to the bus.",
  body:()=>`<div class="note-box" style="margin-bottom:12px">Pick the primary system here. You can add more manufacturers to this site later in Settings → Advanced (a site can run mixed equipment).</div>
    <div class="opts" style="flex-direction:column;gap:8px">${Object.keys(PROTOCOLS).map(k=>{const p=PROTOCOLS[k];const on=WZ.protocols.includes(k);
      return `<button class="opt ${on?'sel':''}" data-proto="${k}" style="justify-content:space-between;text-align:left;width:100%">
        <span>${on?'✓ ':''}${p.label}</span><span style="font-size:11px;color:var(--text-faint)">${p.baud} ${p.dataBits}${p.parity[0].toUpperCase()}${p.stopBits} · ${p.phys} · ${p.decode==='full'?'full decode':'capture'}</span></button>`;}).join("")}</div>
    <div style="font-size:11.5px;color:var(--text-faint);margin-top:10px">Tap to toggle. LG has full decoding today; the others capture raw at the right settings for now. Non-RS485 systems need their own adapter.</div>`,
  wire:()=>{document.querySelectorAll("[data-proto]").forEach(b=>b.onclick=()=>{const k=b.dataset.proto;const i=WZ.protocols.indexOf(k);
    if(i>=0){if(WZ.protocols.length>1)WZ.protocols.splice(i,1);}else WZ.protocols.push(k);renderWizard();});},
  save:()=>WZ.protocols.length?null:"Pick at least one manufacturer."},
 {title:"Find indoor units",sub:"Scan the bus for connected units — like the ACP's auto-search.",
  body:()=>{ if(!WZ.scan) return `<div class="note-box">This polls every address on the central bus (0x00–0xFF) and lists the indoor units that answer, with their address and channel — the same discovery the LG ACP runs at commissioning. It only listens and asks; nothing on the units is changed.</div>
     <button class="btn primary" id="wz-scan" style="width:100%;justify-content:center">▶ Start bus scan</button>`;
    const s=WZ.scan;
    return `<div style="height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden"><div style="height:100%;width:${Math.round(s.prog*100)}%;background:var(--accent);transition:width .1s"></div></div>
     <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin:8px 0">
       <span>${s.done?'✓ Scan complete':'Scanning '+hx(s.cur)+' …'}</span><span class="mono">${s.found.length} found</span></div>
     <div class="mono" style="max-height:150px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;background:var(--surface-2)">
       ${s.found.map(f=>`<div>✓ ${hx(f.addr)} · ${f.ch} · AC_UNIT_${String(f.i).padStart(2,'0')}</div>`).join("")||'<div style="color:var(--text-faint)">listening…</div>'}</div>
     ${s.done?`<div class="note-box" style="margin-top:10px">Found <b>${s.found.length}</b> indoor units across CH1–CH2. You can rescan anytime from the technician view.</div>`:''}`;},
  wire:()=>{const b=document.getElementById("wz-scan");if(b)b.onclick=runScan;},
  save:()=>{if(!WZ.scan||!WZ.scan.done)return "Run the bus scan to find your units before continuing.";return null;}},
 {title:"Review & finish",sub:"",
  body:()=>`<div class="note-box">✓ Scanned the bus — found <b>${(WZ.scan&&WZ.scan.found.length)||units.length} indoor units</b> across CH1–CH2, 1 outdoor system.</div>
   <div class="sumrow"><span class="k">Site</span><span>${WZ.site.name||'—'}</span></div>
   <div class="sumrow"><span class="k">Owner</span><span>${WZ.owner.name} · ${WZ.owner.username}</span></div>
   <div class="sumrow"><span class="k">Team</span><span>${WZ.team.length} added</span></div>
   <div class="sumrow"><span class="k">Access codes</span><span>set</span></div>
   <div class="sumrow"><span class="k">Remote access</span><span>${WZ.remote.enabled?'Tailscale — enabled':'Off'}</span></div>
   <div style="margin-top:14px;font-size:12px;color:var(--text-faint)">Finishing creates your account and signs you in.</div>`,
  save:()=>null}
];
function runScan(){
  if(WZ.scan&&WZ.scan.t)clearInterval(WZ.scan.t);
  WZ.scan={prog:0,cur:0,found:[],done:false,t:null};
  const targets=units.map((u,i)=>({addr:u.addr,ch:u.ch,i})).sort((a,b)=>a.addr-b.addr);
  let k=0,addr=-1;renderWizard();
  WZ.scan.t=setInterval(()=>{
    addr+=Math.floor(5+Math.random()*9);if(addr>255)addr=255;
    WZ.scan.cur=addr;WZ.scan.prog=addr/255;
    while(k<targets.length&&targets[k].addr<=addr){WZ.scan.found.push(targets[k]);k++;}
    if(addr>=255){clearInterval(WZ.scan.t);WZ.scan.t=null;WZ.scan.done=true;WZ.scan.prog=1;}
    renderWizard();
  },110);
}
function renderWizard(){const s=WSTEPS[WZi];
  document.getElementById("screen-setup").innerHTML=`<div class="auth"><div class="auth-card wiz">
    <div class="auth-head"><div class="auth-logo"><span class="logo">${LOGO}</span>Cortex · Setup</div></div>
    <div class="wiz-steps">${WSTEPS.map((_,i)=>`<div class="wiz-dot ${i<WZi?'done':''} ${i===WZi?'cur':''}"></div>`).join("")}</div>
    <div class="auth-body"><div class="step-num">Step ${WZi+1} of ${WSTEPS.length}</div>
      <h2>${s.title}</h2>${s.sub?`<div class="auth-sub">${s.sub}</div>`:""}
      <div id="wzerr" class="err-text"></div>${s.body()}</div>
    <div class="wiz-foot"><button class="btn" id="wback" ${WZi===0?'style="visibility:hidden"':''}>Back</button>
      <button class="btn primary" id="wnext">${WZi===WSTEPS.length-1?'Finish setup':'Continue'}</button></div>
  </div></div>`;
  if(s.wire)s.wire();
  document.getElementById("wback").onclick=()=>{if(WZi>0){WZi--;renderWizard();}};
  document.getElementById("wnext").onclick=()=>{const err=s.save?s.save():null;
    if(err){document.getElementById("wzerr").textContent=err;return;}
    if(WZi===WSTEPS.length-1)provision();else{WZi++;renderWizard();}};}
function provision(){
  const rc="CORTEX-"+(WZ.site.name||"SITE").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+"-"+Math.random().toString(16).slice(2,6).toUpperCase()+"-"+Math.random().toString(16).slice(2,6).toUpperCase();
  CFG={provisioned:true,site:{name:WZ.site.name,location:WZ.site.location,unit:WZ.site.unit},
    protocols:(WZ.protocols&&WZ.protocols.length?WZ.protocols:["lg"]),
    adminPin:WZ.adminPin,techPin:WZ.techPin,recovery:rc,remote:WZ.remote,unitMeta:{},
    schedules:[
      {id:"s1",name:"Weekday setback",enabled:true,target:{type:"all",val:0},action:{power:"off",mode:"",fan:"",sp:null},time:"18:00",days:[1,2,3,4,5],cond:{op:"",temp:null}},
      {id:"s2",name:"Morning warmup",enabled:true,target:{type:"all",val:0},action:{power:"on",mode:"heat",fan:"",sp:71},time:"06:30",days:[1,2,3,4,5],cond:{op:"",temp:null}}],
    users:[{id:1,name:WZ.owner.name,username:WZ.owner.username,passhash:hash(WZ.owner.pass),role:"owner",protected:true},
      ...WZ.team.map((t,i)=>({id:2+i,name:t.name,username:t.username,passhash:hash(t.pass),role:t.role}))]};
  settings.unit=WZ.site.unit;saveSettings();saveCfg(CFG);enterApp(CFG.users[0]);}

boot();
</script>
</body>
