<style>
/* AIROW Control — custom LG VRF central controller UI (prototype)
   layout: top bar + left nav + unit grid/list + right control drawer + modals */
:root{
  /* the technician "lab" panels (Bus scan, raw data): a light palette here, the neon one in dark mode */
  --lab-bg:#f2f9f7; --lab-bg2:#e6f3ef; --lab-bg3:#edf6f3; --lab-line:#bcdcd4; --lab-line2:#a3cdc3; --lab-line3:#d6ebe6;
  --lab-neon:#0a7f69; --lab-neon-dim:#5fb3a2; --lab-text:#0e3a33; --lab-text2:#1c5248; --lab-dim:#48736b; --lab-faint:#688f88; --lab-mut:#9cbcb5;
  --lab-soft:#d3ede7; --lab-tx:#fdeceb; --lab-txc:#b42318; --lab-warn:#8a5200; --lab-warnbg:#fff3de; --lab-warnline:#efd19c; --lab-pri1:#cfeee6; --lab-pri2:#bfe6dc;
  --lab-shadow:0 0 0 1px #e3f1ee inset,0 8px 24px -18px rgba(16,24,40,.3); --lab-scan:0; --lab-glow:none;
  --bg:#eef0f2; --surface:#fff; --surface-2:#f7f8fa; --border:#dde1e6; --border-strong:#c7ccd3;
  --text:#1b2027; --text-dim:#5a6372; --text-faint:#8a93a1;
  --accent:#0e7c66; --accent-ink:#0b5f4e; --accent-soft:#d9efe9;
  --cool:#1f74c4; --cool-soft:#e2eefb; --heat:#d2652a; --heat-soft:#faeadf;
  --auto:#0e7c66; --auto-soft:#d9efe9; --dry:#6a54c0; --dry-soft:#e9e5f7; --fanm:#64748b; --fanm-soft:#e8ebef;
  --ok:#2e9e5b; --stopped:#9aa3b0; --err:#d93b3b; --err-soft:#fbe6e6;
  --warn:#c98a12; --warn-soft:#fbf0d8; --crit:#b3261e; --crit-soft:#fbe3e1; --info:#3a6ea5; --info-soft:#e4eef8;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --shadow-lg:0 8px 40px rgba(16,24,40,.18); color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --lab-bg:#070b10; --lab-bg2:#0a1319; --lab-bg3:#070f13; --lab-line:#16343a; --lab-line2:#1d4048; --lab-line3:#0e2024;
  --lab-neon:#2ff5c8; --lab-neon-dim:#1f9e86; --lab-text:#cdf6ec; --lab-text2:#aef0e0; --lab-dim:#8fb8b0; --lab-faint:#5f8a84; --lab-mut:#3f5a60;
  --lab-soft:#0f2a2a; --lab-tx:#1a0a0d; --lab-txc:#ff9e9e; --lab-warn:#ffb36b; --lab-warnbg:#241607; --lab-warnline:#4a2f10; --lab-pri1:#0f3a32; --lab-pri2:#0b2a25;
  --lab-shadow:0 0 0 1px #0c1a1e inset,0 8px 30px -14px #000; --lab-scan:.6; --lab-glow:0 0 8px var(--lab-neon);
  --bg:#0f1318; --surface:#171c23; --surface-2:#1c222b; --border:#2a313b; --border-strong:#3a434f;
  --text:#e7ebf0; --text-dim:#9aa4b2; --text-faint:#6b7585;
  --accent:#2fb79a; --accent-ink:#8fe6d4; --accent-soft:#143029;
  --cool:#5aa6e8; --cool-soft:#13263a; --heat:#e8955a; --heat-soft:#33251a;
  --auto:#2fb79a; --auto-soft:#143029; --dry:#a594ec; --dry-soft:#231d38; --fanm:#9aa6b4; --fanm-soft:#232a33;
  --ok:#43c072; --stopped:#6b7585; --err:#f26a6a; --err-soft:#331c1c;
  --warn:#e0a53a; --warn-soft:#352a16; --crit:#f26a6a; --crit-soft:#3a1d1a; --info:#6ba3dd; --info-soft:#15293c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --lab-bg:#070b10; --lab-bg2:#0a1319; --lab-bg3:#070f13; --lab-line:#16343a; --lab-line2:#1d4048; --lab-line3:#0e2024;
  --lab-neon:#2ff5c8; --lab-neon-dim:#1f9e86; --lab-text:#cdf6ec; --lab-text2:#aef0e0; --lab-dim:#8fb8b0; --lab-faint:#5f8a84; --lab-mut:#3f5a60;
  --lab-soft:#0f2a2a; --lab-tx:#1a0a0d; --lab-txc:#ff9e9e; --lab-warn:#ffb36b; --lab-warnbg:#241607; --lab-warnline:#4a2f10; --lab-pri1:#0f3a32; --lab-pri2:#0b2a25;
  --lab-shadow:0 0 0 1px #0c1a1e inset,0 8px 30px -14px #000; --lab-scan:.6; --lab-glow:0 0 8px var(--lab-neon);
  --bg:#0f1318; --surface:#171c23; --surface-2:#1c222b; --border:#2a313b; --border-strong:#3a434f;
  --text:#e7ebf0; --text-dim:#9aa4b2; --text-faint:#6b7585;
  --accent:#2fb79a; --accent-ink:#8fe6d4; --accent-soft:#143029;
  --cool:#5aa6e8; --cool-soft:#13263a; --heat:#e8955a; --heat-soft:#33251a;
  --auto:#2fb79a; --auto-soft:#143029; --dry:#a594ec; --dry-soft:#231d38; --fanm:#9aa6b4; --fanm-soft:#232a33;
  --ok:#43c072; --stopped:#6b7585; --err:#f26a6a; --err-soft:#331c1c;
  --warn:#e0a53a; --warn-soft:#352a16; --crit:#f26a6a; --crit-soft:#3a1d1a; --info:#6ba3dd; --info-soft:#15293c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand .logo{width:30px;height:30px;display:grid;place-items:center;color:var(--accent)}
.site{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;color:var(--text-dim);font-size:13px}
.bus{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);cursor:pointer;border-radius:999px;padding:5px 10px;margin:-5px -4px;transition:background .15s}
.bus:hover{background:var(--surface-2)}
#buspop{position:fixed;z-index:60;width:380px;max-width:calc(100vw - 16px)}
.buspop:not(.lab){background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.5;box-shadow:0 14px 40px -14px rgba(0,0,0,.35)}
.buspop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.buspop-grid>div{background:var(--lab-bg2);border:1px solid var(--lab-line);border-radius:8px;padding:6px 9px}
.buspop-grid small{display:block;font:10px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--lab-faint)}
.buspop-grid b{font:600 12.5px ui-monospace,Menlo,monospace;color:var(--lab-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.spacer{flex:1}
.clock{font-size:13px;color:var(--text-dim)}
.who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-dim);padding:5px 10px;border:1px solid var(--border);border-radius:999px}
.who .rolebadge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);display:grid;place-items:center}
.icon-btn.lit{border-color:var(--accent);color:var(--accent)}

.shell{flex:1;display:flex;min-height:0}
nav{flex:0 0 212px;background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;overflow:auto}
.nav-group{margin-bottom:18px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-faint);padding:0 8px 6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--text-dim);font-size:14px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nav-item .count{font-size:12px;color:var(--text-faint);flex:0 0 auto}
.nav-item .tech-tag{font-size:10px;font-weight:600;color:var(--warn)}
.nav-item .exp-tag{font-size:9.5px;font-weight:700;color:#1a1205;background:var(--warn);border-radius:4px;padding:1px 4px;letter-spacing:.3px}
.upd-notes{font-size:12.5px;color:var(--text-dim);margin-top:8px;white-space:pre-wrap;max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:9px 11px;line-height:1.5}
.nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.nav-item.sub{padding-left:28px;font-size:13px}
.nav-item.row{cursor:pointer}
.nav-arrow{flex:0 0 14px;text-align:center;color:var(--text-faint);cursor:pointer;font-size:10px;user-select:none}
.nav-pen{flex:0 0 auto;color:var(--text-dim);cursor:pointer;font-size:14px;opacity:.55;padding:0 4px}
.nav-item:hover .nav-pen,.nav-pen:hover{opacity:1;color:var(--accent)}
main{flex:1;min-width:0;overflow:auto;padding:18px 22px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:left;transition:border-color .12s,transform .12s}
button.tile:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile .n{font-size:28px;font-weight:600;line-height:1.1}
.tile .l{font-size:12.5px;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:6px}
.tile .l .dot{width:7px;height:7px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:150px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text-dim)}
.search input{border:none;background:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;width:100%}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
.segmented button{border:none;background:none;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--text-dim);display:inline-flex;align-items:center;gap:5px}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:12px}
.eco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.eco{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.eco h3{margin:0;font-size:16px;letter-spacing:-.2px}.eco .sub{font-size:12px;color:var(--text-faint);margin-top:1px}
.eco-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}.eco-top .pill{margin-left:auto}
.eco-big{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px}.eco-big b{font-size:40px;font-weight:650;letter-spacing:-1.5px;line-height:1}.eco-big span{color:var(--text-dim);font-size:13.5px}
.eco-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:13.5px}.eco-row>label{flex:1;color:var(--text-dim);min-width:64px}
.eco-step{display:inline-flex;align-items:center;gap:6px}.eco-step b{min-width:58px;text-align:center;font-size:15px}.eco-step button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:17px;line-height:1}
.eco-step button:disabled,.eco .segmented button:disabled{opacity:.45;cursor:default}
.eco details{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}.eco summary{cursor:pointer;font-size:13px;color:var(--text-dim);font-weight:500}
.eco table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}.eco td{padding:4px 0;border-top:1px solid var(--border)}.eco td:last-child{text-align:right;font-variant-numeric:tabular-nums}.eco th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);padding:9px 0 3px;font-weight:600}
table.ecobus{width:100%;border-collapse:collapse;font-size:12.5px}table.ecobus th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);padding:8px 12px;border-bottom:1px solid var(--border)}
table.ecobus td{padding:6px 12px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap}table.ecobus .hexcol{white-space:normal;color:var(--text-faint);font-size:11px;margin-top:2px;word-break:break-word}table.ecobus tr.tx td{background:var(--accent-soft)}
.eco-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border-strong)}.eco-tools .btn{padding:5px 9px;font-size:12px}
.modal .eco{border:0;box-shadow:none;padding:0;background:none}
.eco-alarm{background:var(--err-soft);color:var(--err);border-radius:9px;padding:8px 11px;font-size:13px;margin-bottom:10px;font-weight:500}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s,transform .12s;overflow:hidden;display:flex;flex-direction:column;gap:11px;min-width:0}
.card:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,var(--stopped))}
.card.off{opacity:.72}
.card-top{display:flex;align-items:center;gap:10px;min-width:0}
.card-id{flex:1 1 auto;min-width:0}
.card-name{font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:break-word;hyphens:auto}
.dname .card-name{display:block;white-space:nowrap}
.lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11.5px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500;white-space:nowrap;flex:none}
.pill.run{background:var(--accent-soft);color:var(--accent-ink)}
.pill.stop{background:var(--surface-2);color:var(--text-dim)}
.pill.err{background:var(--err-soft);color:var(--err);cursor:pointer}
.pill.noresp{background:var(--warn-soft);color:var(--warn)}
/* the two readings (what it is set to / what the room is) carry equal weight, each labelled */
.card-read{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:9px 12px}
.card-read.one{grid-template-columns:1fr}
.card-read.dual{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.rd{min-width:0;overflow:hidden}
.rd + .rd{border-left:1px solid var(--border);padding-left:12px}
.rd-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin-bottom:4px;white-space:nowrap}
.rd-v{font-size:26px;font-weight:600;line-height:1;white-space:nowrap}
.rd-v small{font-size:13px;color:var(--text-dim);font-weight:400;margin-left:1px}
.rd-v i{font-style:normal;color:var(--text-faint);font-weight:400;font-size:17px;margin:0 2px}
.rd-v.idle{color:var(--text-faint)}

/* ===== Motion =====
   Small movements that say "this just happened": screens ease in, numbers count up, buttons give under a
   press, a changed setpoint bumps. Everything here is switched off by Settings ▸ Display ▸ Animations and
   by the operating system's "reduce motion" setting. Entrance effects run only when a screen is opened
   (.enter is set for a moment), never on the live refresh, so nothing flickers while you watch. */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bumpNum{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes okPing{0%{box-shadow:0 0 0 0 rgba(46,157,106,.45)}100%{box-shadow:0 0 0 14px rgba(46,157,106,0)}}
@keyframes softGlow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 3px var(--err-soft,rgba(214,69,69,.14)),var(--shadow)}}
@keyframes navDot{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}

<script>
/* Demo mode flag and the stores every part of the page uses. See "Demo building" further down. */
const DEMO=(()=>{try{if(/[?&]demo\b/.test(location.search)){sessionStorage.setItem("cortex_demo","1");history.replaceState(null,"",location.pathname);}return sessionStorage.getItem("cortex_demo")==="1";}catch(e){return false;}})();
const APPL=location.protocol!=="file:"&&!DEMO;                  // served by a real controller: the controller owns the adapter and every screen shares it
let LINK={on:false,open:false,polling:false,master:false,holder:null,error:null,mine:false,waiting:false,at:0};   // the controller's shared bus status (see "The shared bus link")
const IS_FILE=location.protocol==="file:"&&!DEMO;               // opened as a bare file (no controller behind it) - the demo building behaves like a hosted page
const LS=DEMO?(()=>{const m=new Map();return {getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>{m.set(k,String(v));},removeItem:k=>{m.delete(k);},clear:()=>m.clear(),key:i=>[...m.keys()][i]||null,get length(){return m.size;}};})():window.localStorage;

const MODES=[["cool","Cool","❄"],["heat","Heat","☀"],["auto","Auto","⇅"],["dry","Dry","💧"],["fan","Fan","✦"]];
const FANS=[["low","Low"],["med","Med"],["high","High"],["auto","Auto"],["quiet","Quiet"],["power","Power"]];
// Speeds you can CHOOSE. Auto is fan code 4 on the bus (field-verified in the LGAP reference kit, ch.05 §1.1),
// so it is now a real command. Quiet (5) and Power (6) are shown when a unit reports them but are not offered:
// whether a unit accepts them is model-dependent, so Cortex only re-sends them unchanged.
const FANS_SEL=FANS.filter(f=>f[0]!=="quiet"&&f[0]!=="power");
/* What the wall thermostats on this site can do depends on the equipment generation. Multi V IV and
   older (outdoor family byte 0x0E, 4800-baud bus) have no automatic fan speed and take ONE setpoint in
   auto; newer gear (Multi V 5 class, 9600 baud) adds both. Site override: CFG.statGen = 4 | 5. */
function siteGen(){
  if(CFG&&(CFG.statGen===4||CFG.statGen===5))return CFG.statGen;
  if(CFG&&CFG.baud===9600)return 5;
  try{for(const o of ODU.values()){const p0=o.pages&&o.pages[0];if(p0&&oduFam(p0.f[7]).gen===5)return 5;}}catch(e){}
  return 4;}
function siteGenWhy(){
  if(CFG&&(CFG.statGen===4||CFG.statGen===5))return "set by hand in Settings";
  if(CFG&&CFG.baud===9600)return "9600-baud bus";
  try{for(const o of ODU.values()){const p0=o.pages&&o.pages[0];if(p0){const d=decodeOduPage(p0.f);return "outdoor unit "+hx(d.addr)+" reports "+d.fam.name+" "+d.product+", family "+d.fam.hex;}}}catch(e){}
  return "4800-baud bus";}
function siteCaps(){const g=siteGen();return {gen:g,autoFan:g>=5,dualAuto:g>=5};}
function fansFor(){const c=siteCaps();return FANS_SEL.filter(f=>f[0]!=="auto"||c.autoFan);}
function genNote(){const c=siteCaps();return c.gen>=5?"":"These units are on a generation-4 (Multi V IV class) system — "+siteGenWhy()+". Their thermostats have no automatic fan speed and use a single setpoint in Auto mode. Newer generation-5 equipment adds both.";}
const MC={cool:"cool",heat:"heat",auto:"auto",dry:"dry",fan:"fan"};

/* ---- LG Multi V error code reference (verify against the unit's service manual) ---- */
/* Error reference. Wording is ours; meanings follow LG's Multi V error-code tables and service-class
   troubleshooting notes. chk = a quick field check; lv = how LG's logic reacts (see ERR_LEVELS). */
const TH_CHK="Thermistors are NTC: air sensors 10 kΩ, pipe sensors 5 kΩ, discharge sensors 200 kΩ at 77 °F (in ice water about 34 kΩ / 17 kΩ / 586 kΩ). The board feeds each one 5 V DC. Compare the reading in Cortex with a good thermometer placed right next to the sensor.";
const COMM_CHK="The indoor A/B daisy chain is a pulsing 0–5 V DC signal: you should see it moving at the outdoor unit, indoor units and HR boxes. With the chain unplugged at the outdoor unit the terminals should sit at a steady 5 V DC. If they don't, cycle power to let the board reset before condemning it.";
const ERR_LEVELS={
  comm:"Communication fault: it is raised after repeated failed attempts and <b>clears by itself as soon as communication comes back</b>, with no reset needed. That is why it can be gone when you arrive — use Fault history to see what was happening just before.",
  auto:"The system stops for 3 minutes and restarts by itself. If the same fault comes back 10 times within an hour it locks out and needs a manual restart."};
const ERRORS={
 "CH01":{t:"Indoor air / remote sensor",cause:"Return-air or wall-remote temperature sensor is open, shorted or unplugged.",act:"Check the sensor plug on the indoor PCB, then the sensor itself.",chk:TH_CHK,sev:"medium",who:"Indoor"},
 "CH02":{t:"Indoor pipe (inlet) sensor",cause:"Inlet pipe thermistor is open, shorted or unplugged.",act:"Check the plug on the indoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Indoor"},
 "CH03":{t:"Zone controller comms",cause:"The indoor PCB is not hearing its wired zone controller.",act:"Check the controller cable and the connector on the indoor PCB.",chk:"At the indoor PCB: COM to SIG should show about ±5 V DC, COM to 12V should show 12 V DC.",sev:"medium",who:"Indoor"},
 "CH04":{t:"Condensate drain / float",cause:"Drain pump or float switch problem: water rose past the float's halfway point.",act:"Clear the drain pan and line, then check the pump and float switch. The code clears after the indoor unit's power is cycled.",sev:"medium",who:"Indoor"},
 "CH05":{t:"Indoor ↔ outdoor comms lost",cause:"The indoor unit has not heard the outdoor unit for several minutes.",act:"Check the A/B comm cable for polarity, continuity and loose terminals; look for address conflicts.",chk:COMM_CHK,lv:"comm",sev:"high",who:"Both"},
 "CH06":{t:"Indoor pipe (outlet) sensor",cause:"Outlet pipe thermistor is open, shorted or unplugged.",act:"Check the plug on the indoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Indoor"},
 "CH07":{t:"Mode conflict",cause:"Indoor units on a heat pump system are asking for different modes (heat pump systems only).",act:"Set the indoor units on this system to the same mode.",sev:"low",who:"System"},
 "CH09":{t:"Indoor PCB EEPROM",cause:"The indoor PCB cannot read its memory chip or option card.",act:"Reseat the option card on the indoor PCB; if it persists replace the PCB, then re-run auto-addressing and set the central address.",sev:"high",who:"Indoor"},
 "CH10":{t:"Indoor fan motor",cause:"The indoor BLDC fan motor is not turning or not reporting back.",act:"Check the fan plug and harness; on a new install make sure paperwork was removed from the fan shroud. Replace the motor or PCB if checks fail.",chk:"Motor unplugged from the PCB: terminals 4–5 should read above 35 kΩ and 4–7 above 230 kΩ. Running supply is about 308 V DC (±45).",sev:"high",who:"Indoor"},
 "CH12":{t:"Hydro kit inverter PCB",cause:"The inverter (compressor) PCB inside a hydro kit has a fault. LG's Multi V tables list 12 only as a hydro kit code.",act:"Check the plugs and wiring at the hydro kit's inverter PCB, then the PCB itself.",sev:"high",who:"Indoor"},
 "CH08":{t:"Hydro kit tank sensor",cause:"Hot-water tank temperature sensor on a hydro kit is open, shorted or unplugged.",act:"Check the tank sensor plug (CN-TH4, red, on the hydro kit PCB) and the sensor's resistance. The tank sensor is only needed for hot-water mode; floor heating runs without it.",sev:"medium",who:"Indoor"},
 "CH11":{t:"Hydro kit inverter comms",cause:"The hydro kit's main board is receiving nothing from its inverter (compressor) PCB.",act:"Check the cable and plugs between the two hydro kit boards.",lv:"comm",sev:"high",who:"Indoor"},
 "CH13":{t:"Hydro kit solar pipe sensor",cause:"Solar pipe temperature sensor on a hydro kit is open or shorted.",act:"Check the sensor plug and resistance.",sev:"medium",who:"Indoor"},
 "CH14":{t:"Hydro kit flow switch",cause:"The hydro kit's water flow switch did not close: no water flow was proven.",act:"Check the pump runs, then the strainer, valves and air in the water circuit, then the flow switch and its wiring.",sev:"high",who:"Indoor"},
 "CH15":{t:"Hydro kit water overheating",cause:"Leaving water temperature at the hydro kit went above 185 °F (85 °C), or the water sensor is reading wrong.",act:"Check water flow, whether hotter water is entering from another source, and the water temperature sensors.",sev:"high",who:"Indoor"},
 "CH16":{t:"Hydro kit water sensors",cause:"A hydro kit water pipe temperature sensor (inlet or outlet) is open, shorted or unplugged.",act:"Check both water sensor plugs and their resistance.",sev:"medium",who:"Indoor"},
 "CH17":{t:"Hydro kit water inlet sensor",cause:"Water inlet temperature sensor on a hydro kit is open, shorted or unplugged.",act:"Check the sensor plug and resistance.",sev:"medium",who:"Indoor"},
 "CH18":{t:"Hydro kit water outlet sensor",cause:"Water outlet temperature sensor on a hydro kit is open, shorted or unplugged.",act:"Check the sensor plug and resistance.",sev:"medium",who:"Indoor"},
 "CH28":{t:"DC link over-voltage",cause:"Inverter DC bus voltage went too high.",act:"Check incoming voltage for surges or a high leg, then the inverter PCB.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH33":{t:"Compressor 2 discharge too hot",cause:"Second compressor's discharge gas overheated.",act:"Same checks as CH32: charge and leaks first, then EEVs, injection, and the discharge sensor.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH47":{t:"Compressor 2 discharge sensor",cause:"Second compressor's discharge thermistor is open, shorted or unplugged.",act:"Check the sensor is fitted and plugged in, then its resistance.",chk:TH_CHK,sev:"high",who:"Outdoor"},
 "CH49":{t:"IPM temperature sensor",cause:"The inverter power module's temperature sensor is open or shorted.",act:"Technician: check the inverter PCB.",sev:"high",who:"Outdoor"},
 "CH59":{t:"Series installation error",cause:"On a system with more than one outdoor frame, a smaller frame is set as the main (master) unit. The largest frame must be the main.",act:"Check which frame is set as main on the DIP switches and that the frame sizes are an allowed combination in LG's table.",sev:"high",who:"Outdoor"},
 "CH75":{t:"Fan current sensor",cause:"Outdoor fan PCB current sensor fault.",act:"Technician: check the fan PCB.",sev:"high",who:"Outdoor"},
 "CH76":{t:"Fan DC link over-voltage",cause:"DC bus voltage on the outdoor fan PCB went too high.",act:"Check incoming voltage, then the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH77":{t:"Fan overcurrent",cause:"Outdoor fan motor is drawing too much current.",act:"Check the fan turns freely and the motor windings, then the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH79":{t:"Fan failed to start",cause:"Outdoor fan motor did not start.",act:"Check for a jammed fan, the motor leads and the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH87":{t:"Fan PCB EEPROM",cause:"The memory chip on the outdoor fan PCB is missing, mis-seated or unreadable.",act:"Check the chip is seated the right way round.",sev:"high",who:"Outdoor"},
 "CH106":{t:"Fan IPM fault",cause:"Outdoor fan PCB power module tripped.",act:"Check the fan motor and its wiring, then the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH107":{t:"Fan DC link under-voltage",cause:"DC bus voltage on the outdoor fan PCB is too low.",act:"Check incoming voltage and the fan PCB supply wiring.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH145":{t:"Main ↔ external board comms",cause:"The outdoor main PCB and its external (I/O) board are not talking.",act:"Check the cable between the two boards.",lv:"comm",sev:"high",who:"Outdoor"},
 "CH153":{t:"Upper coil sensor",cause:"Upper outdoor heat-exchanger thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Outdoor"},
 "CH154":{t:"Lower coil sensor",cause:"Lower outdoor heat-exchanger thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Outdoor"},
 "CH182":{t:"Main ↔ sub processor comms",cause:"The two processors on the outdoor boards are not talking.",act:"Reset power; if it returns, check the board-to-board cable and then the PCB.",lv:"comm",sev:"high",who:"Outdoor"},
 "CH187":{t:"Hydro kit freeze protection",cause:"The hydro kit's plate heat exchanger is at risk of freezing.",act:"Check water flow, strainer and water temperature before restarting.",sev:"critical",who:"Indoor"},
 "CH193":{t:"Fan heat sink temperature",cause:"Outdoor fan PCB heat sink overheated.",act:"Check airflow across the heat sink and the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH194":{t:"Fan heat sink sensor",cause:"Outdoor fan PCB heat sink sensor is open or shorted.",act:"Technician: check the fan PCB.",sev:"medium",who:"Outdoor"},
 "CH21":{t:"Inverter overcurrent (IPM)",cause:"Over-current on one compressor phase: compressor winding or insulation damage, a loose compressor terminal, an overheated IPM (heat sink fan), or a failed inverter PCB.",act:"Technician: check compressor windings and terminals, heat sink and its fan, then the inverter PCB.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH22":{t:"AC input overcurrent",cause:"Too much input current at the inverter PCB: low supply voltage, a restriction from a faulty EEV, or overcharge.",act:"Check supply voltage under load, then EEV operation and refrigerant charge.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH23":{t:"DC link voltage",cause:"Inverter DC bus voltage went too low or too high: a failed capacitor, a loose DC link connection, or bad incoming power.",act:"Start at the inverter socket on the noise filter PCB; check DC link wiring and capacitors, then incoming power.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH24":{t:"High pressure switch",cause:"The outdoor high-pressure switch opened and shut the system off.",act:"Check the switch connection on the outdoor PCB, then find why pressure rose: dirty coil, fan not running, overcharge, closed service valve.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH25":{t:"Input voltage out of range",cause:"Supply voltage to the outdoor unit is too high or too low.",act:"Measure incoming voltage on every leg while the unit runs.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH26":{t:"Compressor failed to start",cause:"The inverter compressor did not start.",act:"Technician: check compressor wiring and windings, the inverter PCB, and for liquid in the compressor.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH27":{t:"PSC / PFC fault (inverter input)",cause:"Over-current was detected at the IGBT / PFC module, the part of the inverter PCB that turns incoming AC into DC. LG lists this for single-phase inverter outdoor units (single and multi-split boards); it is not in the Multi V IV code table.",act:"Check incoming voltage, then the reactor and its wiring, the compressor leads (U, V, W) and winding resistance, and finally the inverter PCB.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH29":{t:"Compressor overcurrent",cause:"Compressor current draw is too high: a failing compressor or a restriction in the piping.",act:"Technician: compare amps with nameplate, look for restrictions and check the compressor.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH32":{t:"Discharge temperature too high",cause:"Compressor discharge gas overheated (shutdown above 239 °F for 10 seconds).",act:"Check for low charge or a leak first, then a faulty EEV, the liquid injection valve, and the discharge sensor itself. Repeated CH32 trips damage the compressor.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH34":{t:"High pressure too high",cause:"High pressure stayed above 580 psi (4,000 kPa) for 10 seconds.",act:"Cooling: check outdoor fans, coil cleanliness and clearance. Heating: check indoor filters and fans. Also check charge, EEVs, service valves and the pressure sensor.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH35":{t:"Low pressure too low",cause:"Low pressure stayed under the limit for a minute (cooling under 58 psi, heating under 33 psi; under 16 psi at any time the inverter is below 30 Hz).",act:"Check for a leak / low charge. Cooling: suspect an indoor EEV. Heating: suspect the outdoor EEV.",lv:"auto",sev:"critical",who:"Outdoor"},
 "CH36":{t:"Low compression ratio",cause:"The compressor is not building a pressure difference: ratio under 1.6 (scroll compressor) or 1.8 (rotary) for 2 minutes after a reversing-valve change or 5 minutes after a compressor start.",act:"Check for a compressor that is locked out or not pumping, low charge, and that the 4-way valve is shifting and seating. Often seen with CH151.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH38":{t:"EEV fault",cause:"An electronic expansion valve is not operating correctly. This code is not in LG's Multi V IV or Multi V S code tables, so confirm its meaning in the manual for the model that is showing it.",act:"Check the EEV coil and its plug; replace if faulty.",chk:"Coil resistance — outdoor main EEV and large indoor EEV: about 300 Ω across pins 1–3 and 2–4, 150 Ω to common. Subcooling EEV and small indoor EEV: about 104 Ω and 52 Ω. Values vary by EEV model.",sev:"high",who:"Outdoor"},
 "CH40":{t:"Current (CT) sensor",cause:"Compressor current sensor is open or shorted.",act:"Technician: check the CT sensor and inverter PCB.",sev:"high",who:"Outdoor"},
 "CH41":{t:"Discharge pipe sensor",cause:"Compressor discharge thermistor is open, shorted, unplugged or not clipped to the pipe. Can also appear when cooling in very cold weather without a low-ambient kit.",act:"Check the sensor is fitted and plugged in, then its resistance.",chk:TH_CHK,sev:"high",who:"Outdoor"},
 "CH42":{t:"Low pressure sensor",cause:"Outdoor low-pressure sensor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB and the sensor wiring.",sev:"high",who:"Outdoor"},
 "CH43":{t:"High pressure sensor",cause:"Outdoor high-pressure sensor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB; compare the sensor's signal voltage with a gauge reading.",sev:"high",who:"Outdoor"},
 "CH44":{t:"Outdoor air sensor",cause:"Outdoor-air thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Outdoor"},
 "CH45":{t:"Outdoor coil pipe sensor",cause:"Outdoor heat-exchanger pipe thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor.",chk:TH_CHK,sev:"medium",who:"Outdoor"},
 "CH46":{t:"Suction pipe sensor",cause:"Outdoor suction thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor. LG: check the suction sensor when the fault shows in cooling, and the hot-gas sensor near the heat exchanger when it shows in heating.",chk:TH_CHK,sev:"medium",who:"Outdoor"},
 "CH50":{t:"Loss of phase",cause:"One input power leg is missing at the outdoor unit.",act:"Technician: check the breaker, fuses and every power terminal.",sev:"critical",who:"Outdoor"},
 "CH51":{t:"Combination ratio out of range",cause:"Connected indoor capacity is under 50 % or over 130 % of the outdoor unit's capacity.",act:"Check the indoor units actually found against the design. On heat-recovery systems a 51 shown with an HR box number means too much indoor capacity on that box: over 54 MBh on one port, or over 192 MBh on one box.",sev:"medium",who:"System"},
 "CH52":{t:"Main PCB ↔ inverter PCB comms",cause:"The outdoor main PCB and inverter PCB are not talking.",act:"Check the plugs at both boards and the cable between them.",lv:"comm",sev:"high",who:"Outdoor"},
 "CH53":{t:"Outdoor ↔ indoor comms",cause:"The outdoor main PCB is not hearing the indoor units: comm cable open or shorted, A/B swapped, or duplicate addresses.",act:"Check A goes to A and B to B at every unit, look for a short or break, then re-run auto-addressing.",chk:COMM_CHK,lv:"comm",sev:"medium",who:"System"},
 "CH54":{t:"Outdoor power phase error",cause:"The outdoor unit sees its three-phase supply in the wrong order, or with a leg missing. LG's service-class material calls this the outdoor unit power error; it is not in every model's code table.",act:"Check that all three legs are present and tight at the outdoor terminal block and that phase rotation is correct. If the rotation is reversed, swap two supply legs at the disconnect, not inside the unit.",sev:"high",who:"Outdoor"},
 "CH57":{t:"Inverter PCB not hearing main PCB",cause:"The outdoor inverter PCB receives nothing from the main PCB.",act:"Check the plugs at both boards and the cable between them.",lv:"comm",sev:"high",who:"Outdoor"},
 "CH60":{t:"Inverter PCB EEPROM",cause:"The memory chip on the outdoor inverter PCB is missing, mis-seated or unreadable.",act:"Check the chip is in its socket with no bent pins and that the notch in the chip lines up with the arrow on the socket.",sev:"high",who:"Outdoor"},
 "CH62":{t:"Heat sink temperature",cause:"The inverter heat sink overheated and the system shut off.",act:"Check outdoor fan operation and airflow across the heat sink.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH65":{t:"Heat sink sensor",cause:"Inverter heat sink thermistor is open, shorted or unplugged.",act:"Check the plug on the outdoor PCB, then the thermistor (10 kΩ type).",sev:"medium",who:"Outdoor"},
 "CH67":{t:"Outdoor fan locked",cause:"The outdoor fan is not turning: blocked fan, failed motor or fan PCB.",act:"Check the fan spins freely, then motor wiring and the fan PCB.",lv:"auto",sev:"high",who:"Outdoor"},
 "CH71":{t:"Converter CT sensor",cause:"The current sensor on the converter (input) side of the inverter PCB is open or shorted.",act:"Technician: check input voltage, then the inverter PCB's current-sensing circuit.",sev:"high",who:"Outdoor"},
 "CH86":{t:"Main PCB EEPROM",cause:"The memory chip on the outdoor main PCB is missing, mis-seated or unreadable.",act:"Check the chip is in its socket the right way round with no bent pins.",sev:"high",who:"Outdoor"},
 "CH104":{t:"Main ODU lost a sub unit",cause:"On a multi-frame system the main outdoor unit lost communication with a sub outdoor unit. In field tests it appeared about two minutes after a sub frame lost power, with a lower first-stage code showing on the outdoor unit before it.",act:"Check the outdoor-to-outdoor comm terminals for a loose or corroded connection, comm cable run beside power wiring, and whether a sub unit is briefly losing power (breaker, contactor, voltage dip). Open the fault in Fault history: the recording shows every outdoor frame's readings for the 10 minutes before it.",lv:"comm",sev:"high",who:"Outdoor"},

   Checksum (confirmed, code + wire): (sum of all bytes except the last) XOR 0x55.
   An indoor unit uses TWO frames:
   (A) 8-byte basic frame  80 00 A0 addr b4 b5 b6 ck  — power / mode / fan ONLY.
       b4 bit0=power, bit1="change" (CC sends 03/02 once, then 01/00).
       b5 HIGH nibble=fan (1 low,2 med,3 high) · LOW nibble=mode (0 cool,3 auto,4 heat).
       b6 is NOT the setpoint (some other field) — which is why it never tracked
       temperature. Cortex preserves the last-seen b6.

       disassembling the ACP's OWN builder (CopyControlData_to_sendControlacCmd5). The
       header is no longer a guess — exact byte layout:

/* (A) basic power/mode/fan command (8-byte) */
function cmdBytesFor(addr,o,change){
  const seen5=(o.d5!=null?o.d5:0x33)&0x7F;                    // bit7 = filter-sign reset (one-shot) — never carried over from a last-seen byte
  const fanN=FANHI[o.fan]!=null?FANHI[o.fan]:((o.fanRaw!=null?o.fanRaw:(seen5>>4))&7);   // quiet/power/unknown -> keep exactly what the unit reported
  const modeN=MODELO[o.mode]!=null?MODELO[o.mode]:(seen5&0x07);
  const b5=(fanN<<4)|(o.swing?0x08:0)|modeN|(o.filterReset===true?0x80:0);   // byte5: bits0-2 mode · bit3 SWING · bits4-6 fan · bit7 filter-sign reset, a one-shot set only by the explicit Reset button [kit ch.04 §6.1, ch.05 §1.1]
  // b6 = setpoint in whole °C minus 15 (cmd0 write — community-confirmed: 22°C -> 0x07, frame
  // 80 00 A0 31 03 30 07 DE checksum-validates). Half-degree rides b0 bit2 (0x04). When no
  // setpoint is supplied, preserve the last-seen b6 so a power/mode/fan-only write doesn't move it.
  let b0=o.b0||0x80, b6;

    b0&=~0x04;                                                // clear a half-degree flag left over from the last-seen frame…
    if(whole-intp>=0.5&&intp<30)b0|=0x04;                     // …and set it only when THIS setpoint has the half degree
  }else{

/* cmd5 (0xA8, 16 bytes) — dual setpoint + limits. RECONCILED 2026-11-14: rebuilt instruction-by-instruction from the

async function applyAndSend(list,mut){

  if(!canReach()&&!isDemo()){toast(notConnMsg());return 0;}
  holdUnits(list);
  list.forEach(u=>{mut(u);u.coolC=clampC(u.coolC);u.heatC=clampC(u.heatC);u.sp=Math.round(activeC(u)*9/5+32);});
  let n=list.length;
  if(canReach()){if(list.length>1)toast(`Sending to ${list.length} units…`);n=await sendUnits(list);}

    inv1Target:f[16],inv1Hz:s8(f[17]),inv2Target:f[18],inv2Hz:s8(f[19]),fan1:f[20]*10,fan2:f[21]*10,
    air:t10(T.air,f[22]),hp:T.hp[f[23]],lp:T.lp[f[24]],cond:t10(T.cond,f[23]),evap:t10(T.evap,f[24]),suct:t10(T.suct,f[25]),
    disch1:T.disch[f[26]],disch2:T.disch[f[27]],liq:t10(T.pipe,f[28]),hex:t10(T.pipe,f[29]),scIn:t10(T.pipe,f[32]),scOut:t10(T.pipe,f[33]),
    eev1:f[34]*8,eev2:f[35]*8,eevSc:f[36]*8,inv1A:f[40]/5,inv1V:f[41]*5,inv2A:f[42]/5,inv2V:f[43]*5,dc1:f[44]*5,dc2:f[45]*5,
    idus:f[53],defrost:!!(f[58]&0x10),oilReturn:!!(f[58]&0x40),fourWay:!!(f[59]&0x80),
    hexUp:t10(T.pipe,f[30]),hexLo:t10(T.pipe,f[31]),eevOil:f[37]*8,eevVi1:f[38]*8,eevVi2:f[39]*8,fan1A:f[46]/10,fan2A:f[47]/10,inv1Ph:f[48]/5,inv2Ph:f[62]/5,hs1:f[52],hs2:f[54],
    fanStep:f[57]&0x0F,addDefrost:!!(f[57]&0x40),snow:!!(f[57]&0x80),divDefrost:!!(f[58]&0x20),oilSens1:!!(f[59]&1),oilSens2:!!(f[59]&2),heater1:!!(f[59]&4),heater2:!!(f[59]&8),coolFan:!!(f[59]&0x40),
    compCount:f[60]&3,sucInj:!!(f[60]&4),varPath:!!(f[60]&0x40),hotGas:!!(f[60]&0x80),recvIn:!!(f[61]&1),recvOut:!!(f[61]&2),backup1:!!(f[61]&0x40),backup2:!!(f[61]&0x80)};
  if(d.comps===1){d.inv2Target=0;d.inv2Hz=0;}                       // single-compressor family: ignore whatever sits in the second compressor's bytes

function oduUnits(o){const p0=o.pages[0];if(!p0)return [];if(!oduFam(p0.f[7]).s4)return [];const m=decodeOduPage(p0.f);const out=[m];
  for(let p=2;p<m.subs+2&&p<=4;p++){if(o.pages[p])out.push(decodeOduPage(o.pages[p].f));}return out;}
function findOduPage(rx,addr){for(let i=0;i+64<=rx.length;i++){if(rx[i]===0x40&&rx[i+1]===0x70&&rx[i+2]===0xA0&&rx[i+4]===addr){const f=rx.slice(i,i+64);if(lgapCk(f,63)===f[63])return f;}}return null;}
// One cmd14 page read. Read-only form only (bytes 5-6 zero, single ODU address).
async function masterOduPage(addr,page,timeout){
  if(addr===0xFF||addr<0||addr>0xFE){mlog("⚠ refusing ODU address "+hx(addr&0xFF));return null;}
  if(!bus.port||!bus.port.writable)return null;
  MASTER.inPoll=true;
  try{const rx=[];let hit=null,wake=null;
    MASTER.tap=(bytes)=>{for(const x of bytes)rx.push(x);if(!hit&&rx.length>=64){hit=findOduPage(rx,addr);if(hit&&wake)wake();}};
    const q=[0xF0,0xC0,0xA0,addr,page&0xFF,0x00,0x00];q.push(lgapCk(q,7));
    mlog("TX ODU "+hx(addr)+" page "+page+"  "+q.map(mhex).join(" "));masterWrite(q);
    await new Promise(r=>{wake=r;later(r,MASTER.turnaround+(timeout||MASTER.timeout));});
    MASTER.tap=null;
    if(hit){mlog("RX ODU "+hx(addr)+" page "+hit[5]+" ("+hit.length+" bytes)");await sleep(Math.max(MASTER.turnaround,300));}
    return hit;
  }finally{MASTER.inPoll=false;MASTER.tap=null;}}
// Main page, then each sub unit the main reports, then the fault page — the same set a real central reads.
async function masterOduRead(addr){
  const p0=await masterOduPage(addr,0);if(!p0)return 0;let n=1;
  const subs=Math.min(3,p0[15]>>5);
  for(let p=2;p<subs+2;p++){await sleep(1100);if(await masterOduPage(addr,p))n++;}
  await sleep(1100);if(await masterOduPage(addr,5))n++;
  return n;}
let oduBusy=false;
async function oduReadClick(){
  const el=document.getElementById("odu-addr");const a=parseInt(((el&&el.value)||"").trim().replace(/^0x/i,""),16);
  if(!Number.isFinite(a)||a<0||a>0xFE){toast("Enter the outdoor unit's central address in hex (00–FE)");return;}
  if(!isMaster()){toast("Reading an outdoor unit needs Cortex to be the bus master");return;}
  if(oduBusy)return;oduBusy=true;toast("Reading outdoor unit "+hx(a)+"…");
  try{const n=await busExclusive(()=>masterOduRead(a));
    toast(n?("Outdoor unit "+hx(a)+" answered ("+n+" page"+(n!==1?"s":"")+")"):("No answer from "+hx(a)+" — is that the ODU's central-control address?"));}
  finally{oduBusy=false;if(view==="cycle")renderCycle();}}
async function oduFindClick(){
  if(!isMaster()){toast("Finding outdoor units needs Cortex to be the bus master");return;}
  if(oduBusy)return;oduBusy=true;let found=0;toast("Searching addresses 00–FE for outdoor units (about 2 minutes)…");
  try{for(let a=0;a<=0xFE&&isMaster();a++){
      const f=await busExclusive(()=>masterOduPage(a,0,350));
      if(f){found++;mlog("  ✓ outdoor unit at "+hx(a));}}
    toast(found?("Found "+found+" outdoor unit"+(found!==1?"s":"")):"No outdoor unit answered");}
  finally{oduBusy=false;if(view==="cycle")renderCycle();}}

  dt:k=>(k==null||!isFinite(k))?"—":(F?Math.round(k*9/5*10)/10:k)+"°",          // a temperature DIFFERENCE (superheat / subcooling)
  pr:k=>(k==null||!isFinite(k))?"—":(F?Math.round(k*0.145038):k),

function oduControls(){
  if(!isMaster())return `<span style="font-size:12px;color:var(--text-faint)">${liveTx()?"Fills in as the LG central polls its outdoor units.":(POLLER.active?"Read by the controller about once a minute.":"Outdoor data is read while Cortex is polling the bus.")}${tip("Finding outdoor units, reading one by address and grouping by outdoor unit are done from the screen that holds the adapter: Bus scan ▸ Connect adapter ▸ start polling, then come back here.")}</span>`;

  cond:"<b>Condensing temperature</b> — the saturation temperature that matches the high pressure. Subcooling and discharge superheat are measured against it.",
  liq:"<b>Liquid pipe temperature</b> — liquid leaving the outdoor unit (after the subcooler in cooling).",
  sc:"<b>Subcooling</b> — condensing temperature minus liquid temperature: how solid the liquid column is.<br><b>Cooling:</b> the subcooling EEV holds about 27 °F (15 °C).<br><b>Low subcooling with high suction superheat</b> points to low charge; low subcooling causes noise and poor capacity at the indoor units.",
  evap:"<b>Evaporating temperature</b> — the saturation temperature that matches the low pressure. Suction superheat is measured against it.",
  suct:"<b>Suction temperature</b> — gas returning to the compressors.",
  sh:"<b>Suction superheat</b> — suction temperature minus evaporating temperature.<br><b>Normal:</b> above 1 °F (0.5 °C), typically 1–9 °F in cooling; in heating the main EEV holds about 5 °F (3 °C).<br><b>Zero or negative:</b> liquid floodback — subcooling EEV or EEV fault, or overcharge.<br><b>High and steady with low subcooling:</b> low charge.",
  ratio:"<b>Compression ratio</b> — absolute high pressure divided by absolute low pressure. Roughly 2–4 in normal running; very low means the compressor isn't doing much work, very high means it is working hard against a restriction or extreme conditions.",

  inv:"<b>Inverter scroll compressor</b> — draws in low-pressure gas and discharges high-pressure gas. Speed (Hz) follows the building load: the main outdoor unit raises or lowers it to hold the pressure targets. Multi V IV range is 15–150 Hz.<br><b>Defrost:</b> starts at 30 Hz, runs at a set value, ends at 40 Hz.<br><b>Target vs actual:</b> a large gap that doesn't close means a protection control is holding it back (high pressure, low pressure or discharge temperature).<br>Volts / amps are the inverter's input; DC link is the bus voltage that drives the motor.",
  fan:"<b>Outdoor fan</b> — moves air across the outdoor coil. In cooling it speeds up to hold high pressure down (about +100 rpm every 10 s above 504 psi); in heating it works to hold low pressure up.<br><b>Full defrost:</b> stops. <b>Partial defrost:</b> runs on low-pressure control.",
  eevMain:"<b>Outdoor main EEV</b> — the expansion valve on the outdoor coil.<br><b>Cooling:</b> not metering — the lower valve is fully open (about 1940–2000 pulses) and the upper at minimum (32).<br><b>Heating:</b> meters refrigerant into the outdoor coil to hold suction superheat near 5 °F; normal 200–800 pulses. Above 1500: low charge. Below 150: overcharge.<br><b>Defrost:</b> driven to maximum. <b>Stopped:</b> minimum.",
  eevSc:"<b>Subcooling EEV</b> — feeds a little liquid through the subcooler to chill the main liquid line.<br><b>Cooling:</b> modulates to hold about 27 °F (15 °C) subcooling at the subcooler outlet.<br><b>Heating:</b> used for vapour injection and to pull a high discharge temperature down.<br><b>Defrost and stop:</b> minimum.",
  fourWay:"<b>Four-way (reversing) valve</b> — sends hot gas to the outdoor coil (cooling) or to the indoor units (heating). During defrost it switches to the cooling position, then back.<br>On a heat-recovery system it only decides whether the outdoor coil condenses or evaporates; hot gas for heating units leaves on the high-pressure gas pipe.<br><b>If it does not shift:</b> high and low pressure stay close together (LG raises CH151, and CH36 when the compression ratio stays under 1.6).",

  eevOil:"<b>Oil-equalising EEV</b> — moves oil between the two compressors so neither runs short. It opens briefly from time to time; staying wide open is worth a look.",

  states:"On / off states the outdoor unit reports. Lit means active right now.<br><b>Hot gas bypass</b> feeds discharge gas to suction to keep low pressure up at very low load. <b>Variable path</b> switches part of the outdoor coil in or out. <b>Receiver in / out</b> park or release refrigerant. <b>Crankcase heaters</b> keep liquid out of an idle compressor. <b>Oil level</b> lit means that compressor's oil sensor sees oil.<br>These were added from a decode table and have not been checked against your equipment yet: tell me if one disagrees with what the unit is doing.",
  iduEev:"<b>Indoor EEV</b> — in cooling it holds superheat across that coil; in heating it holds subcooling (18–36 °F).<br><b>Normal:</b> cooling 200–600 pulses; heating 150–1350. About 40 = closed (unit satisfied or off).<br><b>Cooling above 1000:</b> low charge. <b>Defrost:</b> calling units sit at 400–800.",
  iduPipe:"<b>Indoor pipe temperatures</b> — refrigerant entering and leaving the indoor coil.<br><b>Cooling:</b> both normally 43–59 °F (6–15 °C); outlet minus inlet 0–18 °F. Outlet colder than inlet by more than 2 °F: EEV leaking through. Difference above 18 °F: restricted EEV or piping. Pipes above 63 °F while calling: low charge, clogged path or EEV fault."

/* LG's typical-value check for one outdoor unit record (values in kPa / °C). Returns advisories. */
function oduAdvice(u,idus){const A=[];if(!u.running)return A;const heat=u.mode==="heat";
  const add=(sev,t)=>A.push({sev,t});
  if(!heat){if(u.hp>3800)add("bad","High pressure is above LG's cooling range — check for overcharge or an outdoor fan problem.");
    else if(u.hp<1800)add("warn","High pressure is below LG's cooling range — possible low charge or leak.");
    if(u.lp>1300)add("warn","Low pressure is above range — possible overcharge.");
    else if(u.lp<400)add("warn","Low pressure is below LG's cooling range — possible low charge, a leak, or crossed comm wiring.");}
  else{if(u.hp>3400)add("bad","High pressure is above LG's heating range — check for overcharge, an indoor fan problem or crossed comm wiring.");
    else if(u.hp<2200)add("warn","High pressure is below LG's heating range — possible low charge.");
    if(u.lp>1300)add("warn","Low pressure is above range — possible overcharge.");
    else if(u.lp<120)add("bad","Low pressure is below LG's heating range — possible low charge or an outdoor EEV fault.");
    const me=Math.max(u.eev1||0,u.eev2||0);if(me>1500)add("warn","Outdoor main EEV is nearly wide open in heating — possible low charge.");}

  if(u.sh!=null&&u.sh<0)add("bad","Suction superheat is negative — liquid may be returning to the compressor (EEV or subcooling EEV fault, or overcharge).");

    if(hi>=Math.max(2,Math.ceil(idus.filter(x=>x.on).length/2)))add("warn",hi+" indoor EEVs are above 1000 pulses in cooling — a common sign of low charge.");}
  return A;}
function cyTone(kind,u){const heat=u.mode==="heat";if(!u.running)return "";

  if(kind==="d1"||kind==="d2"){const d=kind==="d1"?u.disch1:u.disch2;return d==null?"":d>=105?"bad":d>100?"warn":"";}
  if(kind==="sh")return (u.sh!=null&&u.sh<0)?"bad":"";
  if(kind==="dsh"){const d=Math.max(u.disch1==null?-99:u.disch1,u.disch2==null?-99:u.disch2);return (d>0&&u.cond!=null&&d-u.cond<5)?"warn":"";}

const DAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];
function schedules(){if(CFG&&!CFG.schedules)CFG.schedules=[];return (CFG&&CFG.schedules)||[];}
function schTarget(s){const t=s.target||{};if(t.type==="all")return "All units";
  if(t.type==="group")return t.val;if(t.type==="sub")return t.val;

function schAction(s){const a=s.action,p=[];

const SCH_RESULT={sent:"sent to the units",queued:"handed to the connected screen","skipped-not-master":"skipped — Cortex is not running the bus","no-units":"no matching units",error:"failed"};

    // saved a few minutes AFTER today's run time? then its first run is the next matching day, not "right now"
    {const due=schDue(s,new Date());if(due&&Date.now()>=due.getTime()){const f=loadFired();f[s.id]=schKey(s,new Date());saveFired(f);}}

/* ---- schedule engine: evaluates schedules each half-minute and fires bus commands ---- */
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function schNthMatches(s,now){const nth=s.nth||"every";if(nth==="every")return true;
  const dom=now.getDate();if(nth==="last")return dom+7>daysInMonth(now.getFullYear(),now.getMonth());
  return Math.floor((dom-1)/7)+1===parseInt(nth,10);}
function outdoorTemp(){return (CFG&&CFG.wxOverride!=null)?CFG.wxOverride:WEATHER.now;}  // test override wins
function schCondOk(s){if(!s.cond||!s.cond.op)return true;const t=outdoorTemp();if(t==null)return false;
  if(s.cond.op==="above")return t>s.cond.temp;if(s.cond.op==="below")return t<s.cond.temp;return true;}
function schTargetUnits(s){const t=s.target||{};
  if(t.type==="all")return units.slice();
  if(t.type==="unit")return units.filter(u=>u.id===t.val);
  if(t.type==="group")return units.filter(u=>grpOf(u)===t.val);
  if(t.type==="sub")return units.filter(u=>leafKey(u)===t.val);
  return [];}
async function fireSchedule(s){const tgt=schTargetUnits(s);if(!tgt.length)return;const a=s.action;
  const n=await applyAndSendAs(tgt,u=>{if(a.power)u.on=a.power==="on";if(a.mode)u.mode=a.mode;if(a.fan&&a.fan!=="auto")u.fan=a.fan;
    if(a.sp!=null){const c=settings.unit==="C"?a.sp:(a.sp-32)*5/9;u.coolC=Math.round(c*2)/2;u.heatC=Math.round(c*2)/2;}});
  if(view==="schedule")renderAll();
  toast(`⏱ Schedule "${s.name}" ran → ${n} of ${tgt.length} unit${tgt.length>1?"s":""}`);}
// a schedule acts for the site, not for whoever happens to be signed in — it is not subject to the customer lock
async function applyAndSendAs(list,mut){
  holdUnits(list);
  list.forEach(u=>{mut(u);u.coolC=clampC(u.coolC);u.heatC=clampC(u.heatC);u.sp=Math.round(activeC(u)*9/5+32);});
  let n=list.length;if(canReach())n=await sendUnits(list);
  saveUnits();liveRefresh(true);return n;}
/* Which run of each schedule has already happened is remembered by THIS screen (not in the shared
   config), so firing a schedule never rewrites site settings from a screen with an old copy. */
const SCH_GRACE=10*60000;
function loadFired(){try{return JSON.parse(LS.getItem("airow_sched_fired"))||{};}catch(e){return {};}}
function saveFired(f){try{LS.setItem("airow_sched_fired",JSON.stringify(f));}catch(e){}}
function schDue(s,now){const m=/^(\d\d):(\d\d)$/.exec(s.time||"");if(!m)return null;const d=new Date(now);d.setHours(+m[1],+m[2],0,0);return d;}
function schKey(s,now){return now.toDateString()+" "+s.time;}
function schTick(){if(!CFG||!CFG.schedules||!CFG.schedules.length)return;
  // Only the screen connected to the equipment runs schedules; other screens just display them.
  if(!IS_FILE)return;                        // served by a controller: the controller runs schedules itself (appliance/scheduler.js)
  const now=new Date(),fired=loadFired();let dirty=false;
  CFG.schedules.forEach(s=>{
    if(!s.enabled)return;
    const due=schDue(s,now);if(!due)return;
    // Due any time in the last few minutes — not "this exact minute". A browser that throttled its
    // timers, reloaded for an update, or briefly lost the adapter no longer skips the run.
    const late=now-due;if(late<0||late>SCH_GRACE)return;
    if(!(s.days&&s.days.includes(now.getDay())))return;
    if(!schNthMatches(s,now))return;
    const key=schKey(s,now);if(fired[s.id]===key)return;
    if(!schCondOk(s))return;
    fired[s.id]=key;dirty=true;fireSchedule(s);});
  if(dirty)saveFired(fired);}
setInterval(schTick,20000);

/* ---- updates ---- real OTA check against the appliance backend ---- */
let updateState=null;  // null = not checked yet; else {current,latest,updateAvailable,configured,error,checkedAt,checking}
function ue(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function doUpdateCheck(){
  updateState={checking:true}; renderUpdates();
  try{
    const r=await fetch('/api/update/check?fresh=1',{cache:'no-store'});
    updateState=await r.json();
  }catch(e){
    updateState={error:'Could not reach the update service — this screen works on the installed appliance, not the file:// demo.'};
  }
  renderUpdates();
}
function renderUpdates(){renderGroupNav();
  if(updateState===null){ doUpdateCheck(); return; }   // auto-check the first time the page opens
  const s=updateState, cur=s.current||'—';
  let badge='', body='';
  if(s.checking){ badge='<span class="badge-ok">Checking…</span>'; body=brainLoader(64,"Checking for updates…","row"); }
  else if(s.updateAvailable){ badge='<span class="badge-new">Update available</span>';
    body=`<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-weight:600">v${ue(s.latest)} is available</div>
      ${updNotes(s.notes)}
      <div class="note-box" style="margin-top:12px">This controller installs updates automatically within about 30 minutes — it verifies the download first and rolls back on its own if anything's wrong. No action needed here.</div></div>`; }
  else if(s.configured===false){ body=`<div class="note-box" style="margin-top:12px">Automatic updates aren't turned on for this controller yet.</div>`; }

/* ===== Rheem / Ruud (EcoNet) =====
   A second kind of equipment beside the LG bus. Each system (a thermostat with its air handler / furnace /
   outdoor unit, or a water heater) has its own bus and its own USB adapter on the controller, which does all
   the talking (appliance/econet.js, econetlink.js). This page only shows what the controller reports and
   passes on the changes a person makes. See docs/ECONET.md. */
function ecoNav(){if(view==="econet"&&!(APPL&&can("eco_setup")))view="units";}     // the setup page is reached from Settings ▸ Equipment, technicians only
async function ecoPull(){if(!APPL||!currentUser)return;
  try{const r=await fetch("/api/econet",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();ECOS.systems=j.systems||[];ECOS.at=Date.now();ECOS.err="";
    if(!ECOS.catalog&&ECOS.systems.length){try{ECOS.catalog=(await (await fetch("/api/econet/catalog")).json()).kinds;}catch(e){}}
  }catch(e){ECOS.err=e.message;}
  ecoNav();ecoRefresh();}
setInterval(()=>{if(BOOTED&&APPL&&document.visibilityState==="visible"&&Date.now()-ECOS.at>((view==="econet"||ECOS.modal||(view==="busscan"&&busBrand!=="lg"))?4000:(view==="units"||view==="map")?10000:60000))ecoPull();},2000);
const ECO_STATE={live:["Live","run"],listening:["Listening only","stop"],starting:["Starting…","stop"],silent:["Nothing heard yet","noresp"],unanswered:["Not answering","noresp"],opening:["Opening adapter…","stop"],problem:["Adapter problem","err"],off:["Off","stop"]};
function ecoPoints(sys){return (ECOS.catalog&&ECOS.catalog[sys.kind]&&ECOS.catalog[sys.kind].points)||[];}
function ecoRole(sys,role){return ecoPoints(sys).find(p=>p.role===role)||null;}
function ecoVal(sys,n){const k=sys.id+":"+n,pd=ECOS.pend[k];if(pd&&Date.now()-pd.at<6000)return {v:pd.v,text:pd.text,pending:true};return sys.values[n]||null;}
function ecoFmt(p,x){if(!x)return "—";if(p.kind==="num")return x.v==null?"—":((Math.round(x.v*10)/10)+(p.unit?" "+p.unit:""));return ue(x.text||(x.v!=null?String(x.v):"—"));}

let ecoSendT={};
/* A change: shown at once, sent once after the person stops tapping, then replaced by what the equipment reports. */
function ecoSet(sys,p,v,text){const k=sys.id+":"+p.n;ECOS.pend[k]={v,text:text||null,at:Date.now()};ecoRefresh(true);clearTimeout(ecoSendT[k]);
  ecoSendT[k]=setTimeout(async()=>{try{const r=await fetch("/api/econet/systems/"+sys.id+"/write",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:p.n,value:v})});const j=await r.json();
      if(!j.ok){delete ECOS.pend[k];toast("Couldn’t change “"+p.label+"”: "+(j.err||"no answer"));}else{ECOS.pend[k].at=Date.now();toast(p.label+" → "+(text||v+(p.unit?" "+p.unit:"")));}}
    catch(e){delete ECOS.pend[k];toast("Couldn’t reach the controller");}
    setTimeout(ecoPull,1800);},p.kind==="num"?700:0);}
function ecoStepper(sys,p){if(!p)return "";const x=ecoVal(sys,p.n);if(!x)return "";const can=ecoCan(sys)&&p.w;
  return `<div class="eco-row"><label>${ue(p.label)}</label><span class="eco-step"><button data-eco="${sys.id}" data-n="${p.n}" data-d="-1" ${can?"":"disabled"} aria-label="lower">−</button><b style="${x.pending?"opacity:.6":""}">${ecoFmt(p,x)}</b><button data-eco="${sys.id}" data-n="${p.n}" data-d="1" ${can?"":"disabled"} aria-label="raise">+</button></span></div>`;}

  return `<div class="eco-row"><label>${ue(p.label)}</label><select class="sel-box" data-ecosel="${sys.id}" data-n="${p.n}" ${can?"":"disabled"}>${opts.map(o=>`<option value="${o}" ${String(x.v)===o?"selected":""}>${ue(p.options[o])}</option>`).join("")}</select></div>`;}
function ecoCard(sys){const st=ECO_STATE[sys.state]||[sys.state,"stop"],pts=ecoPoints(sys),R=r=>ecoRole(sys,r),temp=R("temp"),act=R("action"),hum=R("humidity");

  const rows=groups.map(([g,title])=>{const ps=pts.filter(p=>p.group===g&&!shown.has(p.role)&&sys.values[p.n]);return ps.length?`<tr><th colspan="2">${title}</th></tr>`+ps.map(p=>`<tr><td>${ue(p.label)}</td><td style="${sys.values[p.n].stale?"color:var(--text-faint)":""}">${ecoFmt(p,sys.values[p.n])}</td></tr>`).join(""):"";}).join("");

    :sys.state==="problem"?"The controller can’t open this adapter"+(sys.error?" ("+ue(sys.error)+")":"")+"."
    :sys.state==="unanswered"?"The equipment is not answering Cortex’s questions. It can be heard, so the wiring is right; this kind of equipment or its address may differ."

    ${(sys.alarms||[]).map(a=>{const k=rheemKey(a,sys.kind),e=errInfo(k);return `<div class="eco-alarm" data-ecoerr="${ue(k)}" style="cursor:pointer" title="Open the guide for this alarm">⚠ <b>${ue(codeShown(k))}</b>${e.unknown?"":" · "+ue(e.t)} <span style="font-weight:400;opacity:.8">— tap for what it means and how to fix it</span></div>`;}).join("")}
    ${tv?`<div class="eco-big"><b>${tv.v==null?"—":Math.round(tv.v*10)/10}°</b><span>${ue(temp.label)}${av?" · "+ecoFmt(act,av):""}${hv&&hv.v!=null?" · "+Math.round(hv.v)+"% humidity":""}</span></div>`:(Object.keys(sys.values).length?"":`<div class="eco-big"><span>No readings yet.</span></div>`)}

      <button class="btn" data-ecot="talk" data-id="${sys.id}" ${sys.on?"":"disabled"} title="Listening only never transmits. Talking lets Cortex ask for values and send changes.">${sys.talk?"Switch to listening only":"Let Cortex talk on this bus"}</button>
      <button class="btn" data-ecot="frames" data-id="${sys.id}">Messages</button><button class="btn" data-ecot="read" data-id="${sys.id}" ${ecoCan(sys)?"":"disabled"}>Read a value</button>
      <button class="btn" data-ecot="edit" data-id="${sys.id}">Rename</button><button class="btn" data-ecot="del" data-id="${sys.id}">Remove</button>
      <span style="font-size:11px;color:var(--text-faint);align-self:center">heard ${sys.heard} · asked ${sys.sent}${sys.unanswered?" · "+sys.unanswered+" unanswered":""}</span></div>`:""}</div>`;}
function renderEconet(){const m=document.getElementById("main");if(!APPL){m.innerHTML=`<div class="note-box">Rheem / Ruud systems are shown when Cortex is opened from a controller.</div>`;return;}

  m.innerHTML=`<div class="toolbar" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn" id="eco-back">← Indoor units</button><h2 style="margin:0;font-size:19px">Rheem / Ruud setup</h2><span style="color:var(--text-faint);font-size:13px">Each system here also shows as a unit on Indoor units and the Building map</span>

      :`<div class="note-box">No Rheem / Ruud system has been added yet.${can("eco_setup")?" Plug a USB RS-485 adapter into the controller, connect it to the equipment’s EcoNet service port, then press <b>Add a system</b>.":" A technician can add one."}</div>`}
    ${can("eco_setup")?`<div class="note-box" style="margin-top:14px;font-size:12.5px"><b>How a system is brought up.</b> ① <b>Connect adapter</b>: Cortex only listens, and shows what the thermostat and equipment say to each other. Nothing is sent. ② <b>Let Cortex talk</b>: Cortex also asks for values and can send changes. It never sends anything until it has heard a good message, which proves the wiring is right. ③ Changes are sent only when someone makes one here.</div>`:""}`;

async function ecoPost(body){const r=await fetch("/api/econet/systems",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.err||("HTTP "+r.status));return j;}

/* Rename a unit right in the drawer header: pencil -> inline box -> Enter/Save. Anyone signed in can
   do it (a name is not a control), and it is stored as the unit's alias in the shared config. */
function saveUnitName(u,name){const v=String(name||"").replace(/\s+/g," ").trim().slice(0,40);
  if(v===getMeta(u).alias)return false;
  if(!v&&!getMeta(u).alias)return false;
  setMeta(u,{alias:v});return true;}
function startRename(u){const box=document.getElementById("dname");if(!box)return;const cur=dispName(u);
  box.outerHTML=`<div class="dname-edit" id="dname"><input class="inp" id="ren-inp" maxlength="40" value="${ue(cur)}" aria-label="Unit name" placeholder="e.g. Front Office"><button class="btn primary sm" id="ren-ok">Save</button><button class="btn sm" id="ren-x">Cancel</button></div>`;
  const inp=document.getElementById("ren-inp");inp.focus();inp.select();
  const done=save=>{if(save){const v=inp.value.trim();
      if(v!==cur&&saveUnitName(u,v)){toast(v?("Renamed to "+v.slice(0,40)):"Name cleared");refreshUnderDrawer();}}
    if(openId===u.id)drawDrawer(u);};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();done(true);}else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done(false);}};
  document.getElementById("ren-ok").onclick=()=>done(true);
  document.getElementById("ren-x").onclick=()=>done(false);}
