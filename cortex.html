 comm:{who:"Wiring",fig:["rnet"],cause:"The thermostat can no longer talk to this part of the system over the EcoNet control wiring. Rheem treats this as critical: the part that went quiet will not run.",
  act:"Check power to the unit that went quiet first, then the four control wires between it and the thermostat. A unit with no power cannot answer.",chk:R_WIRE_CHK,
  diag:[{q:"Does the unit that stopped answering have power?",how:"Check its breaker or disconnect, its door switch, and the low-voltage fuse on its control board. Look for a lit status light on the board.",bad:"no",fix:"Restore power: reset the breaker, close the door switch, or find the short that blew the low-voltage fuse and replace the fuse."},
   {q:"Is there about 24 V AC between R and C at that unit's control board?",how:"Measure at the terminals where the thermostat cable lands.",bad:"no",fix:"The transformer, the low-voltage fuse or the R / C wires are at fault. Trace 24 V back from the board to the transformer."},
   {q:"Are E1 and E2 landed on the same terminals at every device, tight, with no stray strands?",how:"Compare wire colours at the thermostat, the indoor unit and the outdoor unit. E1 must go to E1 and E2 to E2 everywhere.",bad:"no",fix:"Correct the swapped or loose data wire and re-tighten every terminal."},
   {q:"With power off, do E1 and E2 each show continuity end to end, and no connection to each other, to R, to C or to ground?",how:"Disconnect both ends of the cable before measuring.",bad:"no",fix:"Replace or repair the control cable. Look for staples, rodent damage and splices."},
   {q:"With every other device disconnected from the data wires, does this unit start talking to the thermostat?",how:"Reconnect the others one at a time to find one that drags the bus down.",bad:"yes",fix:"The device that stops communication when reconnected has a failed control. Replace that control."}]},
 sensor:{who:"Sensor",fig:["rtherm"],cause:"A temperature or pressure sensor is reading outside its possible range: open, shorted, unplugged, or failed.",
  act:"Find the named sensor, check its plug, then measure the sensor. The system usually keeps running in a limited way without it.",chk:R_TH_CHK,
  diag:[{q:"Is the sensor plugged firmly into the control board, with no corrosion or bent pins?",how:"Unplug it and plug it back in. Look for green corrosion, especially near the coil.",bad:"no",fix:"Clean and reseat the connector, or replace the sensor if the plug is damaged."},
   {q:"Does the sensor's resistance match the chart for its real temperature?",how:"Measure the sensor unplugged. Compare with the chart in the service manual. Warm it in your hand: the reading should change smoothly.",bad:"no",fix:"Replace the sensor."},
   {q:"Is the sensor's wire undamaged along its whole length?",how:"Look where it passes sheet metal edges and where it is tied to refrigerant lines.",bad:"no",fix:"Repair or replace the sensor lead."},
   {q:"With a known-good sensor plugged in, does the alarm clear?",bad:"no",fix:"The control board's input has failed. Replace the control board."}]},
 data:{who:"Control",cause:"The control board has lost, or cannot read, the stored information that tells it which model it is fitted to. Without it the unit does not know how to run its blower or compressor.",
  act:"Check that the memory card is fitted and seated. If the board was replaced, the model data has to be loaded again. If it keeps returning, the control needs replacing.",
  diag:[{q:"Is the memory card present and fully seated on the control board?",how:"Power the unit off before touching it. The card is tethered inside the control box and must stay with the unit, not with the old board.",bad:"no",fix:"Reseat the memory card, or move the original card from the old board to the new one, then restore power."},
   {q:"Was the control board replaced recently?",bad:"yes",fix:"Load the model data for this unit using Rheem's contractor app and the unit's serial number, then cycle power."},
   {q:"After cycling power with the card seated, does the alarm clear?",bad:"no",fix:"Replace the control board (and the memory card if Rheem's page for this code says so)."}]},
 airflow:{who:"Airflow",fig:["rair"],cause:"Not enough air is moving across the indoor coil, or the duct system is too restrictive. The coil may be iced over.",
  act:"Start with the filter. Then check for a frozen coil, closed registers and dampers, and a blower that is not reaching speed.",
  chk:"If the coil is frozen, switch cooling off and run the fan only until it thaws before measuring anything. Total external static pressure above about 1 inch of water column points to the ductwork, not the equipment.",
  diag:[{q:"Is the air filter clean?",bad:"no",fix:"Replace the filter and let the system run. Ask how long since it was last changed."},
   {q:"Is the indoor coil free of ice and dirt?",how:"Look at the coil face through the access panel. Ice means the airflow or the refrigerant charge is low.",bad:"no",fix:"Thaw the coil with the fan, clean it if dirty, then find why it froze: airflow first, charge second."},
   {q:"Are the supply registers and any zone dampers open, and the return unobstructed?",bad:"no",fix:"Open the registers and dampers and clear the return. Too many closed zones raise static pressure."},
   {q:"Does the blower reach speed and move air on every stage?",how:"Compare the airflow and static pressure the thermostat reports with what the model should deliver.",bad:"no",fix:"Check the blower wheel for dirt, then the blower motor and its control (see the blower motor codes)."},
   {q:"Is the refrigerant charge right?",how:"Only once airflow is proven. Check superheat and subcooling against the charging chart.",bad:"no",fix:"Find and fix the leak, then weigh in or adjust the charge."}]},
 blower:{who:"Blower",cause:"The control cannot run, or cannot talk to, the variable-speed blower motor.",
  act:"Check the two plugs on the motor (power and control), the line voltage at the motor, and whether the wheel turns freely.",
  diag:[{q:"Does the blower wheel turn freely by hand with power off?",bad:"no",fix:"Free or replace the wheel, or replace the motor if its bearings have seized."},
   {q:"Are both motor plugs seated, with no burnt or backed-out pins?",bad:"no",fix:"Reseat or repair the harness."},
   {q:"Is full line voltage present at the motor's power plug?",bad:"no",fix:"Trace the missing voltage back through the door switch, wiring and board."},
   {q:"With power and wiring proven, does the motor run?",bad:"no",fix:"Replace the motor (or its control module, where it is a separate part). If the code says the motor size does not match, fit the motor listed for this model."}]},
 drain:{who:"Drain",fig:["rdrain"],cause:"A float switch has opened: the condensate drain pan is filling with water because the drain is blocked.",
  act:"Clear the condensate drain and trap, empty the pan, and confirm the float switch closes again. Cooling stays off until it does.",
  diag:[{q:"Is there standing water in the drain pan or the secondary pan?",bad:"yes",fix:"Clear the drain line and trap (wet vacuum from outside, then flush). Empty the pan."},
   {q:"With the pan dry, does the float switch close?",how:"Measure across the switch: it should show continuity when the float is down.",bad:"no",fix:"Replace the float switch."},
   {q:"Is the float switch wired to the input the alarm names?",bad:"no",fix:"Correct the wiring, or change the input's setting at the thermostat to match what is connected."}]},
 auxin:{who:"Accessory",cause:"Something wired to one of the air handler's auxiliary inputs has told the system to stop or to hold off one kind of heating or cooling. The control is doing what that input is set up to do.",
  act:"Find what is wired to the named input (a float switch, a smoke detector, an energy-management relay, a freeze stat) and see why it tripped.",
  diag:[{q:"Is a device actually wired to the named auxiliary input?",bad:"no",fix:"Nothing is connected, so the input's setting is wrong. Set that input to unused at the thermostat."},
   {q:"Is that device in its normal state?",how:"A drain float should be down, a smoke detector not in alarm, a utility relay not calling for shut-off.",bad:"no",fix:"Deal with whatever the device is reporting. The system releases when the input returns to normal."}]},
 refleak:{who:"Safety",cause:"A refrigerant sensor in the indoor unit has detected refrigerant in the air, or the control has lost contact with that sensor. Newer refrigerants are mildly flammable, so the system runs the blower and stops the compressor.",
  act:"Ventilate the space and keep ignition sources away. Leak-check the indoor coil and its connections before running the system again.",
  diag:[{q:"Is the alarm a sensor communication fault rather than refrigerant detected?",bad:"yes",fix:"Check the sensor's plug and harness at the control board. Replace the sensor if the wiring is good."},
   {q:"Does a leak detector find refrigerant at the indoor coil, the metering device or the line connections?",bad:"yes",fix:"Recover the charge, repair the leak, pressure test, evacuate and recharge. Do not just reset the alarm."},
   {q:"With no leak found, does the alarm return after the sensor is replaced?",bad:"yes",fix:"Replace the control board."}]},
 ignition:{who:"Furnace",fig:["rfurn"],cause:"The furnace tried to light and either did not get a flame or lost it. After several tries it locks out for an hour.",
  act:"Check gas supply, then watch one start-up: inducer, pressure switch, igniter glow, gas valve, flame. The step that fails tells you the part.",
  chk:"Watch a full ignition sequence with the burner door safely positioned. A dirty flame sensor is the most common cause of a flame that lights and then drops out.",
  diag:[{q:"Is gas reaching the furnace?",how:"Gas cock open, other gas appliances working, inlet pressure within the rating plate range.",bad:"no",fix:"Restore the gas supply or correct the inlet pressure."},
   {q:"Does the igniter glow (or spark) during the start-up?",bad:"no",fix:"Check the igniter's plug and resistance; replace a cracked or open igniter."},
   {q:"Do the burners light?",how:"If the igniter glows but nothing lights, listen for the gas valve click and check manifold pressure.",bad:"no",fix:"No valve click with voltage present: replace the gas valve. No voltage: follow the pressure switch and limit circuit back to the control."},
   {q:"Does the flame stay on for more than a few seconds?",bad:"no",fix:"Clean the flame sensor with fine abrasive pad, check its wire and the furnace ground. Replace the sensor if it is cracked."},
   {q:"Do all burners light smoothly across, with a steady blue flame?",bad:"no",fix:"Clean the burners and crossovers, check for a cracked heat exchanger disturbing the flame, and confirm the vent is clear."}]},
 flame:{who:"Safety",fig:["rfurn"],cause:"The control sees a flame when the gas valve should be closed, or has found a fault in its own gas valve or flame-sensing circuit. This is a safety lockout.",
  act:"Shut off the gas to the furnace. Do not reset and leave. A valve that does not close, or a control that cannot be trusted to close it, must be replaced.",
  diag:[{q:"With the thermostat satisfied, is there any flame at the burners?",bad:"yes",fix:"Shut the gas cock. The gas valve is leaking through: replace it."},
   {q:"Is the flame sensor wire shorted to the cabinet, or the sensor wet or sooted?",bad:"yes",fix:"Clean or replace the sensor and repair its wire."},
   {q:"With no flame and a good sensor, does the alarm return after power is cycled?",bad:"yes",fix:"The control board's flame or gas valve relay circuit has failed. Replace the control board."}]},
 limit:{who:"Furnace",fig:["rair"],cause:"A temperature safety switch on the furnace has opened because the furnace got too hot (main limit) or flame came out of the burner box (roll-out).",
  act:"A main limit almost always means low airflow: filter, blower, closed registers. A roll-out switch means flame went where it should not: check the vent and the heat exchanger before resetting.",
  diag:[{q:"Is it the roll-out switch that tripped?",how:"Roll-out switches are manual-reset buttons near the burners.",bad:"yes",fix:"Do not just reset. Check for a blocked vent or heat exchanger, a cracked heat exchanger, and low inducer draft. Reset only after the cause is found."},
   {q:"Is the filter clean and are registers open?",bad:"no",fix:"Replace the filter and open the registers. The limit resets itself when the furnace cools."},
   {q:"Does the blower come on and reach speed when the burners are lit?",bad:"no",fix:"Check the blower motor, its wheel and its control."},
   {q:"Is the temperature rise across the furnace inside the range on the rating plate?",bad:"no",fix:"Too high: raise the blower speed or reduce the gas input to the rating. Check that the furnace is not oversized for the ducts."},
   {q:"With airflow proven, does the limit still open?",bad:"yes",fix:"Replace the limit switch."}]},
 pswitch:{who:"Furnace",fig:["rfurn"],cause:"The pressure switch that proves the inducer fan is moving flue gas is in the wrong state: stuck closed before the inducer starts, or not closing once it runs.",
  act:"Check the inducer runs, the vent and intake are clear, the condensate trap drains, and the rubber tube to the switch is sound.",
  diag:[{q:"Does the inducer fan start and run up to speed?",bad:"no",fix:"Check voltage to the inducer; replace the inducer motor or the control."},
   {q:"Are the vent and combustion-air pipes clear end to end, including the outside terminations?",how:"Look for nests, ice, sagging pipe holding water, and blocked screens.",bad:"no",fix:"Clear the blockage and correct any sag."},
   {q:"Is the condensate trap and drain clear (on condensing furnaces)?",bad:"no",fix:"Clean the trap and hose. Water backing up into the collector box holds the switch open."},
   {q:"Is the pressure switch tube connected, uncracked and free of water?",bad:"no",fix:"Clear or replace the tube and clean the port it connects to."},
   {q:"Does the switch read closed with the inducer running and open with it stopped?",how:"If it is closed with the inducer stopped, the switch is stuck.",bad:"no",fix:"Replace the pressure switch with the exact part for this model."}]},
 fuse:{who:"Wiring",cause:"The low-voltage fuse on the control board has blown. Something in the 24 V wiring is shorted.",
  act:"Do not just fit a bigger fuse. Find the short: thermostat cable, outdoor unit wiring, a contactor coil, a humidifier or other accessory.",
  diag:[{q:"With the thermostat cable and all accessories disconnected from the board, does a new fuse hold?",bad:"no",fix:"The short is on the board or its transformer. Replace the board."},
   {q:"Reconnecting one cable at a time, which one blows the fuse?",how:"Check that cable for bare wire touching metal, especially at the outdoor unit and where it passes through the cabinet.",bad:"yes",fix:"Repair or replace the shorted cable or the shorted part on it (contactor coil, reversing valve coil, accessory)."}]},
 refpress:{who:"Refrigerant",cause:"The outdoor unit's refrigerant pressure went outside its safe range. Low pressure usually means low charge or low indoor airflow. High pressure usually means a dirty outdoor coil, a failed outdoor fan, or overcharge.",
  act:"Check airflow on both coils before touching the charge. An alert (T) means it happened; an alarm (A) means it kept happening and the unit locked out.",
  diag:[{q:"Is the outdoor coil clean and the outdoor fan running?",bad:"no",fix:"Clean the coil; repair the fan motor, capacitor or blade."},
   {q:"Is indoor airflow good (clean filter, clean coil, blower at speed)?",bad:"no",fix:"Correct the indoor airflow first; see the airflow checks."},
   {q:"Are the service valves fully open and is there no kinked or crushed line?",bad:"no",fix:"Open the valves; replace the damaged section of line."},
   {q:"Do superheat and subcooling match the charging chart?",bad:"no",fix:"Low charge: find and repair the leak, then recharge. Overcharge: recover to the correct charge."},
   {q:"With pressures normal on gauges, does the alarm return?",bad:"yes",fix:"The pressure switch or sensor, or its wiring, is faulty. Replace it."}]},
 comp:{who:"Compressor",cause:"The outdoor control did not see what it expects at the compressor: it would not start, it has no voltage when it should, or it has voltage when it should be off.",
  act:"Check incoming power and the contactor first, then the compressor's capacitor and windings.",
  diag:[{q:"Is line voltage correct and steady at the outdoor unit, on both legs?",how:"Measure while the compressor tries to start. A large dip means a supply problem.",bad:"no",fix:"Have the supply corrected: loose lugs, an undersized circuit or a utility problem."},
   {q:"Does the contactor pull in when called and drop out when not?",how:"Voltage at the compressor with no call means welded contactor points.",bad:"no",fix:"Replace the contactor."},
   {q:"Is the run capacitor within its rated tolerance?",bad:"no",fix:"Replace the capacitor."},
   {q:"Do the compressor windings measure correctly, with no reading to ground?",bad:"no",fix:"The compressor has failed. Confirm with Rheem's procedure before replacing it."},
   {q:"With good power, contactor and capacitor, does the compressor still hum and trip?",bad:"yes",fix:"The compressor is mechanically locked. A hard-start kit may be tried where Rheem allows it; otherwise replace the compressor."}]},
 power:{who:"Power",cause:"The line voltage at the outdoor unit dropped too low for the unit to run safely.",
  act:"Measure the supply while the unit starts. Look for loose connections, an undersized circuit, or a utility problem.",
  diag:[{q:"Is the voltage at the disconnect within the rating plate range, with the unit running?",bad:"no",fix:"Tighten every lug from the breaker to the unit. If it is still low, the circuit or the utility supply needs correcting."}]},
 inverter:{who:"Outdoor",cause:"The outdoor control has lost contact with the inverter drive board that runs the variable-speed compressor.",
  act:"Check the communication cable between the outdoor control and the drive board. If the cable is good, one of the two boards has failed.",
  diag:[{q:"Is the cable between the outdoor control and the inverter drive seated at both ends and undamaged?",bad:"no",fix:"Reseat or replace the cable."},
   {q:"Does the drive board have power (lights on)?",bad:"no",fix:"Find why the drive is unpowered: line voltage, the choke and filter connections, or a failed drive."},
   {q:"With a good cable and a powered drive, does the alarm remain?",bad:"yes",fix:"Replace the outdoor control first, then the inverter drive, as Rheem's page for this code directs."}]},
 reminder:{who:"Reminder",cause:"A maintenance reminder, not a fault. The system keeps running normally.",
  act:"Do the task it names (change the filter, book the service visit), then clear the reminder at the thermostat."},
 clock:{who:"Thermostat",cause:"The thermostat's clock is not set or is not keeping time, so its schedule cannot be trusted.",
  act:"Set the date and time at the thermostat. If it will not keep time after power has been steady, the thermostat needs replacing."},
 statsensor:{who:"Thermostat",cause:"A sensor built into the thermostat has failed.",
  act:"Cycle power to the thermostat. If the alarm returns, replace the thermostat. A remote sensor, if one is fitted, should be checked at its wiring first."},
 roomtemp:{who:"Comfort",cause:"The room is more than 10 degrees away from what the thermostat is asking for. The system is running but not keeping up, or is not running at all.",
  act:"Look for another alarm first: this one is usually the result of something else. If there is none, check the equipment is actually heating or cooling and the filter is clean.",
  diag:[{q:"Is another alarm active on this system?",bad:"yes",fix:"Work on that alarm. This one will clear when the system catches up."},
   {q:"Is the equipment running and producing warm or cool air at the registers?",bad:"no",fix:"Check power to the indoor and outdoor units, and whether the thermostat is actually calling."},
   {q:"Is the filter clean and are doors and windows closed?",bad:"no",fix:"Correct that and give the system time to recover."}]},
 unsupported:{who:"Setup",cause:"The thermostat has found an outdoor unit, or a combination of equipment, that it does not support.",
  act:"Confirm the outdoor unit and indoor unit are a listed match and that the thermostat is the right model with current software."},
 setup:{who:"Setup",cause:"The air handler has found a heater kit or accessory it cannot identify, or one that is not allowed with this model.",
  act:"Check the heater kit's model against the list for this air handler and that its plug is fully seated."},
 control:{who:"Control",cause:"The control board has found a fault inside itself.",
  act:"Cycle power once. If the alarm returns, replace the control board."},
 // --- hybrid (heat pump) water heater ---
 whcomp:{who:"Heat pump",fig:["rhpwh"],cause:"The water heater shut its compressor down to protect it and is heating with the electric elements instead. Hot water continues, but it costs more to make.",
  act:"Clean the air filter on top first. Then check the fan runs and air can move freely around the unit. If it keeps returning, the sealed refrigerant system needs a technician.",
  diag:[{q:"Is the air filter on top of the heater clean?",bad:"no",fix:"Wash and dry the filter and refit it."},
   {q:"Does the fan run and is there open space around the air inlet and outlet?",how:"The unit needs room to breathe; a closet with no air path will trip it.",bad:"no",fix:"Clear the obstruction or provide the airflow the installation manual calls for. Replace the fan if it does not run."},
   {q:"Do the temperature sensors read sensibly in the service menu?",bad:"no",fix:"Check that sensor's wiring and resistance; replace the sensor."},
   {q:"With clean filter, good fan and good sensors, does it return?",bad:"yes",fix:"The sealed system has a problem (loss of refrigerant or a failed compressor). Contact Rheem technical service; the unit may need replacing."}]},
 whdry:{who:"Tank",cause:"The heater believes the tank is not full of water. It disables heating so the elements are not burnt out dry.",
  act:"Make sure the tank is full: open a hot tap until water runs with no air. Then restore power.",
  diag:[{q:"Does water flow steadily, with no air, from a hot tap?",bad:"no",fix:"Open the cold supply valve fully and run the hot tap until all air is purged. Repeat if the alarm stays."},
   {q:"With the tank proven full, does the alarm remain?",bad:"yes",fix:"Check the upper tank sensor and its wiring; contact Rheem technical service."}]},
 whsensor:{who:"Sensor",fig:["rhpwh","rtherm"],cause:"One of the heater's temperature sensors has failed. Depending on which, it either heats with the elements only or stops heating.",
  act:"Check the named sensor's plug at the control board, then its resistance.",chk:R_TH_CHK,
  diag:[{q:"Is the sensor's plug seated on the control board?",bad:"no",fix:"Reseat it."},{q:"Does its resistance match the chart for its temperature?",bad:"no",fix:"Replace the sensor."},{q:"With a good sensor, does the alarm remain?",bad:"yes",fix:"Replace the control board."}]},
 whleak:{who:"Leak",fig:["rhpwh"],cause:"The leak sensor in the pan under the heater is wet, or is not connected.",
  act:"Look for water. If there is a leak, shut the cold supply and find it. If everything is dry, the sensor rope needs drying or replacing.",
  diag:[{q:"Is there water in the pan or on the floor?",bad:"yes",fix:"Shut off the cold water supply. Find the source: fittings, the relief valve, the condensate drain, or the tank itself."},
   {q:"Is the sensor rope dry, connected and lying flat in the pan?",bad:"no",fix:"Dry or replace the sensor rope and reconnect it."},
   {q:"With a dry, connected sensor, does the alarm return?",bad:"yes",fix:"Replace the control board."}]},
 whcond:{who:"Drain",fig:["rhpwh"],cause:"Condensate from the heat pump is not draining away. The heater uses its elements until it can drain.",
  act:"Clear the condensate drain line and check the pan under the evaporator.",
  diag:[{q:"Is the condensate line clear and sloped downhill all the way?",bad:"no",fix:"Clear the blockage and correct the slope."},{q:"With the pan dry and the line clear, does the alarm return?",bad:"yes",fix:"Replace the condensate sensor."}]},
 whvalve:{who:"Shut-off valve",cause:"The automatic water shut-off valve did not do what the heater asked, or is not connected.",
  act:"Check the valve's wiring and plug. Unplug it and plug it back in.",
  diag:[{q:"Is the valve's cable plugged in at both ends?",bad:"no",fix:"Reconnect it."},{q:"After unplugging and replugging the valve, does it move when tested?",bad:"no",fix:"Contact Rheem customer service; the valve needs replacing."}]},
 whelement:{who:"Elements",fig:["rhpwh"],cause:"An electric heating element or the relay that switches it has failed. The heater is disabled.",
  act:"Turn the power off at the breaker. Measure the named element's resistance and check its wiring.",
  chk:"Always isolate power at the breaker and prove it dead before removing the element cover. Measure the element with its wires removed: an open reading or any reading to the tank means the element has failed.",
  diag:[{q:"With power off, does the element measure a steady resistance, with no reading to the tank?",bad:"no",fix:"Replace the element."},
   {q:"Are the element wires on the right terminals and tight?",bad:"no",fix:"Correct the wiring to match the diagram inside the cover."},
   {q:"With a good element and wiring, does the alarm return?",bad:"yes",fix:"The relay on the control board has failed. Replace the control board."}]},
 wheco:{who:"Safety",cause:"The water got too hot and the high-temperature safety cut-out tripped. The heater is disabled.",
  act:"Turn the power off. This is usually a shorted element or a failed tank sensor letting the element run on.",
  diag:[{q:"With power off, does either element show a reading to the tank (ground)?",bad:"yes",fix:"Replace that element."},{q:"Do the tank sensors measure correctly?",bad:"no",fix:"Replace the sensor."},{q:"With good elements and sensors, does it trip again?",bad:"yes",fix:"Replace the control board."}]},
 whinfo:{who:"Notice",cause:"A notice from the heater rather than a failure.",act:"Follow what it says. Heating continues unless the notice says otherwise."}};

function rheemKey(text,kind){const s=String(text||""),m=/\b([AST])[ _-]?(\d{3})(?:[ _-]?([OAFCSZ])\b)?/i.exec(s);if(!m)return "R:?:"+s.slice(0,60);
  const base=(m[1]+m[2]).toUpperCase(),sfx=m[3]?m[3].toUpperCase():"";
  if(kind&&kind!=="hvac")return ERRORS["R:W:"+base]?"R:W:"+base:"R:?:"+s.slice(0,60);
  if(sfx&&ERRORS["R:"+base+"_"+sfx])return "R:"+base+"_"+sfx;
  const hits=Object.keys(ERRORS).filter(k=>k.startsWith("R:"+base+"_"));
  return hits.length===1?hits[0]:"R:?:"+s.slice(0,60);}

function renderChannelRow(el,chan){
  let h=`<div style="margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint)">Update channel</div>`;
  h+=`<div class="setrow"><div><div class="sl">Beta testing</div><div class="sd">Also install <b>pre-release</b> (alpha / beta / rc) builds on this controller. Off = stable releases only, which is what you want on a customer site.</div></div>`;
  h+= can("updates") ? `<button class="toggle ${chan==='beta'?'on':''}" id="chan-tog"></button>`
                 : `<span style="color:var(--text-faint);font-size:12px">${chan==='beta'?'on':'off'} · admins only</span>`;
  h+=`</div>`;
  if(chan==='beta') h+=`<div class="note-box warn" style="margin-top:8px">⚠ This controller is on the <b>beta channel</b> and will install pre-release builds. Use on test sites, not production.</div>`;

async function loadChannelRow(){
  const el=document.getElementById("setchan");if(!el)return;
  if(IS_FILE){el.innerHTML="";return;}     // no controller behind a local file — nothing to switch
  let chan='stable';
  try{const r=await fetch('/api/update-channel',{cache:'no-store'});if(r.ok)chan=(await r.json()).channel||'stable';}catch(e){}
  renderChannelRow(el,chan);
}
async function setUpdateChannel(beta){
  if(!can("updates")){toast("Your role does not include changing the update channel");return;}
  const el=document.getElementById("setchan");
  if(el)renderChannelRow(el,beta?'beta':'stable');      // flip instantly — don't wait on the network
  let ok=false;
  try{const r=await fetch('/api/update-channel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:beta?'beta':'stable'})});ok=r.ok;}catch(e){}
  if(ok){toast(beta?"Beta testing on — pre-release updates enabled":"Beta testing off — stable updates only");
    loadChannelRow();        // reconcile with the server (fast, local)
    loadSettingsUpdates();}   // refresh the available-version area for the new channel (may be slow)
  else{toast("Couldn't save the channel — check the appliance");loadChannelRow();}   // revert to server truth
}
let _skipVer=null;try{_skipVer=LS.getItem("airow_skipver");}catch(e){}
async function loadSettingsUpdates(){
  loadChannelRow();   // paint the channel toggle immediately, independent of the (slow) update check
  let st;if(IS_FILE)st={error:"Updates are handled by the Cortex controller. This copy was opened as a file on this computer."};
  else{try{const r=await fetch('/api/update/check',{cache:'no-store'});st=await r.json();}catch(e){st={error:"Couldn't reach the controller to check for updates."};}}

  const cur=st.current||"—";
  let h=`<div class="setrow"><div><div class="sl">This controller</div><div class="sd">Cortex <span class="mono">v${ue(cur)}</span>${st.name?" · "+ue(st.name):""}</div></div>`;
  if(st.checking)h+='<span class="badge-ok">…</span>';
  else if(st.updateAvailable&&st.latest!==_skipVer)h+='<span class="badge-new">v'+ue(st.latest)+" available</span>";
  else if(st.updateAvailable&&st.latest===_skipVer)h+='<span class="badge-ok">skipped</span>';
  else if(st.latest)h+='<span class="badge-ok">up to date</span>';
  else h+='<span class="badge-ok">—</span>';
  h+="</div>";
  if(st.updateAvailable){
    h+=`<div class="note-box" style="margin-top:10px"><b>v${ue(st.latest)}</b> is available. Updates verify themselves and roll back automatically if anything goes wrong.</div>${updNotes(st.notes)}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn primary" id="upd-now">⬇ Download &amp; install now</button>
        <button class="btn" id="upd-skip">${st.latest===_skipVer?"Un-skip":"Skip this version"}</button></div>`;
  } else if(st.configured===false){
    h+='<div class="note-box" style="margin-top:10px">Automatic updates aren\'t turned on for this controller yet.</div>';
  } else if(st.revertStable){
    h+=`<div class="note-box warn" style="margin-top:10px">Beta testing is off, but this controller is still running a <b>pre-release</b> build (<span class="mono">v${ue(cur)}</span>). The latest stable release is <b>v${ue(st.revertStable)}</b>.</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn primary" id="rev-stable">⬇ Go back to stable v${ue(st.revertStable)}</button>
        <button class="btn" id="rev-keep">Stay on this beta</button></div>
      <div class="sd" style="margin-top:7px">“Go back to stable” reinstalls v${ue(st.revertStable)} (a downgrade, verified with auto-rollback). “Stay on this beta” keeps this build — you won’t be notified about new betas, only about new <b>stable</b> releases.</div>`;
  } else if(st.error){
    h+='<div class="note-box" style="margin-top:10px">'+ue(st.error)+"</div>";
  } else {
    h+='<div class="note-box" style="margin-top:10px">You\'re on the latest version. This controller also checks and updates itself automatically.</div>';
  }
  el.innerHTML=h;
  const now=document.getElementById("upd-now");if(now)now.onclick=async()=>{now.disabled=true;now.textContent="Starting…";
    try{await fetch('/api/update/apply',{method:"POST"});}catch(e){}
    el.innerHTML='<div class="note-box">Update started — the controller will download, install, and restart. This page reloads by itself when the new version is running, and the controller rolls back on its own if the new version has a problem.</div>';updFollow("Updating Cortex");};
  const skip=document.getElementById("upd-skip");if(skip)skip.onclick=()=>{
    if(st.latest===_skipVer){try{LS.removeItem("airow_skipver");}catch(e){}_skipVer=null;}
    else{try{LS.setItem("airow_skipver",st.latest);}catch(e){}_skipVer=st.latest;}
    loadSettingsUpdates();};
  const revS=document.getElementById("rev-stable");if(revS)revS.onclick=async()=>{revS.disabled=true;revS.textContent="Starting…";
    try{await fetch('/api/update/revert',{method:"POST"});}catch(e){}
    el.innerHTML='<div class="note-box">Reverting to stable — the controller will download, install, and restart. This page reloads by itself when it is done, and the controller rolls back on its own if anything goes wrong.</div>';updFollow("Going back to the stable version");};
  const revK=document.getElementById("rev-keep");if(revK)revK.onclick=async()=>{revK.disabled=true;
    try{await fetch('/api/update/keep-beta',{method:"POST"});}catch(e){}
    toast("Staying on this beta — you’ll only be notified about new stable releases");loadSettingsUpdates();};
}

/* Create or edit a role: a name and a tick for each thing it may do. */
function editRole(id,copyOf){const src=id?roleOf(id):(copyOf?roleOf(copyOf):null),isNew=!id;
  const have=new Set(src?rolePerms(src.id):ROLE_DEFAULTS.customer),groups=[...new Set(PERMS.map(p=>p[3]))];
  modal(head(isNew?"New role":"Edit role")+`<div class="modal-body">
    <div class="field"><div class="lbl">Role name</div><input id="rname" class="inp" maxlength="30" value="${ue(isNew?(copyOf&&src?src.name+" copy":""):src.name)}" placeholder="e.g. Front desk, Maintenance, Property manager"></div>
    <div class="sd">Tick what people with this role may see and do. Anything not ticked is hidden from them or switched off.</div>
    ${groups.map(g=>`<div class="permgrp"><span>${g}</span><button class="linklike" data-pall="${g}">all</button><button class="linklike" data-pnone="${g}">none</button></div>
      ${PERMS.filter(p=>p[3]===g).map(p=>`<label class="perm"><input type="checkbox" data-perm="${p[0]}" data-grp="${g}" ${have.has(p[0])?"checked":""}><div><b>${p[1]}</b><span>${p[2]}</span></div></label>`).join("")}`).join("")}
    <div class="note-box" id="rwarn" style="margin-top:12px;font-size:12.5px;display:none"></div>
    <div class="err-text" id="rerr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" onclick="drawSettings()">Cancel</button><button class="btn primary" id="rsave">Save role</button></div></div>`,true);
  const boxes=()=>[...mroot.querySelectorAll("[data-perm]")],picked=()=>boxes().filter(b=>b.checked).map(b=>b.dataset.perm);
  const warn=()=>{const p=new Set(picked()),w=[];
      if(p.has("users"))w.push("People with this role can edit every role, including their own, so they can give themselves any permission.");
      if(p.has("busscan"))w.push("Bus scan can start and stop polling and send raw frames on the equipment bus. Give it to trained technicians only.");
      if(p.has("reset"))w.push("This role can erase the site’s setup.");
      if(!p.has("ctl"))w.push("Without “Control units”, people with this role can look but not change anything.");
      const el=document.getElementById("rwarn");el.style.display=w.length?"":"none";el.innerHTML=w.map(x=>"• "+x).join("<br>");};
  boxes().forEach(b=>b.onchange=warn);warn();
  mroot.querySelectorAll("[data-pall],[data-pnone]").forEach(b=>b.onclick=()=>{const g=b.dataset.pall||b.dataset.pnone,on=!!b.dataset.pall;boxes().filter(x=>x.dataset.grp===g).forEach(x=>{x.checked=on;});warn();});
  document.getElementById("rsave").onclick=()=>{const name=document.getElementById("rname").value.replace(/[<>]/g,"").trim(),bad=m=>{document.getElementById("rerr").textContent=m;};
    if(!name){bad("Give the role a name.");return;}
    if(/^(root|owner)$/i.test(name)){bad("“"+name+"” is reserved for the built-in root account. Pick another name.");return;}
    if(roles().some(r=>r.name.toLowerCase()===name.toLowerCase()&&r.id!==id)){bad("There is already a role with that name.");return;}
    const perms=picked();
    // never let someone remove their own way back in to this page
    if(id&&currentUser&&currentUser.role===id&&!perms.includes("users")){bad("This is your own role. Keep “Users and roles” ticked, or you would lock yourself out of this page.");return;}
    if(id){const r=roleOf(id);r.name=name;r.perms=perms;}
    else CFG.roles.push({id:"r_"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),name,perms});
    saveCfg(CFG);recomputeSession();renderWho();renderAll();drawSettings();toast(isNew?"Role “"+name+"” created":"Role “"+name+"” saved");};}

function inlineMd(s){return s.replace(/`([^`]+)`/g,'<code class="md-code">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function mdLite(md){
  const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const lines=esc(md).split('\n');let out=[],inCode=false,inList=false;
  for(const ln of lines){
    if(/^```/.test(ln)){out.push(inCode?'</pre>':'<pre class="md-pre">');inCode=!inCode;continue;}
    if(inCode){out.push(ln);continue;}
    let m;
    if((m=ln.match(/^(#{1,6})\s(.*)/))){if(inList){out.push('</ul>');inList=false;}const l=m[1].length;out.push(`<div class="md-h md-h${l}">${inlineMd(m[2])}</div>`);continue;}
    if(/^\s*[-*]\s/.test(ln)){if(!inList){out.push('<ul class="md-ul">');inList=true;}out.push(`<li>${inlineMd(ln.replace(/^\s*[-*]\s/,''))}</li>`);continue;}
    if(/^\s*\|/.test(ln)){out.push(`<div class="md-tr mono">${inlineMd(ln)}</div>`);continue;}
    if(/^(---+|===+)\s*$/.test(ln)){out.push('<hr class="md-hr">');continue;}
    if(inList){out.push('</ul>');inList=false;}
    out.push(ln.trim()===''?'<div class="md-sp"></div>':`<p class="md-p">${inlineMd(ln)}</p>`);
  }
  if(inCode)out.push('</pre>');if(inList)out.push('</ul>');
  return out.join('\n');
}

const KINDS={fcu:"Fan coil unit",wall:"Wall mount",cassette4:"4-way cassette",cassette1:"1-way cassette",ducted:"Ducted",floor:"Floor standing",ceiling:"Ceiling suspended"};
/* top-down airflow directions per indoor-unit type (N/E/S/W, viewed from the ceiling) */
const KIND_DIRS={wall:["S"],cassette4:["N","E","S","W"],cassette1:["S"],ducted:["S"],ceiling:["E","W"],floor:["N"]};
/* top-down body box [x,y,w,h] in the 96x96 viewBox */
const KIND_BOX={fcu:[19,24,58,20],wall:[16,11,64,15],cassette4:[27,27,42,42],cassette1:[21,30,54,30],ducted:[19,24,58,20],ceiling:[12,40,72,16],floor:[34,54,28,30]};
function modeColor(u){if(!u.on)return "var(--stopped,#8a94a6)";return ({heat:"#f5713b",cool:"#2f8ff5",dry:"#13b6c8",fan:"#9aa3b2"})[u.mode]||"#2fbf71";}
/* one animated airflow "puff" leaving a body edge in direction d */
function ugPuff(d,bx,by,bw,bh,off,reach,dur,begin,col){
  const cx=bx+bw/2,cy=by+bh/2;let x,y,w,h,tx=0,ty=0;
  if(d==="S"){x=cx+off;y=by+bh+2;w=11;h=3.4;ty=reach;}
  else if(d==="N"){x=cx+off;y=by-2;w=11;h=3.4;ty=-reach;}
  else if(d==="E"){x=bx+bw+2;y=cy+off;w=3.4;h=11;tx=reach;}
  else {x=bx-2;y=cy+off;w=3.4;h=11;tx=-reach;}
  const r=Math.min(w,h)/2;
  return `<g opacity="0"><rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="${r}" fill="${col}"/>`
    +`<animateTransform attributeName="transform" type="translate" values="0 0;${tx} ${ty}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>`
    +`<animate attributeName="opacity" values="0;.9;0" keyTimes="0;.25;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
}
/* top-down SVG of an indoor unit that animates its live state. lite = fewer streams (cards) */
function unitGraphic(u,cls,lite){
  const kind=u.kind==="fcu"?"ducted":(KINDS[u.kind]?u.kind:"wall");const on=!!u.on;const col=on?modeColor(u):"#8a94a6";
  const [bx,by,bw,bh]=KIND_BOX[kind];const cx=bx+bw/2,cy=by+bh/2;
  const dur=({low:2.4,med:1.5,high:.85})[u.fan]||1.5;
  const panel='fill="rgba(130,138,150,.16)" stroke="rgba(130,138,150,.55)" stroke-width="1.4"';
  const grille='fill="none" stroke="rgba(130,138,150,.5)" stroke-width="1.2"';
  const led=`<circle cx="C" cy="Y" r="R" fill="${col}" opacity="${on?.95:.6}"/>`;
  let body="";
  if(kind==="cassette4"){
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" ${panel}/>`
      +`<rect x="${bx+6}" y="${by+6}" width="${bw-12}" height="${bh-12}" rx="3" ${grille}/>`
      +`<line x1="${bx+9}" y1="${by+6}" x2="${bx+bw-9}" y2="${by+6}" ${grille}/>`
      +`<line x1="${bx+9}" y1="${by+bh-6}" x2="${bx+bw-9}" y2="${by+bh-6}" ${grille}/>`
      +`<line x1="${bx+6}" y1="${by+9}" x2="${bx+6}" y2="${by+bh-9}" ${grille}/>`
      +`<line x1="${bx+bw-6}" y1="${by+9}" x2="${bx+bw-6}" y2="${by+bh-9}" ${grille}/>`
      +led.replace("C",cx).replace("Y",cy).replace("R",5.6);
  }else if(kind==="floor"){
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" ${panel}/>`
      +`<rect x="${bx+5}" y="${by+6}" width="${bw-10}" height="6" rx="3" ${grille}/>`
      +led.replace("C",cx).replace("Y",by+bh-8).replace("R",3.4);
  }else if(kind==="ceiling"){
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="7" ${panel}/>`
      +`<line x1="${bx+9}" y1="${cy}" x2="${bx+bw-9}" y2="${cy}" ${grille}/>`
      +led.replace("C",cx).replace("Y",cy).replace("R",4.6);
  }else if(kind==="ducted"){
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" fill="rgba(130,138,150,.10)" stroke="rgba(130,138,150,.5)" stroke-width="1.3" stroke-dasharray="4 3"/>`
      +`<rect x="${cx-17}" y="${by+bh-8}" width="34" height="5.5" rx="2.5" ${grille}/>`
      +led.replace("C",bx+bw-7).replace("Y",by+7).replace("R",2.6);
  }else{ // wall / cassette1 — louvered bar
    body=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" ${panel}/>`;
    for(let i=1;i<=2;i++){const yy=by+bh*i/3;body+=`<line x1="${bx+6}" y1="${yy}" x2="${bx+bw-6}" y2="${yy}" ${grille}/>`;}
    body+=led.replace("C",bx+bw-7).replace("Y",by+7).replace("R",2.6);
  }
  let air="";
  if(on){const dirs=KIND_DIRS[kind];const spread=kind!=="cassette4";const reach=22;
    dirs.forEach(d=>{const lanes=(spread&&!lite)?[-13,0,13]:[0];
      lanes.forEach((off,li)=>{for(let p=0;p<3;p++){const begin=(p*dur/3+li*dur/6).toFixed(2);air+=ugPuff(d,bx,by,bw,bh,off,reach,dur,begin,col);}});});}
  const err=u.err?`<circle cx="86" cy="10" r="5.5" fill="#ff4d4f"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.51;1" dur=".9s" repeatCount="indefinite"/></circle>`:"";
  return `<svg class="ug ${cls||''}" viewBox="0 0 96 96" preserveAspectRatio="xMidYMid meet">${body}${air}${err}</svg>`;
}
function setKind(id,kind){const u=units.find(x=>x.id===id);if(!u)return;u.kind=kind;saveUnits();renderAll();if(openId===id)drawDrawer(u);}
/* ---- building map: floor plans ----

function trendChart(series,range){

  const S=series.map((s,i)=>({...s,color:s.color||TPAL[i%TPAL.length],P:s.pts.filter(p=>p.t>=t0)}));

  let mn=Math.floor(Math.min(...ys)-2),mx=Math.ceil(Math.max(...ys)+2);if(mn===mx){mn--;mx++;}
  const X=t=>pl+(t-t0)/range*(W-pl-pr),Y=v=>H-pb-(v-mn)*(H-ptp-pb)/(mx-mn);
  const grid=[mn,Math.round((mn+mx)/2),mx].map(v=>`<line x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${W-pr}" y2="${Y(v).toFixed(1)}" stroke="var(--border)"/><text x="6" y="${(Y(v)+4).toFixed(1)}" fill="var(--text-faint)" font-size="11">${v}</text>`).join("");

  const lines=S.map(s=>`<path d="${s.P.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`).join("");
  const legend=S.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin:0 14px 6px 0;font-size:12px"><span style="width:11px;height:11px;border-radius:3px;background:${s.color}"></span>${s.name}${s.err?' <span style="color:var(--err)">⚠ error</span>':''}</span>`).join("");

/* Trends come from the controller's own log (/api/history): one real reading per unit every 5 minutes

async function drawTrends(){const {ids,opts}=trendCtx;const us=units.filter(u=>ids.includes(u.id)).slice(0,10);if(!us.length){closeModal();return;}
  const title=(opts.odu?"Pipe-out temperature · ":"Trends · ")+(us.length>1?us.length+" units":ue(dispName(us[0])));

/* ===== Backup and restore =====
   A backup is one JSON file made of independent sections; any subset can be saved and any subset of
   what a file holds can be restored. Version 1 files (cfg + units + settings, everything in one lump)
   still restore: backupParts() reads both shapes. Restoring a section replaces just that section. */
const BK_SECTIONS=[
  ["site","Site details and limits","Name, location, system type, temperature limits, sign-out timer, weather location, customer permissions, occupant room links"],
  ["users","Logins, roles and access codes","Every login, the roles and their permissions, the admin and technician codes, and the recovery answer"],
  ["units","Units","The unit list with names, groups, types, tags, service notes and outdoor unit addresses"],
  ["schedules","Schedules","Every schedule and its exceptions"],
  ["floorplans","Floor plans","Building-map pictures and where each unit sits on them"],
  ["prefs","My display preferences","Theme, colour, layout and other choices for this login"]];
const BK_USERKEYS=["users","roles","adminPin","techPin","recovery"], BK_UNITKEYS=["unitMeta","oduAddrs","ignoreAddrs"], BK_SKIP=["_rev","provisioned","schedules","floorplans"];
function bkSiteOf(cfg){const o={};for(const k in (cfg||{})){if(!BK_USERKEYS.includes(k)&&!BK_UNITKEYS.includes(k)&&!BK_SKIP.includes(k))o[k]=cfg[k];}return o;}
function bkPick(cfg,keys){const o={};keys.forEach(k=>{if(cfg&&cfg[k]!==undefined)o[k]=cfg[k];});return o;}
function backupBuild(sel,cfg,unitList,prefs,images){
  const d={_cortex:"backup",v:2,ts:new Date().toISOString(),site:(cfg&&cfg.site&&cfg.site.name)||"",parts:{}};
  if(sel.site)d.parts.site=bkSiteOf(cfg);
  if(sel.users)d.parts.users=bkPick(cfg,BK_USERKEYS);
  if(sel.units)d.parts.units=Object.assign({list:unitList||[]},bkPick(cfg,BK_UNITKEYS));
  if(sel.schedules)d.parts.schedules={list:(cfg&&cfg.schedules)||[]};
  if(sel.floorplans)d.parts.floorplans={plans:(cfg&&cfg.floorplans)||{},images:images||{}};
  if(sel.prefs)d.parts.prefs=prefs||{};
  return d;}
/* Any backup file -> {parts, ts, site} or null. Tolerant: a section that is missing or the wrong shape is simply not offered. */
function backupParts(d){
  if(!d||typeof d!=="object")return null;
  let parts=null;
  if(d._cortex==="backup"&&d.parts&&typeof d.parts==="object")parts=Object.assign({},d.parts);
  else if(d.cfg&&typeof d.cfg==="object"){const c=d.cfg;parts={site:bkSiteOf(c),users:bkPick(c,BK_USERKEYS),schedules:{list:c.schedules||[]},floorplans:{plans:c.floorplans||{},images:{}}};
    if(Array.isArray(d.units))parts.units=Object.assign({list:d.units},bkPick(c,BK_UNITKEYS));
    if(d.settings&&typeof d.settings==="object")parts.prefs=d.settings;}
  if(!parts)return null;
  const ok={};
  if(parts.site&&typeof parts.site==="object"&&!Array.isArray(parts.site)&&Object.keys(parts.site).length)ok.site=parts.site;
  if(parts.users&&Array.isArray(parts.users.users)&&parts.users.users.some(u=>u&&u.username&&u.passhash))ok.users=parts.users;
  if(parts.units&&Array.isArray(parts.units.list))ok.units=parts.units;
  if(parts.schedules&&Array.isArray(parts.schedules.list))ok.schedules=parts.schedules;
  if(parts.floorplans&&parts.floorplans.plans&&typeof parts.floorplans.plans==="object"&&Object.keys(parts.floorplans.plans).length)ok.floorplans={plans:parts.floorplans.plans,images:(parts.floorplans.images&&typeof parts.floorplans.images==="object")?parts.floorplans.images:{}};
  if(parts.prefs&&typeof parts.prefs==="object"&&!Array.isArray(parts.prefs)&&Object.keys(parts.prefs).length)ok.prefs=parts.prefs;
  return Object.keys(ok).length?{parts:ok,ts:d.ts||"",site:d.site||(d.cfg&&d.cfg.site&&d.cfg.site.name)||(ok.site&&ok.site.site&&ok.site.site.name)||""}:null;}
/* Merge the chosen sections into a copy of the current config. Returns {cfg, units|null, prefs|null}. Pure. */
function backupApply(cur,parts,sel){
  const cfg=JSON.parse(JSON.stringify(cur||{}));let outUnits=null,outPrefs=null;
  if(sel.site&&parts.site){Object.keys(bkSiteOf(cfg)).forEach(k=>delete cfg[k]);Object.assign(cfg,JSON.parse(JSON.stringify(bkSiteOf(parts.site))));}
  if(sel.users&&parts.users){BK_USERKEYS.forEach(k=>{if(parts.users[k]!==undefined)cfg[k]=JSON.parse(JSON.stringify(parts.users[k]));});
    if(!cfg.users.some(u=>u.role==="owner")){cfg.users[0].role="owner";}}                 // never leave a site nobody can administer
  if(sel.units&&parts.units){outUnits=JSON.parse(JSON.stringify(parts.units.list));BK_UNITKEYS.forEach(k=>{if(parts.units[k]!==undefined)cfg[k]=JSON.parse(JSON.stringify(parts.units[k]));else delete cfg[k];});}
  if(sel.schedules&&parts.schedules)cfg.schedules=JSON.parse(JSON.stringify(parts.schedules.list));
  if(sel.floorplans&&parts.floorplans)cfg.floorplans=JSON.parse(JSON.stringify(parts.floorplans.plans));
  if(sel.prefs&&parts.prefs)outPrefs=JSON.parse(JSON.stringify(parts.prefs));
  if(!cfg.protocols)cfg.protocols=["lg"];
  cfg.provisioned=true;delete cfg._rev;
  return {cfg,units:outUnits,prefs:outPrefs};}
function bkChecks(avail,pre){return BK_SECTIONS.filter(x=>!avail||avail[x[0]]).map(x=>`<label class="bk-row"><input type="checkbox" data-bk="${x[0]}" ${(!pre||pre[x[0]])?"checked":""}><span><b>${x[1]}</b><small>${x[2]}</small></span></label>`).join("");}

async function bkPutImages(images){let n=0;if(IS_FILE)return n;

async function bootMain(){
  // Shared setup/accounts come from the appliance first, so a NEW browser or computer sees the
  // same state (login screen), not the first-run wizard. Falls back to local for the file:// demo.
  let server=null;
  if(!IS_FILE){
    // Served by the controller: wait for it. A network blip or a controller that is still starting
    // must never drop someone into the first-time setup wizard (where they could overwrite the site).
    for(let i=0;;i++){
      try{const r=await fetch('/api/appconfig',{cache:'no-store'});if(r.ok){server=await r.json();break;}}catch(e){}
      showThinking("Can’t reach the controller yet — trying again…");await sleep(Math.min(5000,1000+i*500));}
    showThinking("Loading your site…");
  }
  if(server&&server.provisioned){CFG=server;if(typeof CFG._rev!=="number")CFG._rev=0;if(!CFG.protocols)CFG.protocols=["lg"];cfgStore();}
  else if(server&&typeof server._rev==="number"){               // the controller was factory-reset: don't resurrect this browser's old copy
    CFG=null;try{LS.removeItem("airow_cfg");LS.removeItem("airow_session");}catch(e){}}
  else{CFG=loadCfg();
    // this browser is already set up but the appliance never was -> migrate it up once
    if(CFG&&CFG.provisioned&&server!==null){delete CFG._rev;cfgPush();}
  }
  if(CFG&&CFG.provisioned){try{await pullUnits();}catch(e){}}  // the shared unit list, before anything is drawn
  BOOTED=true;versionWatch();
  const su=sessionValid();                                     // persisted login, if still within the timeout
  if(!CFG||!CFG.provisioned){startWizard();return;}
  setTimeout(busAutoStart,400);                                // if this is the screen that was connected to the equipment, reconnect + resume
  if(su&&CFG.users&&CFG.users.some(u=>u.username===su.username)){enterApp(CFG.users.find(u=>u.username===su.username));return;}
  showLogin();}

// Real bus discovery during setup. Connects the adapter (the button click is the user gesture that
// Web Serial needs), runs the cmd0 sweep, and stashes results in MASTER.found. Units are actually
// created at provision() time (after CFG exists), so this can't touch the not-yet-provisioned app.
async function runScan(){
  WZ.scan={prog:0,cur:0,found:[],done:false,scanning:true,error:""};renderWizard();
  try{ if(!bus.port){await busConnect();if(APPL)await busTake(true);} }catch(e){}
  if(!bus.port){WZ.scan={prog:0,cur:0,found:[],done:false,scanning:false,
    error:"Couldn't open the adapter. Plug in your USB-RS485 adapter and try again — or skip this and scan later from Tech → Bus scan."};renderWizard();return;}
  const tick=setInterval(()=>{if(WZ.scan&&MASTER.scan){WZ.scan.cur=MASTER.scan.cur;WZ.scan.prog=MASTER.scan.done/MASTER.scan.total;
    WZ.scan.found=[...MASTER.found.entries()].map(([a,r])=>({addr:a,ch:"CH1",group:r&&r.parsed?r.parsed.group:0}));wzScanTick();}},300);
  let n=0;try{n=await masterDiscover();}catch(e){}
  clearInterval(tick);
  WZ.scan={prog:1,cur:0xFE,done:true,scanning:false,error:"",
    found:[...MASTER.found.entries()].map(([a,r])=>({addr:a,ch:"CH1",group:r&&r.parsed?r.parsed.group:0}))};
  renderWizard();
}
function wzScanStat(s){if(s.done)return "✓ Scan complete";
  const secs=Math.ceil((0xFE-s.cur)*(MASTER.turnaround+MASTER.timeout)/1000);return "Checking address "+hx(s.cur)+" · about "+fmtEta(secs)+" left";}
function wzScanFound(s){return s.found.map(f=>`<div>✓ ${hx(f.addr)} · system #${ue(f.group)}</div>`).join("")||'<div style="color:var(--text-faint)">listening…</div>';}
// While the scan runs only the numbers change — updating them in place keeps the loader animation smooth
// (a full re-render every 300 ms would restart it each time).
function wzScanTick(){const s=WZ&&WZ.scan,bar=document.getElementById("wz-bar");
  if(!s||!bar){renderWizard();return;}
  bar.style.width=Math.round(s.prog*100)+"%";
  const st=document.getElementById("wz-stat");if(st)st.textContent=wzScanStat(s);
  const ct=document.getElementById("wz-cnt");if(ct)ct.textContent=s.found.length+" found";
  const fl=document.getElementById("wz-found");if(fl)fl.innerHTML=wzScanFound(s);}
function renderWizard(){const s=WSTEPS[WZi];
  document.getElementById("screen-setup").innerHTML=`<div class="auth"><div class="auth-card wiz">
    <div class="auth-head"><div class="auth-logo"><span class="logo">${LOGO}</span>Cortex · Setup</div></div>
    <div class="wiz-steps">${WSTEPS.map((_,i)=>`<div class="wiz-dot ${i<WZi?'done':''} ${i===WZi?'cur':''}"></div>`).join("")}</div>
    <div class="auth-body"><div class="step-num">Step ${WZi+1} of ${WSTEPS.length}</div>
      <h2>${s.title}</h2>${s.sub?`<div class="auth-sub">${s.sub}</div>`:""}
      <div id="wzerr" class="err-text"></div>${s.body()}
      ${WZi===0&&!DEMO?`<div style="margin-top:16px;font-size:12.5px;color:var(--text-dim)">Just looking? <button class="linklike" onclick="demoEnter()">Open the demo building</button> — a pretend site, nothing is set up or sent.</div>`:""}</div>
    <div class="wiz-foot"><button class="btn" id="wback" ${WZi===0?'style="visibility:hidden"':''}>Back</button>
      <button class="btn primary" id="wnext">${WZi===WSTEPS.length-1?'Finish setup':'Continue'}</button></div>
  </div></div>`;
  if(s.wire)s.wire();
  document.getElementById("wback").onclick=()=>{if(WZi>0){WZi--;renderWizard();}};
  document.getElementById("wnext").onclick=()=>{const err=s.save?s.save():null;
    if(err){document.getElementById("wzerr").textContent=err;return;}
    if(WZi===WSTEPS.length-1)provision();else{WZi++;renderWizard();}};}
function provision(){
  const rc="CORTEX-"+(WZ.site.name||"SITE").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)+"-"+Math.random().toString(16).slice(2,6).toUpperCase()+"-"+Math.random().toString(16).slice(2,6).toUpperCase();
  const old=(CFG&&CFG.provisioned)?CFG:null;                      // re-running setup on a working site
  const scanned=!!(WZ.scan&&WZ.scan.done);                        // did THIS run of the wizard scan the bus?
  CFG={provisioned:true,site:{name:WZ.site.name,location:WZ.site.location,unit:WZ.site.unit},
    protocols:(WZ.protocols&&WZ.protocols.length?WZ.protocols:["lg"]),
    adminPin:WZ.adminPin,techPin:WZ.techPin,recovery:rc,remote:WZ.remote,unitMeta:{},
    ...(CFG&&Array.isArray(CFG.roles)?{roles:CFG.roles}:{}),          // re-running setup keeps the roles the site has made
    schedules:[],                                              // start empty — users build their own
    users:[{id:1,name:WZ.owner.name,username:WZ.owner.username,passhash:hash(WZ.owner.pass),role:"owner",protected:true},
      ...WZ.team.map((t,i)=>({id:2+i,name:t.name,username:t.username,passhash:hash(t.pass),role:t.role}))]};
  settings.unit=WZ.site.unit;CFG.gen=WZ.gen||"4";CFG.baud=(WZ.gen==="5")?9600:4800;
  // Re-running setup replaces the site details, logins and access codes — it must NOT throw away the
  // work that is already there: unit names/tags, schedules, floor plans, limits, the weather location.
  if(old){["unitMeta","schedules","floorplans","spMinF","spMaxF","sessionTimeoutMin","wxOverride","custCtl","custAll","ignoreAddrs"].forEach(k=>{if(old[k]!==undefined)CFG[k]=old[k];});
    if(old.site){["lat","lon"].forEach(k=>{if(old.site[k]!=null)CFG.site[k]=old.site[k];});}}
  WZ=null;
  saveSettings();saveCfg(CFG);
  // keep the appliance's own site name (used by /health and the fleet console) in step with this one
  if(!IS_FILE){try{fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:CFG.site.name})}).catch(()=>{});}catch(e){}}
  enterApp(CFG.users[0]);
  if(scanned&&MASTER.found&&MASTER.found.size){masterImport(); // add units found by the wizard's bus scan…
    if(bus.port&&!MASTER.running)masterLoopRun();}             // …and go live straight away (the scan step already had the LG central disconnected)
  else pullUnits();
}

boot();
</script>
