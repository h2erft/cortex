<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f0f1f4;--border:#e3e5ea;--shadow-lg:0 12px 40px rgba(16,24,40,.14);
  --text:#1a1f29;--text-dim:#5b6472;--text-faint:#9aa2b1;
  --accent:#0e7c66;--accent-ink:#0b5f4e;--accent-soft:#d9efe9;
  --ok:#2e9e5b;--ok-soft:#e4f4ec;--warn:#c98a12;--warn-soft:#fbf0d8;--err:#d93b3b;--err-soft:#fbe6e6;
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e1116;--surface:#161b23;--surface-2:#1d232d;--border:#2a323e;--shadow-lg:0 14px 44px rgba(0,0,0,.5);
  --text:#e9edf3;--text-dim:#9aa6b5;--text-faint:#687283;
  --accent:#2fb79a;--accent-ink:#8fe6d4;--accent-soft:#143029;
  --ok:#43c072;--ok-soft:#142a20;--warn:#e0ad4e;--warn-soft:#2e2514;--err:#f26a6a;--err-soft:#2f1819;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.brand small{font-weight:500;color:var(--text-faint);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.top .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--border);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
.rolebadge{font-size:10.5px;background:var(--accent-soft);color:var(--accent-ink);padding:2px 7px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--text-dim);margin-top:2px}
.kpi .n small{font-size:13px;color:var(--text-faint);font-weight:500}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:26px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:4px}
.tab{background:none;border:none;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-dim)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--border)}
/* site grid */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.site{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.site .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.site .nm{font-weight:650;font-size:15px}
.site .lo{font-size:12px;color:var(--text-faint);margin-top:1px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-2);color:var(--text-faint)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft,#fbf0d5);color:var(--warn,#b7791f)}
.pdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.stat-row{display:flex;gap:16px;font-size:12.5px;color:var(--text-dim)}
.stat-row b{color:var(--text);font-weight:650}
.site .foot{display:flex;gap:8px;margin-top:2px}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.grow{flex:1}
/* techs */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.trow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--border)}
.trow:first-child{border-top:none}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:14px}
.tsub{font-size:12px;color:var(--text-faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--text-dim)}
.chip.temp{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.temp b{font-variant-numeric:tabular-nums}
/* audit */
.audit{font-size:12.5px}
.arow{display:flex;gap:10px;padding:9px 16px;border-top:1px solid var(--border);color:var(--text-dim)}
.arow:first-child{border-top:none}
.arow .t{color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.arow .m{color:var(--text)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.scrim.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:440px;max-width:100%;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.mh h3{margin:0;font-size:16px}
.mb{padding:18px}
.flabel{display:block;font-size:12px;color:var(--text-dim);margin:12px 0 5px;font-weight:500}
.flabel:first-child{margin-top:0}
.inp{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:14px;font-family:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:9px;font-size:13px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--text-dim);line-height:1.5}
/* login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);width:380px;max-width:100%;padding:26px}
.login-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.login-logo .dot{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:20px}
.err-text{color:var(--err);font-size:12.5px;min-height:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{max-height:calc(100dvh - 32px);display:flex;flex-direction:column}.modal .mb{overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.cx-brain{display:block;overflow:visible;flex:none}
.cx-brain .bh{fill:currentColor;fill-opacity:.13;stroke:currentColor;stroke-linejoin:round;stroke-linecap:round}
.cx-brain .bt{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.cx-brain .bn{fill:currentColor}
.cx-brain .bl{fill:none;stroke:currentColor;stroke-opacity:.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 3.4}
.cx-brain .bp{fill:currentColor;opacity:0}
.cx-brain .bhalo{fill:none;stroke:currentColor;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .cx-brain.calm .bn{animation:cxtw 5s ease-in-out infinite}
  .cx-brain.live .bcore{transform-box:fill-box;transform-origin:center;animation:cxpulse 2.4s ease-in-out infinite}
  .cx-brain.live .bh{animation:cxfill 2.4s ease-in-out infinite}
  .cx-brain.live .bhalo{transform-box:fill-box;transform-origin:center;animation:cxhalo 2.4s ease-out infinite}
  .cx-brain.live .bn{animation:cxtw 1.6s ease-in-out infinite}
  @supports (offset-path:path("M0 0")){
    .cx-brain.live .bp{animation:cxin 2.2s linear infinite}
    .cx-brain.live .bp.out{animation-name:cxout}
  }
}
@keyframes cxtw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes cxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes cxfill{0%,100%{fill-opacity:.1}50%{fill-opacity:.26}}
@keyframes cxhalo{0%{transform:scale(.8);opacity:.45}100%{transform:scale(1.32);opacity:0}}
@keyframes cxin{0%{offset-distance:0%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes cxout{0%{offset-distance:100%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:0%;opacity:0}}
.no-motion .cx-brain *{animation:none!important}.no-motion .sbeat{animation:none!important}
.brand .blogo{display:inline-flex;color:var(--accent);margin-right:8px;vertical-align:middle}.brand{display:flex;align-items:center}
.bload{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;color:var(--accent);font-size:13px}.bload div{color:var(--text-dim)}
.site{overflow:hidden}.sart{display:block;width:100%;height:74px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.sart .bld rect{fill:var(--border)}.sart .w-off{fill:var(--surface);opacity:.55}.sart .w-on{fill:var(--accent)}.sart .sline{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.9;vector-effect:non-scaling-stroke}
.sart.err .w-on{fill:var(--warn)}.sart.err .sline{stroke:var(--err)}.sart.off .bld rect,.sart.none .bld rect{opacity:.5}.sart .sbeat{fill:var(--ok)}.sart.err .sbeat{fill:var(--err)}
@media (prefers-reduced-motion:no-preference){.sart .sbeat{animation:sbeat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}@keyframes sbeat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.modal .sart{border:1px solid var(--border);border-radius:12px;height:90px}
.smet{display:flex;gap:14px;align-items:center}.smg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;flex:1}.sm{display:flex;flex-direction:column;line-height:1.2}.sm b{font-size:16px;font-weight:650}.sm span{font-size:11.5px;color:var(--text-faint)}
.rg-n{font-size:17px;font-weight:650;fill:var(--text);font-family:inherit}.rg-l{font-size:9.5px;fill:var(--text-faint);font-family:inherit}
.pill.info{background:var(--surface-2);color:var(--text-dim)}
.lchart{display:block;width:100%;height:auto}.lchart .ax{stroke:var(--border);stroke-width:1}.lchart .axl{font-size:10px;fill:var(--text-faint);font-family:inherit}
.tcard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:10px}.tcard .tl{font-size:12.5px;font-weight:600;margin-bottom:6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:10px}.drow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--border);padding:4px 0}.drow span{color:var(--text-dim)}
.setpage{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.setnav button{text-align:left;border:0;background:none;color:var(--text-dim);padding:9px 12px;border-radius:10px;font-size:13.5px;cursor:pointer}.setnav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.setbody{padding:18px 20px}.srow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}.srow:first-of-type{border-top:0}.srow .tname{font-size:13.5px;font-weight:550}.sctl{flex:none;max-width:60%}.sctl .seg{margin:0;flex-wrap:wrap}
.swt{width:44px;height:26px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);position:relative;cursor:pointer;padding:0;transition:background .15s}.swt i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}.swt.on{background:var(--accent);border-color:var(--accent)}.swt.on i{transform:translateX(18px)}
.brief-h{display:flex;gap:16px;align-items:center}.brief-t{font-size:22px;font-weight:650;letter-spacing:-.01em}.brief-sum{margin:16px 0 4px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.modal.wide{width:min(760px,calc(100vw - 32px));max-width:none}
.site .foot{flex-wrap:wrap}.site .foot .grow{flex:1 1 100%}.site .foot .btn:not(.grow){flex:1}
.bgroup{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--surface)}.bg-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}.bg-r{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border)}.bg-r .tname{font-size:13.5px;font-weight:550}
.bdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--text-faint)}.bdot.err{background:var(--err)}.bdot.warn{background:var(--warn)}.bdot.ok{background:var(--ok)}.bdot.off{background:var(--text-faint)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px 14px;font-size:13.5px;max-width:calc(100vw - 24px)}
.login-logo{display:flex;align-items:center;gap:10px}
/* ---- phone ---- keep this block last so it wins over the component rules above */
@media(max-width:640px){
  html,body{overflow-x:hidden}
  .top{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-top:max(8px,env(safe-area-inset-top));gap:6px}
  .brand{font-size:14px;white-space:nowrap}.brand small{display:none}
  .whoami #who{display:none}
  .icon-btn{width:40px;height:40px;flex:none}
  .wrap{padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
  .kpis{gap:8px;margin-bottom:14px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin:0 -12px 6px;padding:0 12px}.tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex:none;padding:10px 14px}
  .sites{grid-template-columns:1fr}
  .setpage{grid-template-columns:1fr}.setnav{flex-direction:row;overflow-x:auto;position:static;scrollbar-width:none}.setnav button{white-space:nowrap}.srow{flex-wrap:wrap}.sctl{max-width:100%}.dgrid{grid-template-columns:1fr}.brief-t{font-size:19px}
  .trow{flex-wrap:wrap;padding:12px}
  .btn{min-height:40px}
  input,select,textarea{font-size:16px!important}                 /* stops iOS zooming the page when a field is tapped */
  .scrim{padding:0;align-items:flex-end}
  .modal{width:100%;border-radius:18px 18px 0 0;max-height:92dvh;border-bottom:none;padding-bottom:env(safe-area-inset-bottom)}
  .toast{left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateY(20px);border-radius:14px;text-align:center}
  .toast.show{transform:translateY(0)}
}
</style>
</head>
<body>

<!-- login -->
<div class="login" id="login">
  <div class="login-card" id="login-card"><!-- filled by JS: setup wizard, sign-in, or recovery --></div>
</div>

<!-- app -->
<div id="app" class="hide">
  <div class="top">
    <div class="brand" id="brand"></div>
    <div class="sp"></div>
    <div class="whoami"><span id="who">Owner</span><span class="rolebadge">owner</span></div>
    <button class="icon-btn" id="brief" title="Today's briefing">☀</button>
    <button class="icon-btn" id="settings" title="Settings">⚙</button>
    <button class="icon-btn" id="logout" title="Sign out">⏻</button>
  </div>
  <div class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="tabs">
      <button class="tab on" data-tab="sites">Buildings</button>
      <button class="tab" data-tab="alerts">Alerts</button>
      <button class="tab" data-tab="techs">Technicians &amp; access</button>
      <button class="tab" data-tab="audit">Audit log</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>
    <div id="tab-sites"></div>
    <div id="tab-alerts" class="hide"></div>
    <div id="tab-techs" class="hide"></div>
    <div id="tab-audit" class="hide"></div>
    <div id="tab-settings" class="hide"></div>
  </div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
/* ---------- state ---------- */
const OWNER={user:"",name:"Owner"};  // populated from the stored account at sign-in
/* local owner account (this console is a single file; account lives in this browser) */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16);}
function loadAcct(){try{return JSON.parse(localStorage.getItem("cortex_cmd_acct"))||null;}catch(e){return null;}}
function saveAcct(a){try{localStorage.setItem("cortex_cmd_acct",JSON.stringify(a));}catch(e){}}
function genRecovery(name){const base=(name||"CMD").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||"CMD";const g=()=>Math.random().toString(16).slice(2,6).toUpperCase();return "CORTEX-"+base+"-"+g()+"-"+g();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let DB=load()||seed();
/* per-user preferences (scoped to the signed-in owner account) */
const PREF_DEFAULTS={theme:"auto",layout:"grid",density:"comfortable",showOffline:true,clock24:false,autorefresh:true,confirmOpen:false,compactNums:false,soundAlerts:false,landing:"sites",idleMin:15,accent:"slate",textSize:"normal",showHealth:true,popAlerts:true,cardArt:true,motion:true,briefing:true,briefHour:4,winNotify:true};
let PREFS=loadPrefs();
function prefsKey(){return "cortex_cmd_prefs_"+OWNER.user;}
function loadPrefs(){try{return Object.assign({},PREF_DEFAULTS,JSON.parse(localStorage.getItem(prefsKey())||localStorage.getItem("cortex_cmd_prefs_owner"))||{});}catch(e){return Object.assign({},PREF_DEFAULTS);}}
function savePrefs(){try{localStorage.setItem(prefsKey(),JSON.stringify(PREFS));}catch(e){}}
function applyTheme(){if(PREFS.theme==="auto"){if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");}else document.documentElement.setAttribute("data-theme",PREFS.theme);
  const dark=document.documentElement.getAttribute("data-theme")==="dark",a=CMD_ACCENTS[PREFS.accent]||CMD_ACCENTS.slate,v=dark?a.d:a.l,r=document.documentElement.style;r.setProperty("--accent",v[0]);r.setProperty("--accent-ink",v[1]);r.setProperty("--accent-soft",v[2]);
  if(document.body)document.body.style.zoom=PREFS.textSize==="large"?"1.12":"";}
const CMD_ACCENTS={slate:{n:"Slate",l:["#0e7c66","#0b5f4e","#d9efe9"],d:["#2fb79a","#8fe6d4","#143029"]},arctic:{n:"Arctic",l:["#1f74c4","#15568f","#e2eefb"],d:["#5aa6e8","#bcd8f5","#13263a"]},ember:{n:"Ember",l:["#d2652a","#9a4718","#faeadf"],d:["#e8955a","#f4c7a6","#33251a"]},violet:{n:"Violet",l:["#6b4fd0","#4c359c","#ebe6fb"],d:["#9d86ee","#d3c8fa","#231c3d"]}};
function seed(){
  // Real deployments start empty — add each building by its Cortex appliance address.
  return {sites:[],techs:[],grants:[],audit:[{t:Date.now(),m:"Fleet console provisioned"}]};
}
/* normalize a building's appliance address into a reachable base URL */
function siteUrl(s){let u=(s&&(s.addr||s.url)||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="http://"+u;return u.replace(/\/+$/,"");}
/* poll each building's Cortex appliance /health to set online + version live */
let healthTimer=null;
async function getJ(url,ms){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||4000);try{const r=await fetch(url,{signal:ctl.signal,cache:"no-store"});return await r.json();}finally{clearTimeout(to);}}
const LIVE={};                       // site id -> what its controller reports right now (never saved)
async function pollSite(s){const base=siteUrl(s);if(!base){s.online=false;return;}
  try{const j=await getJ(base+"/health",3000);s.online=!!j.ok;if(j.version)s.ver=j.version;}catch(e){s.online=false;}
  if(!s.online){delete LIVE[s.id];return;}
  const L=LIVE[s.id]||(LIVE[s.id]={});
  try{const u=(await getJ(base+"/api/units")).units||[];L.units=u.length;L.on=u.filter(x=>x.on&&!x.offline).length;L.offline=u.filter(x=>x.offline).length;
    L.errs=u.filter(x=>x.err||x.code).map(x=>({name:x.name||("0x"+Number(x.addr).toString(16).toUpperCase()),code:x.code||("CH"+x.err)}));s.units=L.units;s.err=L.errs.length;
    L.cool=u.filter(x=>x.on&&!x.offline&&x.mode==="cool").length;L.heat=u.filter(x=>x.on&&!x.offline&&x.mode==="heat").length;const rs=u.filter(x=>!x.offline&&typeof x.room==="number").map(x=>x.room);L.avgRoom=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;
    L.filters=u.filter(x=>x.filterSign).length;L.locked=u.filter(x=>x.hardLock||x.tempLock||x.modeLock||x.fanLock).length;}catch(e){}
  if(!L.oduAt||Date.now()-L.oduAt>300000){try{const o=await getJ(base+"/api/odu");L.odus=Object.keys(o.odu||{}).length;L.oduAt=Date.now();}catch(e){}}
  try{L.events=(await getJ(base+"/api/events")).events||[];}catch(e){L.events=L.events||null;}
  try{const d=await getJ(base+"/api/diag");L.adv=(d.advisories||[]).filter(a=>!a.cleared);const hs=Object.values(d.health||{}).filter(h=>Date.now()-h.at<600000).map(h=>h.score);L.health=hs.length?Math.min(...hs):null;L.healthAll=Object.entries(d.health||{}).filter(([a,h])=>h&&Date.now()-h.at<600000).map(([a,h])=>({addr:"0x"+(+a).toString(16).toUpperCase(),score:h.score}));}catch(e){L.adv=L.adv||null;L.health=null;}
  L.at=Date.now();s.seen=L.at;}
function siteSig(s){const L=LIVE[s.id]||{};return [s.online,s.err||0,(L.adv||[]).length,L.offline||0].join("|");}
function fleetNotice(before){const msgs=[];DB.sites.forEach((s,i)=>{const b=before[i].split("|"),a=siteSig(s).split("|");
    if(b[0]==="true"&&a[0]==="false")msgs.push(s.name+" went offline");else if(+a[1]>+b[1])msgs.push(s.name+": "+(+a[1])+" unit"+(+a[1]>1?"s":"")+" in error");else if(+a[2]>+b[2])msgs.push(s.name+": new diagnosis advisory");else if(+a[3]>+b[3])msgs.push(s.name+": a unit stopped answering");});
  if(!msgs.length||!fleetPrimed)return;
  if(APP&&PREFS.winNotify!==false&&(document.hidden||!document.hasFocus())){try{APP.notify(msgs.length>1?msgs.length+" building alerts":"Cortex Command",msgs.slice(0,3).join("\n")+(msgs.length>3?"\n+"+(msgs.length-3)+" more":""));}catch(e){}}
  if(!sessionStorage.getItem("cortex_cmd_in"))return;
  if(PREFS.popAlerts!==false)toast(msgs[0]+(msgs.length>1?" (+"+(msgs.length-1)+" more)":""));
  if(PREFS.soundAlerts){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18);}catch(e){}}
  if(document.hidden){document.title="("+msgs.length+") Cortex Command · AIROW";}
  msgs.forEach(m=>log("Alert: "+m));}
let fleetPrimed=false;document.addEventListener("visibilitychange",()=>{if(!document.hidden)document.title="Cortex Command · AIROW";});
let pollBusyAt=0;
function brandMark(busy){const b=$("brand");if(!b)return;const want=busy?"live":"calm";if(b.dataset.m===want)return;b.dataset.m=want;b.innerHTML=`<span class="blogo">${brainMark(busy?30:28,want)}</span>Cortex Command <small>Fleet</small>`;}
async function pollAllSites(){if(!DB.sites.length){if(briefWait){briefWait=false;}return;}const before=DB.sites.map(siteSig);
  pollBusyAt=Date.now();brandMark(true);
  await Promise.all(DB.sites.map(pollSite));
  setTimeout(()=>brandMark(false),Math.max(0,1400-(Date.now()-pollBusyAt)));histNote();
  if(briefWait&&sessionStorage.getItem("cortex_cmd_in")){briefWait=false;setTimeout(()=>briefing(false),300);}
  const changed=DB.sites.some((s,i)=>siteSig(s)!==before[i]);fleetNotice(before);fleetPrimed=true;
  if(changed)save();if(!$("scrim").classList.contains("show")){if(tab==="sites"&&document.activeElement!==$("site-search"))renderSites();renderKpis();if(tab==="alerts")renderAlerts();if(changed)renderAudit();}}
function startHealthPolling(){if(healthTimer)clearInterval(healthTimer);pollAllSites();healthTimer=setInterval(()=>{if(PREFS.autorefresh!==false)pollAllSites();},20000);}
function load(){try{return JSON.parse(localStorage.getItem("cortex_command"));}catch(e){return null;}}
function save(){try{localStorage.setItem("cortex_command",JSON.stringify(DB));}catch(e){}if(typeof fleetSync==="function")fleetSync();}
function log(m){DB.audit.unshift({t:Date.now(),m});DB.audit=DB.audit.slice(0,60);save();}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function siteName(id){const s=DB.sites.find(x=>x.id===id);return s?s.name:id;}
function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}
function activeGrants(){const now=Date.now();return DB.grants.filter(g=>g.until>now);}
function techAccess(tid){const t=DB.techs.find(x=>x.id===tid);const perm=t?t.assigned.slice():[];
  const temp=activeGrants().filter(g=>g.tech===tid).map(g=>g.site);return {perm,temp};}

/* ---------- toast ---------- */
let tT;function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}
  t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2400);}

/* ---------- render ---------- */
let tab="sites";
if(!PREFS.siteOrder||PREFS.siteOrder.length!==DB.sites.length)PREFS.siteOrder=DB.sites.map(s=>s.id);
let siteQuery="", siteSort=PREFS.siteSort||"custom", dragId=null;
function orderedSites(){
  let list=DB.sites.slice();
  if(siteSort==="alpha")list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(siteSort==="status")list.sort((a,b)=>(b.err-a.err)||((a.online?1:0)-(b.online?1:0)));
  else{if(!PREFS.siteOrder||PREFS.siteOrder.length!==DB.sites.length)PREFS.siteOrder=DB.sites.map(x=>x.id);list.sort((a,b)=>PREFS.siteOrder.indexOf(a.id)-PREFS.siteOrder.indexOf(b.id));}
  if(siteQuery)list=list.filter(s=>(s.name+" "+(s.loc||"")+" "+(s.addr||"")).toLowerCase().includes(siteQuery.toLowerCase()));
  return list;}
/* deterministic 30-day error history per site (sample) */
function siteErrHist(s){const h=new Array(30).fill(0),ev=(LIVE[s.id]||{}).events;if(!ev)return null;const now=Date.now();
  ev.forEach(e=>{if(e.kind==="silent")return;const d=Math.floor((now-e.at)/86400000);if(d>=0&&d<30)h[29-d]++;});return h;}
function siteLive(s){const L=LIVE[s.id];if(!s.online||!L||L.units==null)return "";
  const hp=PREFS.showHealth!==false&&L.health!=null?`<span class="pill ${L.health>=85?'ok':L.health>=65?'warn':'err'}" title="Lowest system health score at this building, from its controller">health ${L.health}</span>`:"";
  return `<div class="stat-row" style="gap:8px;flex-wrap:wrap"><div><b>${L.on}</b> of ${L.units} on</div>${L.errs&&L.errs.length?`<div style="color:var(--err)"><b>${L.errs.length}</b> in error</div>`:""}${L.offline?`<div style="color:var(--warn)"><b>${L.offline}</b> silent</div>`:""}${L.adv&&L.adv.length?`<div style="color:var(--warn)"><b>${L.adv.length}</b> advisor${L.adv.length>1?"ies":"y"}</div>`:""}${hp}</div>`;}
function render(){renderKpis();renderSites();renderAlerts();renderTechs();renderAudit();}
function renderKpis(){
  const online=DB.sites.filter(s=>s.online).length;
  const units=DB.sites.reduce((a,s)=>a+(s.units||0),0);
  const errs=DB.sites.reduce((a,s)=>a+(s.err||0),0);
  $("kpis").innerHTML=`
    <div class="kpi"><div class="n">${DB.sites.length} <small>· ${online} online</small></div><div class="l">Buildings</div></div>
    <div class="kpi"><div class="n">${units}</div><div class="l">Indoor units managed</div></div>
    <div class="kpi"><div class="n" style="color:${errs?'var(--err)':'inherit'}">${errs}</div><div class="l">Units in error</div></div>
    <div class="kpi"><div class="n">${DB.techs.length} <small>· ${activeGrants().length} temp</small></div><div class="l">Technicians</div></div>`;
}
function sitePill(s){return !siteUrl(s)?`<span class="pill off"><span class="pdot"></span>No address</span>`
  :!s.online?`<span class="pill off"><span class="pdot"></span>Offline</span>`
  :s.err?`<span class="pill err"><span class="pdot"></span>${s.err} error${s.err>1?'s':''}</span>`
  :`<span class="pill ok"><span class="pdot"></span>Online</span>`;}
function sitesToolbar(){return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
  <input class="inp" id="site-search" placeholder="Search buildings…" value="${siteQuery}" style="flex:1;min-width:160px">
  <select class="inp" id="site-sort" style="width:auto"><option value="custom" ${siteSort==="custom"?"selected":""}>Custom order</option><option value="alpha" ${siteSort==="alpha"?"selected":""}>A–Z</option><option value="status" ${siteSort==="status"?"selected":""}>Problems first</option></select>
  <button class="btn primary" id="add-building">+ Add building</button>
  </div>${siteSort==="custom"&&!siteQuery&&PREFS.layout!=="list"&&DB.sites.length>1?'<div style="font-size:11.5px;color:var(--text-faint);margin:-8px 0 12px">Drag cards to reorder.</div>':''}`;}
function siteAddr(s){const u=siteUrl(s);return u?`<span class="mono" style="font-size:11.5px;color:var(--text-faint)">${u.replace(/^https?:\/\//,'')}</span>`:'<span style="font-size:11.5px;color:var(--warn)">no address set</span>';}
function renderSites(){
  const list=orderedSites();const canDrag=siteSort==="custom"&&!siteQuery&&PREFS.layout!=="list";
  let inner;
  if(PREFS.layout==="list"){
    inner=`<div class="panel">`+list.map(s=>`<div class="trow">
      <div class="tinfo"><div class="tname">${s.name} ${sitePill(s)}</div><div class="tsub">${s.loc?s.loc+' · ':''}${siteAddr(s)}${s.ver?' · v'+s.ver:''}</div></div>
      <button class="btn sm" data-detail="${s.id}">Details</button>
      <button class="btn sm" data-edit="${s.id}">Edit</button>
      <button class="btn sm" data-assign="${s.id}">Assign</button>
      <button class="btn primary sm" data-open="${s.id}">Open ↗</button></div>`).join("")+`</div>`;
  }else{
    const pad=PREFS.density==="compact"?"12px":"16px";
inner=`<div class="sites">`+list.map(s=>siteCard(s,canDrag,pad)).join("")+`</div>`;
  }
  $("tab-sites").innerHTML=sitesToolbar()+(list.length?inner:`<div class="note">No buildings yet. Click <b>+ Add building</b> and enter the address of a Cortex appliance — its Tailscale name or IP with the port, like <span class="mono">cortex-site:8080</span> or <span class="mono">100.84.2.17:8080</span>.</div>`);
  $("site-search").oninput=e=>{siteQuery=e.target.value;renderSites();$("site-search").focus();};
  $("site-sort").onchange=e=>{siteSort=e.target.value;PREFS.siteSort=siteSort;savePrefs();renderSites();};
  const ab=$("add-building");if(ab)ab.onclick=()=>buildingModal(null);
  document.querySelectorAll("#tab-sites [data-open]").forEach(b=>b.onclick=()=>openSite(DB.sites.find(x=>x.id===b.dataset.open)));
  document.querySelectorAll("#tab-sites [data-detail]").forEach(b=>b.onclick=()=>siteDetail(b.dataset.detail));
  document.querySelectorAll("#tab-sites [data-edit]").forEach(b=>b.onclick=()=>buildingModal(b.dataset.edit));
  document.querySelectorAll("#tab-sites [data-assign]").forEach(b=>b.onclick=()=>grantModal(b.dataset.assign));
  if(canDrag)document.querySelectorAll("#tab-sites [data-drag]").forEach(el=>{
    el.ondragstart=()=>{dragId=el.dataset.drag;el.style.opacity=".4";};
    el.ondragend=()=>{el.style.opacity="1";};
    el.ondragover=e=>{e.preventDefault();};
    el.ondrop=e=>{e.preventDefault();const over=el.dataset.drag;if(!dragId||dragId===over)return;
      const o=PREFS.siteOrder.slice();const from=o.indexOf(dragId),to=o.indexOf(over);o.splice(from,1);o.splice(to,0,dragId);
      PREFS.siteOrder=o;savePrefs();renderSites();};
  });
}
function renderAlerts(){
  const when=t=>fmtTime(t),items=[];
  DB.sites.forEach(s=>{const L=LIVE[s.id]||{};
    if(siteUrl(s)&&!s.online)items.push({s,cls:"off",tag:"Offline",t:"Controller is not answering",sub:"Check the site's internet / Tailscale link and that the controller has power.",w:0});
    (L.events||[]).filter(e=>!e.cleared).forEach(e=>items.push({s,cls:e.kind==="silent"?"warn":"err",tag:e.kind==="silent"?"Silent":(e.code||"Error"),t:(e.kind==="odu"?"Outdoor unit":(e.name||"Unit"))+" 0x"+Number(e.addr).toString(16).toUpperCase()+(e.kind==="silent"?" stopped answering":" in error"),sub:"since "+when(e.at),w:e.at}));
    (L.adv||[]).forEach(a=>items.push({s,cls:"warn",tag:a.lvl==="likely"?"Likely":"Possible",t:a.title,sub:"diagnosis advisory since "+when(a.at)+" · "+a.hit+" of "+a.total+" signs",w:a.at}));});
  items.sort((a,b)=>b.w-a.w);
  const rows=items.length?items.map(i=>`<div class="trow"><span class="pill ${i.cls}"><span class="pdot"></span>${esc(i.tag)}</span>
    <div class="tinfo"><div class="tname">${esc(i.s.name)} · ${esc(i.t)}</div><div class="tsub">${esc(i.sub)}</div></div>
    <button class="btn primary sm" data-open="${i.s.id}" ${i.s.online?'':'disabled style="opacity:.5"'}>Open ↗</button></div>`).join(""):'<div class="trow"><div class="tsub">✓ No active alerts across the fleet.</div></div>';
  const spark=h=>{const mx=Math.max(1,...h);return `<svg width="150" height="26" viewBox="0 0 150 26">${h.map((v,i)=>`<rect x="${i*5}" y="${26-Math.max(v/mx*24,v?3:1)}" width="4" height="${Math.max(v/mx*24,v?3:1)}" fill="${v>0?'var(--err)':'var(--border)'}" rx="1"/>`).join("")}</svg>`;};
  $("tab-alerts").innerHTML=`<h2 class="sec" style="margin-top:4px">Active alerts</h2><div class="panel">${rows}</div>
    <h2 class="sec">Faults · last 30 days</h2><div class="panel">${DB.sites.length?DB.sites.map(s=>{const h=siteErrHist(s);
      return `<div class="trow"><div class="tinfo"><div class="tname">${esc(s.name)}</div><div class="tsub">${h?h.reduce((a,b)=>a+b,0)+" fault"+(h.reduce((a,b)=>a+b,0)===1?"":"s")+" recorded in 30 days":(s.online?"This controller does not report fault history (needs Cortex 1.7.0-beta.3 or newer)":"No data while offline")}</div></div>${h?spark(h):""}</div>`;}).join(""):'<div class="trow"><div class="tsub">No buildings yet.</div></div>'}</div>
    <div class="note" style="margin-top:12px">Everything here is read live from each building's Cortex controller: active faults and the 30-day history from its fault recorder, advisories from its cycle diagnosis. Nothing is stored in Cortex Command.</div>`;
  document.querySelectorAll("#tab-alerts [data-open]").forEach(b=>b.onclick=()=>{const s=DB.sites.find(x=>x.id===b.dataset.open),u=siteUrl(s);if(!u)return;window.open(u,"_blank","noopener");log(`Opened ${s.name} from an alert`);renderAudit();});
}
function renderTechs(){
  $("tab-techs").innerHTML=`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px"><button class="btn sm" id="addtech">+ Add technician</button><button class="btn primary sm" id="newgrant">+ Grant temporary access</button></div>
   <div class="panel">`+(DB.techs.length?DB.techs.map(t=>{
    const {perm,temp}=techAccess(t.id);
    const chips=perm.map(id=>`<span class="chip">${siteName(id)}</span>`).join("")
      +activeGrants().filter(g=>g.tech===t.id).map(g=>`<span class="chip temp" data-rev="${g.id}">${siteName(g.site)} · <b data-until="${g.until}"></b> · revoke ✕</span>`).join("");
    return `<div class="trow"><div class="ava">${initials(t.name)}</div>
      <div class="tinfo"><div class="tname">${t.name}</div><div class="tsub">${t.email} · ${perm.length} permanent${temp.length?` · ${temp.length} temporary`:''}</div>
        <div class="chips">${chips||'<span class="tsub">no buildings assigned</span>'}</div></div>

/* ---------- a little history per building, kept in this browser ----------
   One sample every 15 minutes while Command is running, kept for 7 days. It feeds the sparklines on the
   cards, the trend charts in a building's details and the uptime figure. Sample:
   [time, online, unitsOn, units, errors, silent, advisories, health(-1 = none), avgRoomF(-1 = none)] */
const HIST_KEY="cortex_cmd_hist",HIST_EVERY=15*60000,HIST_KEEP=7*86400000;
let HIST=(()=>{try{return JSON.parse(localStorage.getItem(HIST_KEY))||{};}catch(e){return {};}})();
function histNote(){const t=Date.now();let ch=false;
  DB.sites.forEach(s=>{if(!siteUrl(s))return;const a=HIST[s.id]||(HIST[s.id]=[]),last=a[a.length-1];if(last&&t-last[0]<HIST_EVERY)return;const L=LIVE[s.id]||{};
    a.push([t,s.online?1:0,s.online?(L.on||0):0,L.units||s.units||0,s.online?(s.err||0):0,s.online?(L.offline||0):0,s.online?(L.adv||[]).length:0,(s.online&&L.health!=null)?L.health:-1,(s.online&&L.avgRoom!=null)?Math.round(L.avgRoom):-1]);
    while(a.length&&t-a[0][0]>HIST_KEEP)a.shift();ch=true;});
  Object.keys(HIST).forEach(id=>{if(!DB.sites.find(s=>s.id===id)){delete HIST[id];ch=true;}});
  if(ch)try{localStorage.setItem(HIST_KEY,JSON.stringify(HIST));}catch(e){}}
function histOf(s,hours){const t=Date.now()-hours*3600000;return (HIST[s.id]||[]).filter(x=>x[0]>=t);}

function newestVer(){let best="";DB.sites.forEach(s=>{if(s.ver&&cmpVer(s.ver,best)>0)best=s.ver;});return best;}
function cmpVer(a,b){const p=v=>{const m=/^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?/.exec(String(v||""));return m?{n:[+m[1],+m[2],+m[3]],pre:m[4]?m[4].split(".").map(x=>/^\d+$/.test(x)?+x:x):null}:null;},x=p(a),y=p(b);if(!x||!y)return x?1:y?-1:0;
  for(let i=0;i<3;i++)if(x.n[i]!==y.n[i])return x.n[i]<y.n[i]?-1:1;if(!x.pre&&!y.pre)return 0;if(!x.pre)return 1;if(!y.pre)return -1;

/* ---------- drawings ---------- */
function hashN(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* The picture at the top of a card: a small skyline that belongs to that building (same every time, drawn

function siteArt(s){const W=320,H=74,L=LIVE[s.id]||{},st=!siteUrl(s)?"none":!s.online?"off":s.err?"err":"ok";let r=hashN(s.id+"|"+s.name);const rnd=()=>{r=(Math.imul(r,1664525)+1013904223)>>>0;return r/4294967296;};

/* a ring: how many units are on, off, in error or silent */

function lineChart(pts,opt){opt=opt||{};const W=560,H=opt.h||120,pl=34,pb=18,pt=8;const v=pts.filter(p=>p[1]!=null);if(v.length<2)return `<div class="note" style="margin:0">Not enough history yet. Command saves a sample every 15 minutes while it is running.</div>`;
  const t0=pts[0][0],t1=pts[pts.length-1][0]||t0+1;let mn=opt.min!=null?opt.min:Math.min(...v.map(p=>p[1])),mx=opt.max!=null?opt.max:Math.max(...v.map(p=>p[1]));if(mx===mn){mx+=1;}

/* ---------- daily briefing ----------
   The first sign-in of each day opens one screen: what needs attention, what changed since you were last
   here, and what is fine. Everything on it is read from the buildings' controllers a moment ago. */
function briefDay(){const d=new Date(Date.now()-(+PREFS.briefHour||0)*3600000);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function briefKey(){return "cortex_cmd_brief_"+OWNER.user;}
function briefState(){try{return JSON.parse(localStorage.getItem(briefKey()))||{};}catch(e){return {};}}
function briefing(force){const st=briefState();if(!force&&(PREFS.briefing===false||st.day===briefDay()))return;if(!DB.sites.length&&!force)return;
  const since=st.at||Date.now()-86400000,hr=new Date().getHours(),hello=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening",first=(OWNER.name||"").split(/\s+/)[0]||"";
  const need=[],news=[],fyi=[];let fine=0,unitsOn=0,units=0;const nv=newestVer();
  DB.sites.forEach(s=>{const L=LIVE[s.id]||{},n=[];if(!siteUrl(s))return;
    if(!s.online){need.push({s,cls:"off",t:"Controller is not answering",sub:(s.seen?"Last seen "+fmtTime(s.seen)+". ":"")+"Check its power and its network or Tailscale link."});return;}
    units+=L.units||0;unitsOn+=L.on||0;
    if((L.errs||[]).length)n.push({cls:"err",t:L.errs.length+" unit"+(L.errs.length>1?"s":"")+" in error",sub:L.errs.slice(0,4).map(e=>e.name+" "+e.code).join(" · ")+(L.errs.length>4?" · +"+(L.errs.length-4)+" more":"")});
    if(L.offline)n.push({cls:"warn",t:L.offline+" unit"+(L.offline>1?"s are":" is")+" not answering",sub:"The controller can't reach "+(L.offline>1?"them":"it")+" on the bus."});
    (L.adv||[]).forEach(a=>n.push({cls:"warn",t:(a.lvl==="likely"?"Likely: ":"Possible: ")+a.title,sub:"Diagnosis advisory since "+fmtTime(a.at)}));
    if(L.health!=null&&L.health<65)n.push({cls:"warn",t:"System health is "+L.health+" out of 100",sub:"Open the building's Outdoor / cycle page and press Health for the reasons."});
    if(L.filters)n.push({cls:"info",t:L.filters+" filter"+(L.filters>1?"s":"")+" due for cleaning",sub:""});
    if(s.ver&&nv&&cmpVer(s.ver,nv)<0)n.push({cls:"info",t:"Controller update available",sub:"On v"+s.ver+"; another building is already on v"+nv+"."});
    const ev=(L.events||[]).filter(e=>e.at>since),nf=ev.filter(e=>e.kind!=="silent"),cl=(L.events||[]).filter(e=>e.cleared&&e.cleared>since&&e.at<=since);
    if(nf.length)news.push({s,t:nf.length+" new fault"+(nf.length>1?"s":"")+" recorded",sub:[...new Set(nf.map(e=>e.code).filter(Boolean))].slice(0,5).join(" · ")+(nf.every(e=>e.cleared)?" · all cleared since":"")});
    if(cl.length)news.push({s,t:cl.length+" earlier fault"+(cl.length>1?"s":"")+" cleared",sub:""});
    const h=histOf(s,Math.min(168,Math.max(1,(Date.now()-since)/3600000))),downs=h.filter((p,i)=>i&&!p[1]&&h[i-1][1]).length;if(downs)news.push({s,t:"Went offline "+downs+" time"+(downs>1?"s":"")+" and came back",sub:""});
    n.filter(x=>x.cls==="info").forEach(x=>fyi.push(Object.assign({s},x)));const real=n.filter(x=>x.cls!=="info");
    if(real.length)real.forEach(x=>need.push(Object.assign({s},x)));else fine++;});
  const soon=activeGrants().filter(g=>g.until-Date.now()<24*3600000);
  const group=(list,calm)=>{const by=new Map();list.forEach(x=>{if(!by.has(x.s.id))by.set(x.s.id,[]);by.get(x.s.id).push(x);});
    return [...by.values()].map(xs=>{const s=xs[0].s;return `<div class="bgroup"><div class="bg-h"><b>${esc(s.name)}</b>${calm?"":sitePill(s)}<span style="flex:1"></span>${s.online?`<button class="btn sm" data-bopen="${s.id}">Open ↗</button>`:""}</div>${xs.map(x=>`<div class="bg-r"><i class="bdot ${calm?"ok":x.cls}"></i><div><div class="tname">${esc(x.t)}</div>${x.sub?`<div class="tsub">${esc(x.sub)}</div>`:""}</div></div>`).join("")}</div>`;}).join("");};
  const total=DB.sites.filter(s=>siteUrl(s)).length,bad=new Set(need.map(x=>x.s.id)).size;
  openModal(`<div class="mb" style="padding-top:22px"><div class="brief-h"><span style="color:var(--accent)">${brainMark(56,"live")}</span><div><div class="brief-t">${hello}${first?", "+esc(first):""}.</div><div class="tsub">${new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})} · ${st.at?"since you were last here "+fmtTime(st.at):"your first briefing"}</div></div></div>
      <div class="brief-sum">${total?`<b>${total-bad}</b> of <b>${total}</b> building${total===1?"":"s"} ${total-bad===1?"is":"are"} running with nothing to look at.${units?" "+unitsOn+" of "+units+" indoor units are on.":""}`:"No buildings have a controller address yet."}</div>
      <h2 class="sec">Needs attention${need.length?" · "+bad+" building"+(bad===1?"":"s"):""}</h2>${need.length?group(need):'<div class="panel"><div class="trow"><div class="tsub">✓ Nothing needs you right now.</div></div></div>'}
      <h2 class="sec">Since you were last here</h2>${news.length?group(news,true):'<div class="panel"><div class="trow"><div class="tsub">No new faults, outages or advisories.</div></div></div>'}
      ${fyi.length?`<h2 class="sec">Worth knowing</h2>${group(fyi)}`:""}
      ${soon.length?`<h2 class="sec">Temporary access ending today</h2><div class="panel">${soon.map(g=>`<div class="trow"><div class="tinfo"><div class="tname">${esc(techName(g.tech))} · ${esc(siteName(g.site))}</div><div class="tsub">ends ${fmtTime(g.until)}</div></div></div>`).join("")}</div>`:""}
      <div class="tsub" style="margin-top:12px">Read from each building's controller a moment ago. Turn the briefing off, or change when the day starts, in Settings ▸ Daily briefing.</div></div>
    <div class="mf"><button class="btn" id="br-alerts">Go to alerts</button><button class="btn primary" id="br-ok">Start the day</button></div>`,true);
  const done=()=>{try{localStorage.setItem(briefKey(),JSON.stringify({day:briefDay(),at:Date.now()}));}catch(e){}closeModal();};
  $("br-ok").onclick=done;$("br-alerts").onclick=()=>{done();tab="alerts";setTab();renderAlerts();};
  document.querySelectorAll("[data-bopen]").forEach(b=>b.onclick=()=>openSite(DB.sites.find(x=>x.id===b.dataset.bopen)));
  if(!force)log("Read the daily briefing");}
let briefWait=false;

/* ---------- tabs / chrome ---------- */
function setTab(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ["sites","alerts","techs","audit","settings"].forEach(t=>$("tab-"+t).classList.toggle("hide",tab!==t));if(tab==="settings")renderSettings();}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setTab();if(tab==="techs")tickCountdowns();});
{const _at=applyTheme;applyTheme=function(){_at();document.documentElement.classList.toggle("no-motion",PREFS.motion===false);};}
applyTheme();
$("settings").onclick=openSettings;$("brief").onclick=()=>briefing(true);
function openSettings(sec){if(sec)setSec=sec;tab="settings";setTab();window.scrollTo(0,0);}
/* ---------- alerts while Command is closed ----------
   A closed page cannot watch anything, so the controller this page was opened from does it: Command gives
   it the list of buildings (name + address only), it looks at each one about once a minute, and it sends a
   push notification to this device when one changes. Needs Command to be opened from a controller's https
   address; opened as a file there is no controller to ask. */
const HOME={ok:false,checked:false};
async function homeCheck(){if(HOME.checked)return HOME.ok;HOME.checked=true;if(!/^https?:$/.test(location.protocol))return false;
  try{const j=await getJ("/api/fleet",3000);HOME.ok=!!(j&&j.ok);}catch(e){HOME.ok=false;}return HOME.ok;}
let fleetSyncT=null;
function fleetSync(){if(!HOME.ok)return;clearTimeout(fleetSyncT);fleetSyncT=setTimeout(()=>{
  const sites=DB.sites.map(s=>({id:s.id,name:s.name,url:siteUrl(s)})).filter(s=>s.url);
  fetch("/api/fleet",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sites})}).catch(()=>{});},800);}
function pushCan(){return window.isSecureContext&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;}
async function pushSub(){try{const reg=await navigator.serviceWorker.getRegistration("/");return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;}}
async function fleetPushState(){if(!pushCan())return {can:false};const sub=await pushSub();if(!sub)return {can:true,on:false};
  try{const j=await getJ("/api/push?endpoint="+encodeURIComponent(sub.endpoint),3000);return {can:true,on:!!j.fleet,sub};}catch(e){return {can:true,on:false,sub};}}
async function fleetPushOn(){try{const perm=await Notification.requestPermission();if(perm!=="granted")throw new Error(perm==="denied"?"notifications are blocked for this site in the browser’s settings":"permission was not given");
    const reg=await navigator.serviceWorker.register("/sw.js",{scope:"/"});await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){const key=(await getJ("/api/push",4000)).key,raw=Uint8Array.from(atob(key.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw});}
    const r=await fetch("/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),user:OWNER.user,fleet:true})});if(!r.ok)throw new Error("the controller refused it");
    fleetSync();log("Turned on alerts for this device");toast("Alerts are on for this device");}catch(e){toast("Couldn’t turn alerts on: "+e.message);}drawFleetPush();}
async function fleetPushOff(){try{const sub=await pushSub();if(sub)await fetch("/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),user:OWNER.user,fleet:false})});
    log("Turned off alerts for this device");toast("Alerts are off for this device");}catch(e){toast("Couldn’t turn them off: "+e.message);}drawFleetPush();}
async function fleetPushTest(){const sub=await pushSub();if(!sub){toast("Turn alerts on first");return;}
  try{const r=await(await fetch("/api/fleet/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})})).json();toast(r.sent?"Test sent. It should appear in a few seconds":"The push service did not accept it"+(r.errors&&r.errors[0]?" ("+r.errors[0]+")":""));}catch(e){toast("Couldn’t reach the controller");}}
async function drawFleetPush(){const el=$("fleet-push");if(!el)return;
  if(location.protocol==="file:"){el.innerHTML="Command is open as a file, so nothing is running when you close it. Open Command from one of your controllers instead (its address followed by <span class=\"mono\">/command-center.html</span>) and that controller will watch the buildings for you.";return;}
  if(!await homeCheck()){el.innerHTML="The controller serving this page is on an older Cortex version. Update it to get alerts while Command is closed.";return;}
  if(!$("fleet-push"))return;
  if(!pushCan()){const ios=/iPhone|iPad/.test(navigator.userAgent);el.innerHTML=!window.isSecureContext?"Browsers only allow notifications on a secure (https) page. Open Command through the controller’s https address.":ios?"On iPhone and iPad: tap Share, then <b>Add to Home Screen</b>, and open Command from that icon. Then come back here.":"This browser does not support push notifications.";return;}
  const st=await fleetPushState();if(!$("fleet-push"))return;const n=DB.sites.filter(s=>siteUrl(s)).length;
  el.innerHTML=st.on?`<b>On for this device.</b> This controller checks ${n} building${n!==1?"s":""} about once a minute and notifies you when one goes offline or comes back, a unit goes into error or stops answering, or a new diagnosis advisory appears.<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="fleetPushTest()">Send a test</button><button class="btn" onclick="fleetPushOff()">Turn off</button></div>`
    :`Off on this device. Turn it on and this controller will check your buildings about once a minute and notify this device, even with Command closed.<div style="margin-top:10px"><button class="btn primary" onclick="fleetPushOn()">Turn on alerts</button></div>`;}
function signOut(msg){sessionStorage.removeItem("cortex_cmd_in");const bg=APP&&APPINFO&&APPINFO.options&&APPINFO.options.background;   // the Windows app keeps watching from the tray while signed out
  if(healthTimer&&!bg){clearInterval(healthTimer);healthTimer=null;}closeModal();$("app").classList.add("hide");$("login").style.display="flex";showSignin(msg);}
$("logout").onclick=()=>signOut();
/* sign out after a period with no mouse, key or touch activity (per-user setting) */
let lastTouch=Date.now();["pointerdown","keydown","wheel","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastTouch=Date.now();try{sessionStorage.setItem("cortex_cmd_touch",String(lastTouch));}catch(e){}},{passive:true}));
setInterval(()=>{if(!sessionStorage.getItem("cortex_cmd_in"))return;const m=+PREFS.idleMin||0;if(m&&Date.now()-lastTouch>m*60000)signOut("Signed out after "+m+" minutes without activity.");},15000);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ---------- auth: first-run setup wizard, sign-in, recovery ---------- */
function enter(){$("login").style.display="none";$("app").classList.remove("hide");$("who").textContent=OWNER.name;tab=PREFS.landing||"sites";brandMark(false);render();setTab();if(tab==="techs")tickCountdowns();briefWait=true;updBar();startHealthPolling();homeCheck().then(ok=>{if(ok)fleetSync();});}
function signedIn(acct){OWNER.user=acct.user;OWNER.name=acct.name;sessionStorage.setItem("cortex_cmd_in","1");PREFS=loadPrefs();siteSort=PREFS.siteSort||"custom";applyTheme();lastTouch=Date.now();fleetPrimed=false;enter();}
const CARD=()=>$("login-card");
function head(title,sub){return `<div class="login-logo">${LOGO_SVG}Cortex Command</div><div class="login-sub">${esc(sub||"Fleet console")}</div>${title?`<h2 style="margin:4px 0 14px;font-size:18px">${esc(title)}</h2>`:""}`;}

/* first-run: create the owner account for this console */
function showSetup(){
  CARD().innerHTML=head("Set up this console","Fleet console · first-time setup")+`
    <label class="flabel">Your name</label>
    <input class="inp" id="su-name" placeholder="e.g. Alex" autocomplete="off">
    <label class="flabel" style="margin-top:10px">Owner username</label>
    <input class="inp" id="su-user" placeholder="username" autocomplete="off">
    <label class="flabel" style="margin-top:10px">Password</label>
    <input class="inp" id="su-pass" type="password" placeholder="choose a password" style="margin-top:4px">
    <input class="inp" id="su-pass2" type="password" placeholder="confirm password" style="margin-top:8px">
    <div class="err-text" id="su-err"></div>
    <button class="btn primary" id="su-go" style="width:100%;margin-top:10px">Create console</button>
    <div class="note" style="margin-top:14px">This owner account always has access to every building. You'll get a recovery code next — keep it somewhere safe.</div>`;
  $("su-go").onclick=()=>{
    const name=$("su-name").value.trim(),user=$("su-user").value.trim(),p=$("su-pass").value,p2=$("su-pass2").value;
    if(!name||!user){$("su-err").textContent="Enter your name and a username.";return;}
    if(p.length<4){$("su-err").textContent="Password must be at least 4 characters.";return;}
    if(p!==p2){$("su-err").textContent="Passwords don't match.";return;}
    const acct={name,user,passhash:hash(p),recovery:genRecovery(name)};
    saveAcct(acct);showRecoveryCode(acct);
  };
  $("su-pass2").addEventListener("keydown",e=>{if(e.key==="Enter")$("su-go").click();});
}
/* show the generated recovery code once, then enter */
function showRecoveryCode(acct){
  CARD().innerHTML=head("Save your recovery code","Account created")+`
    <div class="note" style="margin-bottom:10px">If you ever forget your password, this code resets it. Write it down — it won't be shown again.</div>
    <div style="font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:2px;text-align:center;background:var(--surface-2,rgba(127,127,127,.1));border:1px dashed var(--border);border-radius:10px;padding:14px;user-select:all">${esc(acct.recovery)}</div>
    <button class="btn primary" id="rc-done" style="width:100%;margin-top:14px">I've saved it — continue</button>`;
  $("rc-done").onclick=()=>signedIn(acct);
}
/* normal sign-in */
function showSignin(msg){
  CARD().innerHTML=head("","Fleet console · AIROW")+`
    <label class="flabel">Owner login</label>
    <input class="inp" id="lg-user" placeholder="username" autocomplete="off">
    <input class="inp" id="lg-pass" type="password" placeholder="password" style="margin-top:8px">
    <div class="err-text" id="lg-err">${esc(msg||"")}</div>
    <button class="btn primary" id="lg-go" style="width:100%;margin-top:6px">Sign in</button>
    <div style="text-align:center;margin-top:14px"><button class="linklike" id="lg-forgot" style="background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:13px;text-decoration:underline">Forgot password?</button></div>`;
  $("lg-go").onclick=()=>{
    const acct=loadAcct();if(!acct){showSetup();return;}
    const u=$("lg-user").value.trim(),p=$("lg-pass").value;
    if(u===acct.user&&hash(p)===acct.passhash)signedIn(acct);
    else $("lg-err").textContent="Wrong username or password.";
  };
  $("lg-forgot").onclick=showRecovery;
  $("lg-pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("lg-go").click();});
}
/* recovery: enter the code, set a new password */
function showRecovery(){
  CARD().innerHTML=head("Account recovery","Reset your password")+`
    <label class="flabel">Recovery code</label>
    <input class="inp" id="rec-code" placeholder="CORTEX-XXXX-XXXX-XXXX" autocomplete="off" style="font-family:ui-monospace,Menlo,monospace">
    <div class="err-text" id="rec-err"></div>
    <button class="btn primary" id="rec-go" style="width:100%;margin-top:6px">Verify</button>
    <div style="text-align:center;margin-top:14px"><button class="linklike" id="rec-back" style="background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:13px;text-decoration:underline">Back to sign in</button></div>`;
  $("rec-back").onclick=()=>showSignin();
  $("rec-go").onclick=()=>{
    const acct=loadAcct();
    if(acct&&$("rec-code").value.trim().toUpperCase()===acct.recovery){
      CARD().innerHTML=head("Set a new password","Recovery verified")+`
        <input class="inp" id="np" type="password" placeholder="new password">
        <input class="inp" id="np2" type="password" placeholder="confirm new password" style="margin-top:8px">
        <div class="err-text" id="np-err"></div>
        <button class="btn primary" id="np-go" style="width:100%;margin-top:10px">Save password</button>`;
      $("np-go").onclick=()=>{
        const p=$("np").value,p2=$("np2").value;
        if(p.length<4){$("np-err").textContent="Password must be at least 4 characters.";return;}
        if(p!==p2){$("np-err").textContent="Passwords don't match.";return;}
        acct.passhash=hash(p);acct.recovery=genRecovery(acct.name);saveAcct(acct);
        showRecoveryCode(acct);
      };
    } else $("rec-err").textContent="That code doesn't match this console.";
  };
}

/* boot */
(function(){
  const acct=loadAcct();
  if(!acct){showSetup();}
  else if(sessionStorage.getItem("cortex_cmd_in")==="1"){OWNER.user=acct.user;OWNER.name=acct.name;PREFS=loadPrefs();applyTheme();lastTouch=+sessionStorage.getItem("cortex_cmd_touch")||Date.now();enter();}
  else {showSignin();}
})();
</script>
</body>
