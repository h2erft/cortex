<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--surface-2:#f0f1f4;--border:#e3e5ea;--shadow-lg:0 12px 40px rgba(16,24,40,.14);
  --text:#1a1f29;--text-dim:#5b6472;--text-faint:#9aa2b1;
  --accent:#0e7c66;--accent-ink:#0b5f4e;--accent-soft:#d9efe9;
  --ok:#2e9e5b;--ok-soft:#e4f4ec;--warn:#c98a12;--warn-soft:#fbf0d8;--err:#d93b3b;--err-soft:#fbe6e6;
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e1116;--surface:#161b23;--surface-2:#1d232d;--border:#2a323e;--shadow-lg:0 14px 44px rgba(0,0,0,.5);
  --text:#e9edf3;--text-dim:#9aa6b5;--text-faint:#687283;
  --accent:#2fb79a;--accent-ink:#8fe6d4;--accent-soft:#143029;
  --ok:#43c072;--ok-soft:#142a20;--warn:#e0ad4e;--warn-soft:#2e2514;--err:#f26a6a;--err-soft:#2f1819;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.brand .dot{width:22px;height:22px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.brand small{font-weight:500;color:var(--text-faint);font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.top .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--border);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
.rolebadge{font-size:10.5px;background:var(--accent-soft);color:var(--accent-ink);padding:2px 7px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--text-dim);margin-top:2px}
.kpi .n small{font-size:13px;color:var(--text-faint);font-weight:500}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-faint);margin:26px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:4px}
.tab{background:none;border:none;padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-dim)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 0 var(--border)}
/* site grid */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.site{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.site .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.site .nm{font-weight:650;font-size:15px}
.site .lo{font-size:12px;color:var(--text-faint);margin-top:1px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-2);color:var(--text-faint)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.warn{background:var(--warn-soft,#fbf0d5);color:var(--warn,#b7791f)}
.pdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.stat-row{display:flex;gap:16px;font-size:12.5px;color:var(--text-dim)}
.stat-row b{color:var(--text);font-weight:650}
.site .foot{display:flex;gap:8px;margin-top:2px}
.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.grow{flex:1}
/* techs */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.trow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--border)}
.trow:first-child{border-top:none}
.ava{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:13px}
.tinfo{flex:1;min-width:0}
.tname{font-weight:600;font-size:14px}
.tsub{font-size:12px;color:var(--text-faint)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--text-dim)}
.chip.temp{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.temp b{font-variant-numeric:tabular-nums}
/* audit */
.audit{font-size:12.5px}
.arow{display:flex;gap:10px;padding:9px 16px;border-top:1px solid var(--border);color:var(--text-dim)}
.arow:first-child{border-top:none}
.arow .t{color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.arow .m{color:var(--text)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.scrim.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:440px;max-width:100%;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.mh h3{margin:0;font-size:16px}
.mb{padding:18px}
.flabel{display:block;font-size:12px;color:var(--text-dim);margin:12px 0 5px;font-weight:500}
.flabel:first-child{margin-top:0}
.inp{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:14px;font-family:inherit}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);border-radius:9px;font-size:13px}
.seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal>.mf{margin-top:0;padding:14px 18px 18px;border-top:1px solid var(--border)}   /* a footer that sits outside the scrolling body needs its own padding */
.note{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--text-dim);line-height:1.5}
/* login */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);width:380px;max-width:100%;padding:26px}
.login-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.login-logo .dot{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:20px}
.err-text{color:var(--err);font-size:12.5px;min-height:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{max-height:calc(100dvh - 32px);display:flex;flex-direction:column}.modal .mb{overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.cx-brain{display:block;overflow:visible;flex:none}
.cx-brain .bh{fill:currentColor;fill-opacity:.13;stroke:currentColor;stroke-linejoin:round;stroke-linecap:round}
.cx-brain .bt{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.cx-brain .bn{fill:currentColor}
.cx-brain .bl{fill:none;stroke:currentColor;stroke-opacity:.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 3.4}
.cx-brain .bp{fill:currentColor;opacity:0}
.cx-brain .bhalo{fill:none;stroke:currentColor;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .cx-brain.calm .bn{animation:cxtw 5s ease-in-out infinite}
  .cx-brain.live .bcore{transform-box:fill-box;transform-origin:center;animation:cxpulse 2.4s ease-in-out infinite}
  .cx-brain.live .bh{animation:cxfill 2.4s ease-in-out infinite}
  .cx-brain.live .bhalo{transform-box:fill-box;transform-origin:center;animation:cxhalo 2.4s ease-out infinite}
  .cx-brain.live .bn{animation:cxtw 1.6s ease-in-out infinite}
  @supports (offset-path:path("M0 0")){
    .cx-brain.live .bp{animation:cxin 2.2s linear infinite}
    .cx-brain.live .bp.out{animation-name:cxout}
  }
}
@keyframes cxtw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes cxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes cxfill{0%,100%{fill-opacity:.1}50%{fill-opacity:.26}}
@keyframes cxhalo{0%{transform:scale(.8);opacity:.45}100%{transform:scale(1.32);opacity:0}}
@keyframes cxin{0%{offset-distance:0%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes cxout{0%{offset-distance:100%;opacity:0}12%{opacity:1}86%{opacity:1}100%{offset-distance:0%;opacity:0}}
.no-motion .cx-brain *{animation:none!important}.no-motion .sbeat{animation:none!important}
.brand .blogo{display:inline-flex;color:var(--accent);margin-right:8px;vertical-align:middle}.brand{display:flex;align-items:center}
.bload{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;color:var(--accent);font-size:13px}.bload div{color:var(--text-dim)}
.site{overflow:hidden}.sart{display:block;width:100%;height:74px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.sart .bld rect{fill:var(--border)}.sart .w-off{fill:var(--surface);opacity:.55}.sart .w-on{fill:var(--accent)}.sart .sline{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.9;vector-effect:non-scaling-stroke}
.sart.err .w-on{fill:var(--warn)}.sart.err .sline{stroke:var(--err)}.sart.off .bld rect,.sart.none .bld rect{opacity:.5}.sart .sbeat{fill:var(--ok)}.sart.err .sbeat{fill:var(--err)}
@media (prefers-reduced-motion:no-preference){.sart .sbeat{animation:sbeat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}@keyframes sbeat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.modal .sart{border:1px solid var(--border);border-radius:12px;height:90px}
.smet{display:flex;gap:14px;align-items:center}.smg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;flex:1}.sm{display:flex;flex-direction:column;line-height:1.2}.sm b{font-size:16px;font-weight:650}.sm span{font-size:11.5px;color:var(--text-faint)}
.rg-n{font-size:17px;font-weight:650;fill:var(--text);font-family:inherit}.rg-l{font-size:9.5px;fill:var(--text-faint);font-family:inherit}
.pill.info{background:var(--surface-2);color:var(--text-dim)}
.lchart{display:block;width:100%;height:auto}.lchart .ax{stroke:var(--border);stroke-width:1}.lchart .axl{font-size:10px;fill:var(--text-faint);font-family:inherit}
.tcard{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:10px}.tcard .tl{font-size:12.5px;font-weight:600;margin-bottom:6px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin-top:10px}.drow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--border);padding:4px 0}.drow span{color:var(--text-dim)}
.setpage{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.setnav button{text-align:left;border:0;background:none;color:var(--text-dim);padding:9px 12px;border-radius:10px;font-size:13.5px;cursor:pointer}.setnav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.setbody{padding:18px 20px}.srow{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}.srow:first-of-type{border-top:0}.srow .tname{font-size:13.5px;font-weight:550}.sctl{flex:none;max-width:60%}.sctl .seg{margin:0;flex-wrap:wrap}
.swt{width:44px;height:26px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);position:relative;cursor:pointer;padding:0;transition:background .15s}.swt i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}.swt.on{background:var(--accent);border-color:var(--accent)}.swt.on i{transform:translateX(18px)}
.brief-h{display:flex;gap:16px;align-items:center}.brief-t{font-size:22px;font-weight:650;letter-spacing:-.01em}.brief-sum{margin:16px 0 4px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.modal.wide{width:min(760px,calc(100vw - 32px));max-width:none}
.site .foot{flex-wrap:wrap}.site .foot .grow{flex:1 1 100%}.site .foot .btn:not(.grow){flex:1}
.bgroup{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--surface)}.bg-h{display:flex;gap:10px;align-items:center;margin-bottom:4px}.bg-r{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border)}.bg-r .tname{font-size:13.5px;font-weight:550}
.bdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--text-faint)}.bdot.err{background:var(--err)}.bdot.warn{background:var(--warn)}.bdot.ok{background:var(--ok)}.bdot.off{background:var(--text-faint)}
/* ===== Motion =====
   Entrance effects run only when a tab or dialog is opened (.enter / .pop), never on the 20-second refresh.
   All of it is off with Settings ▸ Appearance ▸ Animations, or the system's "reduce motion" setting. */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

<script>
/* ---------- state ---------- */
const OWNER={user:"",name:"Owner"};  // populated from the stored account at sign-in
/* local owner account (this console is a single file; account lives in this browser) */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16);}
function loadAcct(){try{return JSON.parse(localStorage.getItem("cortex_cmd_acct"))||null;}catch(e){return null;}}
function saveAcct(a){try{localStorage.setItem("cortex_cmd_acct",JSON.stringify(a));}catch(e){}}
function genRecovery(name){const base=(name||"CMD").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||"CMD";const g=()=>Math.random().toString(16).slice(2,6).toUpperCase();return "CORTEX-"+base+"-"+g()+"-"+g();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let DB=load()||seed();DB.acks=DB.acks||{};DB.snooze=DB.snooze||{};
/* per-user preferences (scoped to the signed-in owner account) */
const PREF_DEFAULTS={theme:"auto",layout:"grid",density:"comfortable",showOffline:true,clock24:false,autorefresh:true,confirmOpen:false,compactNums:false,soundAlerts:false,landing:"sites",idleMin:15,accent:"slate",textSize:"normal",showHealth:true,popAlerts:true,cardArt:true,motion:true,briefing:true,briefHour:4,winNotify:true,
  nOffline:true,nError:true,nSilent:false,nAdvisory:false,offlineAfterMin:15};      // which kinds of alert reach you, and how long a controller must be offline before you are told
let PREFS=loadPrefs();
function prefsKey(){return "cortex_cmd_prefs_"+OWNER.user;}
function loadPrefs(){try{return Object.assign({},PREF_DEFAULTS,JSON.parse(localStorage.getItem(prefsKey())||localStorage.getItem("cortex_cmd_prefs_owner"))||{});}catch(e){return Object.assign({},PREF_DEFAULTS);}}
function savePrefs(){try{localStorage.setItem(prefsKey(),JSON.stringify(PREFS));}catch(e){}if(typeof fleetSync==="function")fleetSync();}
function applyTheme(){if(PREFS.theme==="auto"){if(matchMedia("(prefers-color-scheme:dark)").matches)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");}else document.documentElement.setAttribute("data-theme",PREFS.theme);
  const dark=document.documentElement.getAttribute("data-theme")==="dark",a=CMD_ACCENTS[PREFS.accent]||CMD_ACCENTS.slate,v=dark?a.d:a.l,r=document.documentElement.style;r.setProperty("--accent",v[0]);r.setProperty("--accent-ink",v[1]);r.setProperty("--accent-soft",v[2]);

const CMD_ACCENTS={slate:{n:"Slate",l:["#0e7c66","#0b5f4e","#d9efe9"],d:["#2fb79a","#8fe6d4","#143029"]},arctic:{n:"Arctic",l:["#1f74c4","#15568f","#e2eefb"],d:["#5aa6e8","#bcd8f5","#13263a"]},ember:{n:"Ember",l:["#d2652a","#9a4718","#faeadf"],d:["#e8955a","#f4c7a6","#33251a"]},violet:{n:"Violet",l:["#6b4fd0","#4c359c","#ebe6fb"],d:["#9d86ee","#d3c8fa","#231c3d"]},
  forest:{n:"Forest",l:["#2f9e44","#1f6e30","#e4f3e6"],d:["#51c866","#b7e8c0","#15301b"]},ocean:{n:"Ocean",l:["#0891b2","#0b6b83","#dcf3f8"],d:["#3cc3df","#a9e6f2","#10303a"]},
  indigo:{n:"Indigo",l:["#4f55d6","#363a9c","#e5e6fb"],d:["#8f94f2","#cfd1fa","#1d1f40"]},rose:{n:"Rose",l:["#d6336c","#a02250","#fbe3ec"],d:["#f0709b","#f8c2d4","#3a1826"]},
  crimson:{n:"Crimson",l:["#c92a2a","#932020","#fbe2e2"],d:["#f07272","#f7c1c1","#3a1818"]},amber:{n:"Amber",l:["#b47c00","#7f5800","#fbf0d2"],d:["#e9b949","#f5dfa3","#33290f"]},
  lime:{n:"Lime",l:["#5c940d","#40680a","#ebf5d8"],d:["#94d82d","#cdeea0","#22300f"]},magenta:{n:"Magenta",l:["#ae3ec9","#7c2b90","#f5e3fa"],d:["#d27be8","#e9c4f3","#321a3a"]},
  graphite:{n:"Graphite",l:["#495057","#2f3439","#e9ecef"],d:["#adb5bd","#dee2e6","#26292d"]}};
function seed(){
  // Real deployments start empty — add each building by its Cortex appliance address.
  return {sites:[],techs:[],grants:[],audit:[{t:Date.now(),m:"Fleet console provisioned"}]};
}
/* normalize a building's appliance address into a reachable base URL */
/* What gets saved for a building's address. Plain http is the default, so "http://" is dropped. A secure
   address must keep its "https://": without it Command would talk plain http to the secure port and the
   building would show as offline. Port 8443 is Cortex's secure port, so an address ending in :8443 with
   no scheme is taken to mean https. */
function normAddr(v){let a=String(v||"").trim().replace(/\/+$/,"");if(/^https:\/\//i.test(a))return "https://"+a.slice(8);a=a.replace(/^http:\/\//i,"");return /:8443$/.test(a)?"https://"+a:a;}
function siteUrl(s){let u=(s&&(s.addr||s.url)||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="http://"+u;return u.replace(/\/+$/,"");}
/* poll each building's Cortex appliance /health to set online + version live */
let healthTimer=null;
async function getJ(url,ms){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms||4000);try{const r=await fetch(url,{signal:ctl.signal,cache:"no-store"});return await r.json();}finally{clearTimeout(to);}}
const LIVE={};                       // site id -> what its controller reports right now (never saved)
/* A building is only called offline when IT stops answering, not when this computer loses its own connection.
   pollSite reports whether the controller answered; pollAllSites decides what that means once every building has been
   asked: if this computer says it is offline, or every building failed in the same pass, the fault is on this side,
   so nothing is marked offline and nobody is alerted. Otherwise a building must miss two looks in a row. */
const MISS={},SELF={off:false,since:0};
async function pollSite(s){const base=siteUrl(s);if(!base){s.online=false;return "none";}
  let up=false;try{const j=await getJ(base+"/health",3000);up=!!j.ok;if(up&&j.version)s.ver=j.version;}catch(e){}
  if(!up)return "fail";
  s.online=true;
  const L=LIVE[s.id]||(LIVE[s.id]={});
  if(!L.metaAt||Date.now()-L.metaAt>600000){try{const c=await getJ(base+"/api/appconfig");L.meta=(c&&c.unitMeta)||{};L.metaAt=Date.now();}catch(e){}}   // only the unit names and groups are kept from this
  if(!L.updAt||Date.now()-L.updAt>1800000){L.updAt=Date.now();getJ(base+"/api/update/check",9000).then(j=>{L.upd=j;if(tab==="settings"&&setSec==="controllers"&&!$("scrim").classList.contains("show"))renderSettings();}).catch(()=>{});}
  try{const u=(await getJ(base+"/api/units")).units||[];L.units=u.length;
    const M=L.meta||{},nm=x=>{const m=M[x.name],l=String(x.label||"").trim();return (m&&m.alias)||((!l||/^Addr 0x/i.test(l))?"Unit "+(x.id!=null?x.id:"0x"+Number(x.addr).toString(16).toUpperCase()):l);},cd=x=>(x.err||x.code)?String(x.code||("CH"+x.err)).replace(/^CH(\d)$/,"CH0$1"):null;
    L.list=u.map(x=>({a:x.addr,n:nm(x),g:(M[x.name]&&M[x.name].floor)||"",on:!!x.on&&!x.offline,m:x.mode,r:x.room,sp:x.mode==="heat"?x.heatC:x.coolC,c:x.offline?null:cd(x),off:!!x.offline,f:!!x.filterSign}));L.on=u.filter(x=>x.on&&!x.offline).length;L.offline=u.filter(x=>x.offline).length;
    L.errs=u.filter(x=>x.err||x.code).map(x=>({name:nm(x),code:cd(x)}));s.units=L.units;s.err=L.errs.length;
    L.cool=u.filter(x=>x.on&&!x.offline&&x.mode==="cool").length;L.heat=u.filter(x=>x.on&&!x.offline&&x.mode==="heat").length;const rs=u.filter(x=>!x.offline&&typeof x.room==="number").map(x=>x.room);L.avgRoom=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null;
    L.filters=u.filter(x=>x.filterSign).length;L.locked=u.filter(x=>x.hardLock||x.tempLock||x.modeLock||x.fanLock).length;}catch(e){}
  if(!L.oduAt||Date.now()-L.oduAt>300000){try{const o=await getJ(base+"/api/odu");L.odus=Object.keys(o.odu||{}).length;L.oduAt=Date.now();}catch(e){}}
  try{L.events=(await getJ(base+"/api/events")).events||[];}catch(e){L.events=L.events||null;}
  try{const d=await getJ(base+"/api/diag");L.adv=(d.advisories||[]).filter(a=>!a.cleared);const hs=Object.values(d.health||{}).filter(h=>Date.now()-h.at<600000).map(h=>h.score);L.health=hs.length?Math.min(...hs):null;L.healthAll=Object.entries(d.health||{}).filter(([a,h])=>h&&Date.now()-h.at<600000).map(([a,h])=>({addr:"0x"+(+a).toString(16).toUpperCase(),score:h.score}));}catch(e){L.adv=L.adv||null;L.health=null;}
  L.at=Date.now();s.seen=L.at;return "ok";}
function siteSig(s){const L=LIVE[s.id]||{};return [s.online,s.err||0,(L.adv||[]).length,L.offline||0].join("|");}
/* What to tell the person about, and when.
   - Each kind can be switched off (Settings ▸ Alerts). Advisories and "a unit stopped answering" are off unless asked for.
   - A controller is only reported offline once it has BEEN offline for the chosen time (15 minutes unless changed), so
     starting or quitting Command, a restart at the site, or a short internet drop says nothing. s.offSince and
     s.offTold are kept with the building, so the wait survives a restart of Command.
   - Windows notifications are gathered and sent at most once every two minutes. */
const NOTE_Q=[];let noteAt=0,noteT=null;
function noteFlush(){clearTimeout(noteT);noteT=null;if(!NOTE_Q.length)return;const wait=120000-(Date.now()-noteAt);if(wait>0){noteT=setTimeout(noteFlush,wait+50);return;}
  const m=NOTE_Q.splice(0);noteAt=Date.now();try{APP.notify(m.length>1?m.length+" building alerts":"Cortex Command",m.slice(0,3).join("\n")+(m.length>3?"\n+"+(m.length-3)+" more":""));}catch(e){}}
function offlineDue(now){const out=[],wait=Math.max(0,+PREFS.offlineAfterMin||0)*60000;
  DB.sites.forEach(s=>{if(!siteUrl(s))return;
    if(s.online!==false){if(s.offSince||s.offTold){delete s.offSince;delete s.offTold;}return;}
    if(!s.offSince)s.offSince=now;
    if(!s.offTold&&now-s.offSince>=wait){s.offTold=now;if(PREFS.nOffline!==false&&!snoozed(s))out.push(s.name+(wait>=60000?" has been offline for "+durShort(now-s.offSince):" went offline"));}});
  return out;}
const durShort=ms=>{const m=Math.round(ms/60000);return m<60?m+" min":(Math.round(m/6)/10)+" h";};
function fleetNotice(before){const msgs=fleetPrimed?offlineDue(Date.now()):(offlineDue.prime(),[]);DB.sites.forEach((s,i)=>{if(snoozed(s))return;const b=before[i].split("|"),a=siteSig(s).split("|");
    if(a[0]==="false"||b[0]==="false")return;                                          // counts only mean something while the building is answering
    if(+a[1]>+b[1]){if(PREFS.nError!==false)msgs.push(s.name+": "+(+a[1])+" unit"+(+a[1]>1?"s":"")+" in error");}
    else if(+a[2]>+b[2]){if(PREFS.nAdvisory===true)msgs.push(s.name+": new diagnosis advisory");}
    else if(+a[3]>+b[3]){if(PREFS.nSilent===true)msgs.push(s.name+": a unit stopped answering");}});
  if(!msgs.length||!fleetPrimed)return;
  if(APP&&PREFS.winNotify!==false&&(document.hidden||!document.hasFocus())){NOTE_Q.push(...msgs);noteFlush();}
  if(!sessionStorage.getItem("cortex_cmd_in"))return;
  if(PREFS.popAlerts!==false)toast(msgs[0]+(msgs.length>1?" (+"+(msgs.length-1)+" more)":""));
  if(PREFS.soundAlerts){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18);}catch(e){}}
  if(document.hidden){document.title="("+msgs.length+") Cortex Command · AIROW";}
  msgs.forEach(m=>log("Alert: "+m));}
// First look after Command starts: a building that is already offline starts its wait now, and one that was already
// reported before Command was closed is not reported again.
offlineDue.prime=()=>{const now=Date.now();DB.sites.forEach(s=>{if(!siteUrl(s))return;if(s.online===false){if(!s.offSince)s.offSince=now;}else{delete s.offSince;delete s.offTold;}});};
let fleetPrimed=false;document.addEventListener("visibilitychange",()=>{if(!document.hidden)document.title="Cortex Command · AIROW";});
let pollBusyAt=0;
function brandMark(busy){const b=$("brand");if(!b)return;const want=busy?"live":"calm";if(b.dataset.m===want)return;b.dataset.m=want;b.innerHTML=`<span class="blogo">${brainMark(busy?30:28,want)}</span>Cortex Command <small>Fleet</small>`;}
async function pollAllSites(){if(!DB.sites.length){if(briefWait){briefWait=false;}return;}const before=DB.sites.map(siteSig);
  pollBusyAt=Date.now();brandMark(true);
  const res=await Promise.all(DB.sites.map(pollSite)),asked=res.filter(r=>r!=="none").length,failed=res.filter(r=>r==="fail").length;
  const mine=failed>0&&(navigator.onLine===false||(asked>=2&&failed===asked));
  if(mine){if(!SELF.off){SELF.off=true;SELF.since=Date.now();}}
  else{SELF.off=false;DB.sites.forEach((s,i)=>{if(res[i]==="ok"||res[i]===undefined)MISS[s.id]=0;else if(res[i]==="fail"){MISS[s.id]=(MISS[s.id]||0)+1;if(MISS[s.id]>=2||s.online!==true){s.online=false;delete LIVE[s.id];}}});}
  selfBanner();
  setTimeout(()=>brandMark(false),Math.max(0,1400-(Date.now()-pollBusyAt)));histNote();
  if(briefWait&&sessionStorage.getItem("cortex_cmd_in")){briefWait=false;setTimeout(()=>briefing(false),300);}
  const changed=DB.sites.some((s,i)=>siteSig(s)!==before[i]);fleetNotice(before);fleetPrimed=true;ackPrune();tabBadges();
  if(changed)save();if(!$("scrim").classList.contains("show")){if(tab==="sites"&&document.activeElement!==$("site-search"))renderSites();renderKpis();if(tab==="alerts")renderAlerts();if(changed)renderAudit();}}
/* the strip that says the trouble is on this computer, so the building statuses below are the last known ones */

  if(!b){b=document.createElement("div");b.id="self-off";b.style.cssText="position:sticky;top:0;z-index:30;background:var(--warn-soft,#fdf3d8);color:var(--text,#222);border-bottom:1px solid var(--warn,#c98a00);padding:9px 16px;font-size:13.5px;text-align:center";document.body.insertBefore(b,document.body.firstChild);}
  b.innerHTML=navigator.onLine===false?`<b>This computer is offline.</b> Showing each building as it was at ${fmtTime(SELF.since)}. Command will catch up by itself when the connection is back.`
    :`<b>Command can’t reach any building.</b> That usually means this computer’s internet or Tailscale connection is down, not the buildings. Showing each building as it was at ${fmtTime(SELF.since)}.`;}
window.addEventListener("offline",()=>{if(!SELF.off){SELF.off=true;SELF.since=Date.now();}selfBanner();});

let tT;function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}
  t.classList.toggle("ok",/^(Acknowledged|Synced|Sync is on$|Notes saved|Added to the log|Backup downloaded|Update started|Snoozed|Saved|Link copied)/.test(String(m)));

let siteQuery="", siteSort=PREFS.siteSort||"custom", dragId=null;
function orderedSites(){
  let list=DB.sites.slice();
  if(siteSort==="alpha")list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(siteSort==="status")list.sort((a,b)=>(b.err-a.err)||((a.online?1:0)-(b.online?1:0)));
  else{if(!PREFS.siteOrder||PREFS.siteOrder.length!==DB.sites.length)PREFS.siteOrder=DB.sites.map(x=>x.id);list.sort((a,b)=>PREFS.siteOrder.indexOf(a.id)-PREFS.siteOrder.indexOf(b.id));}
  if(siteQuery)list=list.filter(s=>(s.name+" "+(s.loc||"")+" "+(s.addr||"")).toLowerCase().includes(siteQuery.toLowerCase()));
  return list;}
/* deterministic 30-day error history per site (sample) */
function siteErrHist(s){const h=new Array(30).fill(0),ev=(LIVE[s.id]||{}).events;if(!ev)return null;const now=Date.now();
  ev.forEach(e=>{if(e.kind==="silent")return;const d=Math.floor((now-e.at)/86400000);if(d>=0&&d<30)h[29-d]++;});return h;}
function siteLive(s){const L=LIVE[s.id];if(!s.online||!L||L.units==null)return "";
  const hp=PREFS.showHealth!==false&&L.health!=null?`<span class="pill ${L.health>=85?'ok':L.health>=65?'warn':'err'}" title="Lowest system health score at this building, from its controller">health ${L.health}</span>`:"";
  return `<div class="stat-row" style="gap:8px;flex-wrap:wrap"><div><b>${L.on}</b> of ${L.units} on</div>${L.errs&&L.errs.length?`<div style="color:var(--err)"><b>${L.errs.length}</b> in error</div>`:""}${L.offline?`<div style="color:var(--warn)"><b>${L.offline}</b> silent</div>`:""}${L.adv&&L.adv.length?`<div style="color:var(--warn)"><b>${L.adv.length}</b> advisor${L.adv.length>1?"ies":"y"}</div>`:""}${hp}</div>`;}

/* ---- roles ----
   A role is a name, a colour and a list of what people with it may do. Each person in Command has one. Command still
   has a single sign-in (the owner), so today a role is the record of what each person is trusted with; it is what
   their own sign-in will follow when Command gets one. */
const CMD_PERMS=[["view","See the buildings they are assigned","Status, alerts and reports for those buildings"],["open","Open a building's dashboard","Go into Cortex at the building"],["ack","Acknowledge and snooze alerts",""],["notes","Write building notes and the log",""],
  ["update","Send updates to controllers","Install a new Cortex version at a building"],["grant","Grant temporary access","Lend a building to another person for a set time"],["people","Manage people and roles",""],["sites","Add, edit and remove buildings",""],["settings","Change Command's settings","Sync, alerts, backups"]];
const CMD_ROLE_SEED=()=>[{id:"tech",name:"Technician",accent:"amber",perms:["view","open","ack","notes"]},{id:"lead",name:"Lead technician",accent:"arctic",perms:["view","open","ack","notes","update","grant"]},{id:"manager",name:"Manager",accent:"indigo",perms:["view","open","ack","notes","update","grant","people","sites","settings"]},{id:"viewer",name:"View only",accent:"graphite",perms:["view"]}];
function cmdRoles(){if(!Array.isArray(DB.roles)||!DB.roles.length)DB.roles=CMD_ROLE_SEED();return DB.roles;}
const cmdRole=id=>cmdRoles().find(r=>r.id===id)||cmdRoles()[0];
const roleCol=r=>{const a=CMD_ACCENTS[r&&r.accent]||CMD_ACCENTS.slate;return document.documentElement.getAttribute("data-theme")==="dark"?a.d[0]:a.l[0];};
const roleChip=r=>`<span class="chip" style="border-color:${roleCol(r)};color:${roleCol(r)}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${roleCol(r)};margin-right:6px"></span>${esc(r.name)}</span>`;
function roleModal(id){const r=id?cmdRoles().find(x=>x.id===id):null,have=new Set(r?r.perms:["view","open","ack","notes"]);let acc=r?r.accent:"ocean";
  openModal(`<div class="mh"><h3>${r?"Edit role":"New role"}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="mb"><label class="flabel">Role name</label><input class="inp" id="ro-name" maxlength="30" value="${r?esc(r.name):""}" placeholder="e.g. Apprentice, Service manager" autocomplete="off">
      <label class="flabel">Colour</label><div class="swatches" id="ro-acc" style="flex-wrap:wrap">${Object.entries(CMD_ACCENTS).map(([k,a])=>`<button class="swatch ${acc===k?"on":""}" data-v="${k}" title="${a.n}" aria-label="${a.n}" style="background:${a.l[0]}"></button>`).join("")}</div>
      <label class="flabel" style="margin-top:12px">What people with this role may do</label>
      ${CMD_PERMS.map(p=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--border);cursor:pointer"><input type="checkbox" data-rp="${p[0]}" ${have.has(p[0])?"checked":""} style="width:17px;height:17px;margin-top:2px;accent-color:var(--accent)"><span><b style="font-weight:600">${p[1]}</b>${p[2]?`<span class="tsub" style="display:block">${p[2]}</span>`:""}</span></label>`).join("")}
      <div class="tsub" id="ro-err" style="color:var(--err);margin-top:8px"></div></div>
    <div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="ro-save">Save role</button></div>`);
  document.querySelectorAll("#ro-acc button").forEach(b=>b.onclick=()=>{acc=b.dataset.v;document.querySelectorAll("#ro-acc button").forEach(x=>x.classList.toggle("on",x===b));});
  $("ro-save").onclick=()=>{const name=$("ro-name").value.replace(/[<>]/g,"").trim(),perms=[...document.querySelectorAll("[data-rp]")].filter(b=>b.checked).map(b=>b.dataset.rp);
    if(!name){$("ro-err").textContent="Give the role a name.";return;}
    if(cmdRoles().some(x=>x.name.toLowerCase()===name.toLowerCase()&&x!==r)){$("ro-err").textContent="There is already a role with that name.";return;}
    if(r){const was=r.name;r.name=name;r.perms=perms;r.accent=acc;log(was===name?`Changed the role “${name}”`:`Renamed the role “${was}” to “${name}”`);}
    else{DB.roles.push({id:"r"+Date.now().toString(36),name,accent:acc,perms});log(`Created the role “${name}”`);}
    save();closeModal();render();toast("Role saved");};}
function roleDelete(id){const r=cmdRoles().find(x=>x.id===id);if(!r)return;const n=DB.techs.filter(t=>(t.role||cmdRoles()[0].id)===id).length;
  if(cmdRoles().length<=1){toast("Keep at least one role");return;}if(n){toast(n+" "+(n===1?"person has":"people have")+" this role. Give them another role first.");return;}
  DB.roles=DB.roles.filter(x=>x.id!==id);log(`Deleted the role “${r.name}”`);save();render();toast("Role deleted");}

  $("tab-techs").innerHTML=`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px"><button class="btn sm" id="addtech">+ Add technician</button><button class="btn primary sm" id="newgrant">+ Grant temporary access</button></div>
   <div class="panel">`+(DB.techs.length?DB.techs.map(t=>{

   <div class="panel">${cmdRoles().map(r=>{const n=DB.techs.filter(t=>cmdRole(t.role).id===r.id).length;return `<div class="trow"><div class="tinfo"><div class="tname">${roleChip(r)} <span class="tsub" style="font-weight:400">${n} ${n===1?"person":"people"}</span></div>

   <div class="note" style="margin-top:12px">Permanent assignments are the buildings a tech owns day-to-day. <b>Temporary access</b> is for covering someone else's site — it auto-expires at the countdown with no cleanup needed, so Bob never keeps a key to Joe's building. You (owner) always have every building.</div>`;
  const ng=$("newgrant");if(ng)ng.onclick=()=>grantModal(null);

/* ---------- countdowns ---------- */
function fmtLeft(ms){if(ms<=0)return"expired";const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  if(h>0)return h+"h "+m+"m";if(m>0)return m+"m "+ss+"s";return ss+"s";}
function tickCountdowns(){let changed=false;const now=Date.now();
  document.querySelectorAll("[data-until]").forEach(el=>{el.textContent=fmtLeft(+el.dataset.until-now);});
  DB.grants.forEach(g=>{if(!g.expired&&g.until<=now){g.expired=true;changed=true;log(`Temporary access expired: ${siteName(g.site)} for ${techName(g.tech)}`);}});
  if(changed){save();renderTechs();renderAudit();renderKpis();}
}
function techName(id){const t=DB.techs.find(x=>x.id===id);return t?t.name:id;}
setInterval(()=>{if(!$("app").classList.contains("hide")&&tab==="techs")tickCountdowns();
  else{/* still expire silently */DB.grants.forEach(g=>{if(!g.expired&&g.until<=Date.now()){g.expired=true;log(`Temporary access expired: ${siteName(g.site)} for ${techName(g.tech)}`);save();renderKpis();}});}},1000);

    log(`Removed building ${s.name}`);save();closeModal();render();toast("Building removed");
  };

function grantModal(presetSite){

  openModal(`<div class="mh"><h3>Grant temporary access</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <label class="flabel">Technician</label>
      <select class="inp" id="g-tech">${DB.techs.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select>
      <label class="flabel">Building</label>
      <select class="inp" id="g-site">${DB.sites.map(s=>`<option value="${s.id}" ${s.id===presetSite?'selected':''}>${s.name}</option>`).join("")}</select>
      <label class="flabel">Expires after</label>

    </div>`);
  let dur=4*3600;

  $("g-go").onclick=()=>{const tech=$("g-tech").value,site=$("g-site").value;

function revoke(gid){const g=DB.grants.find(x=>x.id===gid);if(!g)return;
  g.until=Date.now()-1;g.expired=true;log(`Revoked ${techName(g.tech)}'s access to ${siteName(g.site)}`);save();renderTechs();renderAudit();renderKpis();toast("Access revoked");}
function editTech(tid){const t=DB.techs.find(x=>x.id===tid);

/* ================= Cortex Command 2: logo, history, site graphics, detail view, settings page, briefing, desktop app ================= */
const BRAIN_HEMI="M23 8C19 5.5 14.5 7 13.5 11C9.5 11.5 7 15 8.5 19C5.5 21.5 5.5 26.5 8.5 29C7.5 33 10.5 36.5 14.5 36C16 39.5 20.5 41 23 39Z";
const BRAIN_T={                                                // [trace path, node x, node y]
  big:[["M23 15H18L15.5 12.5",15.5,12.5],["M23 22H16L13 19",13,19],["M23 29H17L13.5 32.5",13.5,32.5],["M23 35H19.5",19.5,35],
       ["M25 12H28.5",28.5,12],["M25 18H30L33 15",33,15],["M25 25H32L35 28",35,28],["M25 32H29L31.5 34.5",31.5,34.5]],
  small:[["M23 18H17.5L14.5 21",14.5,21],["M23 29.5H18",18,29.5],["M25 16H30",30,16],["M25 26.5H30.5L33.5 29.5",33.5,29.5]]};
const BRAIN_LEADS=[                                            // [visible lead (outside → node), full spark path (outside → node → centre)]
  ["M-13 3H3L15.5 12.5","M-13 3H3L15.5 12.5L18 15H23"],["M-13 21H5L13 19","M-13 21H5L13 19L16 22H23"],
  ["M-13 41H5L13.5 32.5","M-13 41H5L13.5 32.5L17 29H23"],["M61 6H44L33 15","M61 6H44L33 15L30 18H25"],
  ["M61 25H43L35 28","M61 25H43L35 28L32 25H25"],["M61 43H41L31.5 34.5","M61 43H41L31.5 34.5L29 32H25"]];
function brainMark(size,mode){mode=mode||"calm";const live=mode==="live",small=!live&&size<40;
  const sw=small?2.5:1.7,tw=small?2:1.4,nr=small?2.3:1.75,T=small?BRAIN_T.small:BRAIN_T.big;
  const traces=T.map((t,i)=>`<path class="bt" d="${t[0]}" stroke-width="${tw}"/><circle class="bn" cx="${t[1]}" cy="${t[2]}" r="${nr}" style="animation-delay:${(-i*(live?0.37:1.3)).toFixed(2)}s"/>`).join("");
  const core=`<g class="bcore"><path class="bh" d="${BRAIN_HEMI}" stroke-width="${sw}"/><path class="bh" d="${BRAIN_HEMI}" stroke-width="${sw}" transform="translate(48 0) scale(-1 1)"/>${traces}</g>`;
  if(!live)return `<svg class="cx-brain ${mode==="static"?"":"calm"}" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.6" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="${small?1.8:1.3}"/><g transform="translate(24 24.4) scale(.76) translate(-24 -23.5)">${core}</g>${[-90,30,150].map(a=>`<circle cx="${(24+22.6*Math.cos(a*Math.PI/180)).toFixed(2)}" cy="${(24+22.6*Math.sin(a*Math.PI/180)).toFixed(2)}" r="${small?2.6:2.2}" fill="currentColor"/>`).join("")}</svg>`;   // Command's own mark: the Cortex brain inside a ring of buildings
  const leads=BRAIN_LEADS.map(l=>`<path class="bl" d="${l[0]}" stroke-width="1.5"/>`).join("");
  const sparks=BRAIN_LEADS.map((l,i)=>{const dur=(1.9+((i*37)%7)/10).toFixed(1);
    return `<circle class="bp ${i%2?'out':''}" r="2" style="offset-path:path('${l[1]}');animation-duration:${dur}s;animation-delay:${(-i*0.55).toFixed(2)}s"/>`+
           `<circle class="bp ${i%2?'':'out'}" r="1.5" style="offset-path:path('${l[1]}');animation-duration:${(+dur+0.9).toFixed(1)}s;animation-delay:${(-i*0.55-1.3).toFixed(2)}s"/>`;}).join("");
  return `<svg class="cx-brain live" width="${Math.round(size*76/56)}" height="${size}" viewBox="-14 -4 76 56" aria-hidden="true"><circle class="bhalo" cx="24" cy="23.5" r="21" stroke-width="1.4"/>${leads}${core}${sparks}</svg>`;}

const LOGO_SVG='<span class="dot" style="background:none;color:var(--accent);width:auto;height:auto">'+brainMark(30,"calm")+'</span>';
const APP=window.cmdApp||null;                    // present only inside the installed Windows app
let APPINFO=null;                                 // { version, options, update }
if(APP){APP.info().then(i=>{APPINFO=i;if(tab==="settings")renderSettings();}).catch(()=>{});APP.onUpdate(u=>{if(APPINFO)APPINFO.update=u;updBar();if(tab==="settings"&&setSec==="updates")renderSettings();});}
function brainLoad(label){return `<div class="bload">${brainMark(54,"live")}<div>${esc(label||"Cortex is thinking…")}</div></div>`;}

/* ---------- a little history per building, kept in this browser ----------
   One sample every 15 minutes while Command is running, kept for 7 days. It feeds the sparklines on the
   cards, the trend charts in a building's details and the uptime figure. Sample:
   [time, online, unitsOn, units, errors, silent, advisories, health(-1 = none), avgRoomF(-1 = none)] */
const HIST_KEY="cortex_cmd_hist",HIST_EVERY=15*60000,HIST_KEEP=7*86400000;
let HIST=(()=>{try{return JSON.parse(localStorage.getItem(HIST_KEY))||{};}catch(e){return {};}})();
function histNote(){const t=Date.now();let ch=false;
  DB.sites.forEach(s=>{if(!siteUrl(s))return;const a=HIST[s.id]||(HIST[s.id]=[]),last=a[a.length-1];if(last&&t-last[0]<HIST_EVERY)return;const L=LIVE[s.id]||{};
    a.push([t,s.online?1:0,s.online?(L.on||0):0,L.units||s.units||0,s.online?(s.err||0):0,s.online?(L.offline||0):0,s.online?(L.adv||[]).length:0,(s.online&&L.health!=null)?L.health:-1,(s.online&&L.avgRoom!=null)?Math.round(L.avgRoom):-1]);
    histdNote(s,a[a.length-1]);while(a.length&&t-a[0][0]>HIST_KEEP)a.shift();ch=true;});
  Object.keys(HIST).forEach(id=>{if(!DB.sites.find(s=>s.id===id)){delete HIST[id];ch=true;}});
  if(ch){try{localStorage.setItem(HIST_KEY,JSON.stringify(HIST));}catch(e){}histdSave();}}
function histOf(s,hours){const t=Date.now()-hours*3600000;return (HIST[s.id]||[]).filter(x=>x[0]>=t);}
function uptime(s,hours){const h=histOf(s,hours);if(h.length<4)return null;return Math.round(h.filter(x=>x[1]).length/h.length*100);}
function newestVer(){let best="";DB.sites.forEach(s=>{if(s.ver&&cmpVer(s.ver,best)>0)best=s.ver;});return best;}
function cmpVer(a,b){const p=v=>{const m=/^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?/.exec(String(v||""));return m?{n:[+m[1],+m[2],+m[3]],pre:m[4]?m[4].split(".").map(x=>/^\d+$/.test(x)?+x:x):null}:null;},x=p(a),y=p(b);if(!x||!y)return x?1:y?-1:0;
  for(let i=0;i<3;i++)if(x.n[i]!==y.n[i])return x.n[i]<y.n[i]?-1:1;if(!x.pre&&!y.pre)return 0;if(!x.pre)return 1;if(!y.pre)return -1;
  for(let i=0;i<Math.max(x.pre.length,y.pre.length);i++){const q=x.pre[i],r=y.pre[i];if(q===undefined)return -1;if(r===undefined)return 1;if(q===r)continue;if(typeof q==="number"&&typeof r==="number")return q<r?-1:1;return typeof q==="number"?-1:typeof r==="number"?1:(q<r?-1:1);}return 0;}

/* ---------- drawings ---------- */
function hashN(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function sparkPath(vals,w,h,pad){const v=vals.filter(x=>x!=null);if(v.length<2)return "";const mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1;
  return vals.map((y,i)=>y==null?null:[pad+i*(w-2*pad)/(vals.length-1),h-pad-(y-mn)/sp*(h-2*pad)]).filter(Boolean).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");}
/* The picture at the top of a card: a small skyline that belongs to that building (same every time, drawn
   from its name), lit windows for units that are on, and the last 24 hours of "units on" as a line. */
function siteArt(s){const W=320,H=74,L=LIVE[s.id]||{},st=!siteUrl(s)?"none":!s.online?"off":s.err?"err":"ok";let r=hashN(s.id+"|"+s.name);const rnd=()=>{r=(Math.imul(r,1664525)+1013904223)>>>0;return r/4294967296;};
  const n=5+Math.floor(rnd()*3),bw=W/(n+1.2);let x=bw*0.3,b="",win="";const frac=(st==="ok"||st==="err")&&L.units?Math.min(1,(L.on||0)/L.units):0;
  for(let i=0;i<n;i++){const w=bw*(0.7+rnd()*0.45),h=22+rnd()*40,y=H-h;b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`;
    for(let wy=y+6;wy<H-6;wy+=8)for(let wx=x+4;wx<x+w-5;wx+=7){const lit=rnd()<frac;win+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3.2" height="4" rx=".6" class="${lit?"w-on":"w-off"}"/>`;}
    x+=w+bw*0.12;}
  const h24=histOf(s,24).map(p=>p[1]?p[2]:null),sp=sparkPath(h24,W,H-8,6);
  return `<svg class="sart ${st}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><g class="bld">${b}</g>${win}${sp?`<path d="${sp}" class="sline" pathLength="1"/>`:""}${st==="ok"||st==="err"?`<circle class="sbeat" cx="${W-14}" cy="13" r="4"/>`:""}</svg>`;}
/* a ring: how many units are on, off, in error or silent */
function ring(L,size){const R=size/2-5,C=2*Math.PI*R,tot=L&&L.units||0;if(!tot)return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--border)" stroke-width="7"/><text x="50%" y="54%" text-anchor="middle" class="rg-n" style="font-size:12px">–</text></svg>`;
  const err=(L.errs||[]).length,sil=L.offline||0,on=Math.max(0,(L.on||0)-err),off=Math.max(0,tot-on-err-sil);let a=0;
  const seg=(n,col)=>{if(!n)return "";const len=n/tot*C,o=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-a).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;a+=len;return o;};
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${on} on, ${off} off, ${err} in error, ${sil} silent">${seg(on,"var(--ok)")}${seg(err,"var(--err)")}${seg(sil,"var(--warn)")}${seg(off,"var(--border)")}<text x="50%" y="50%" text-anchor="middle" class="rg-n">${tot}</text><text x="50%" y="68%" text-anchor="middle" class="rg-l">units</text></svg>`;}
function lineChart(pts,opt){opt=opt||{};const W=560,H=opt.h||120,pl=34,pb=18,pt=8;const v=pts.filter(p=>p[1]!=null);if(v.length<2)return `<div class="note" style="margin:0">Not enough history yet. Command saves a sample every 15 minutes while it is running.</div>`;
  const t0=pts[0][0],t1=pts[pts.length-1][0]||t0+1;let mn=opt.min!=null?opt.min:Math.min(...v.map(p=>p[1])),mx=opt.max!=null?opt.max:Math.max(...v.map(p=>p[1]));if(mx===mn){mx+=1;}
  const X=t=>pl+(t-t0)/((t1-t0)||1)*(W-pl-6),Y=y=>pt+(1-(y-mn)/(mx-mn))*(H-pt-pb);let d="",pen=false;pts.forEach(p=>{if(p[1]==null){pen=false;return;}d+=(pen?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1);pen=true;});
  const fmt=t=>{const D=new Date(t);return (t1-t0)>36*3600000?D.toLocaleDateString([],{weekday:"short"}):D.toLocaleTimeString([],{hour:"numeric"});};
  return `<svg viewBox="0 0 ${W} ${H}" class="lchart"><line x1="${pl}" y1="${Y(mn)}" x2="${W-6}" y2="${Y(mn)}" class="ax"/><line x1="${pl}" y1="${Y(mx)}" x2="${W-6}" y2="${Y(mx)}" class="ax"/><text x="${pl-5}" y="${Y(mx)+4}" text-anchor="end" class="axl">${Math.round(mx)}</text><text x="${pl-5}" y="${Y(mn)+4}" text-anchor="end" class="axl">${Math.round(mn)}</text>
    <path d="${d}" fill="none" stroke="${opt.col||"var(--accent)"}" stroke-width="2" stroke-linejoin="round"/>${[0,.5,1].map(f=>`<text x="${X(t0+f*(t1-t0))}" y="${H-3}" text-anchor="${f===0?"start":f===1?"end":"middle"}" class="axl">${fmt(t0+f*(t1-t0))}</text>`).join("")}</svg>`;}

/* ---------- building card ---------- */
function siteCard(s,canDrag,pad){const L=LIVE[s.id]||{},up=uptime(s,168),nv=newestVer(),old=s.ver&&nv&&cmpVer(s.ver,nv)<0;
  const m=(v,l,c)=>`<div class="sm"><b${c?` style="color:${c}"`:""}>${v}</b><span>${l}</span></div>`;
  const live=s.online&&L.units!=null;
  return `<div class="site" style="padding:0${canDrag?';cursor:grab':''}" ${canDrag?`draggable="true"`:''} data-drag="${s.id}">
    ${PREFS.cardArt!==false?siteArt(s):""}
    <div style="padding:${pad};display:flex;flex-direction:column;gap:10px;flex:1">
      <div class="h"><div><div class="nm">${canDrag?'⠿ ':''}${esc(s.name)}</div><div class="lo">${esc(s.loc||'')}</div></div>${sitePill(s)}</div>
      ${live?`<div class="smet">${ring(L,62)}<div class="smg">${m((L.on||0)+" / "+L.units,"on")}${m((L.errs||[]).length,"in error",(L.errs||[]).length?"var(--err)":"")}${PREFS.showHealth!==false?m(L.health!=null?L.health:"–","health",L.health==null?"":L.health>=85?"var(--ok)":L.health>=65?"var(--warn)":"var(--err)"):""}${m(up!=null?up+"%":"–","online, 7 days",up!=null&&up<95?"var(--warn)":"")}${L.adv&&L.adv.length?m(L.adv.length,"advisor"+(L.adv.length>1?"ies":"y"),"var(--warn)"):""}${L.offline?m(L.offline,"silent","var(--warn)"):""}</div></div>`
        :`<div class="note" style="margin:0">${!siteUrl(s)?"Add this building's controller address to see it here.":s.online?"Reading the controller…":"The controller is not answering."+(L.at||s.seen?" Last seen "+fmtTime(s.seen||L.at)+".":"")}</div>`}
      <div class="stat-row"><div>${siteAddr(s)}</div>${s.ver?`<div title="${old?"The newest controller in your fleet is on v"+esc(nv):""}">v${esc(s.ver)}${old?' <span style="color:var(--warn)">· update available</span>':''}</div>`:''}</div>
      <div class="foot"><button class="btn primary grow sm" data-open="${s.id}">Open dashboard ↗</button><button class="btn sm" data-detail="${s.id}">Details</button><button class="btn sm" data-assign="${s.id}">Assign</button><button class="btn sm" data-edit="${s.id}">Edit</button></div>
    </div></div>`;}

let detRange=24;

  const row=(k,v)=>`<div class="drow"><span>${k}</span><b>${v}</b></div>`,series=i=>h.map(p=>[p[0],p[1]?(p[i]<0?null:p[i]):null]);

      ${(L.adv||[]).length?`<h2 class="sec">Diagnosis advisories</h2><div class="panel">${L.adv.map(a=>`<div class="trow"><span class="pill warn"><span class="pdot"></span>${a.lvl==="likely"?"Likely":"Possible"}</span><div class="tinfo"><div class="tname">${esc(a.title)}</div><div class="tsub">since ${fmtTime(a.at)}</div></div></div>`).join("")}</div>`:""}
      ${(L.healthAll||[]).length?`<h2 class="sec">System health by outdoor unit</h2><div class="panel">${L.healthAll.map(x=>`<div class="trow"><div class="tinfo"><div class="tname">Outdoor unit ${esc(x.addr)}</div></div><span class="pill ${x.score>=85?'ok':x.score>=65?'warn':'err'}">${x.score} / 100</span></div>`).join("")}</div>`:""}

    </div>

  document.querySelectorAll("#det-range button").forEach(b=>b.onclick=()=>{detRange=+b.dataset.r;siteDetail(id);});

function updText(u){const when=u.checkedAt?" Last checked "+fmtTime(u.checkedAt)+".":"";

function exportData(){const out={kind:"cortex-command-backup",v:1,at:Date.now(),db:DB,acct:loadAcct(),prefs:{},hist:HIST,histd:HISTD};

async function importData(file){if(!file)return;try{const j=JSON.parse(await file.text());if(j.kind!=="cortex-command-backup"||!j.db||!Array.isArray(j.db.sites))throw new Error("that file is not a Cortex Command backup");

/* ---------- names, search, acknowledgements, repeat offenders, notes, reports ----------
   Everything here works from what each controller already reports. Nothing is sent to equipment. */
function unitName(s,addr){const L=LIVE[s.id]||{},u=(L.list||[]).find(x=>x.a===addr);return u?u.n:"Unit 0x"+Number(addr).toString(16).toUpperCase().padStart(2,"0");}
function snoozed(s){return ((DB.snooze||{})[s.id]||0)>Date.now();}
/* The short code to show for a fault, whatever make it came from. A Rheem / Ruud alarm arrives as its full text
   ("A021_A Restricted Airflow…"); the code word at the front is the tag. */
function evTag(e){if(!e.brand)return e.code||"Error";const m=/\b[AST][ _-]?\d{3}(?:[ _-]?[OAFCSZ]\b)?/i.exec(String(e.code||""));return m?m[0].toUpperCase():"Alarm";}
function alertItems(){const items=[];
  DB.sites.forEach(s=>{const L=LIVE[s.id]||{};
    if(siteUrl(s)&&!s.online)items.push({s,key:"off:"+s.id,cls:"off",tag:"Offline",t:"Controller is not answering",sub:(s.seen?"Last seen "+fmtTime(s.seen)+". ":"")+"Check the site's internet or Tailscale link and that the controller has power.",w:s.seen||0});
    (L.events||[]).filter(e=>!e.cleared).forEach(e=>items.push({s,key:"ev:"+s.id+":"+(e.id||(e.kind+e.addr+"@"+e.at)),cls:e.kind==="silent"?"warn":"err",tag:e.kind==="silent"?"Silent":evTag(e),
      t:(e.brand?(e.name||"Rheem / Ruud system"):e.kind==="odu"?"Outdoor unit 0x"+Number(e.addr).toString(16).toUpperCase():unitName(s,e.addr))+(e.kind==="silent"?" stopped answering":(e.brand?" alarm":" in error")),sub:"since "+fmtTime(e.at),w:e.at}));
    (L.adv||[]).forEach(a=>items.push({s,key:"adv:"+s.id+":"+(a.key||a.id||a.title),cls:"warn",tag:a.lvl==="likely"?"Likely":"Possible",t:a.title,sub:"diagnosis advisory since "+fmtTime(a.at)+" · "+a.hit+" of "+a.total+" signs",w:a.at}));});
  items.forEach(i=>{i.ack=(DB.acks||{})[i.key]||null;i.snz=snoozed(i.s);});
  return items.sort((a,b)=>b.w-a.w);}
function openAlertCount(){return alertItems().filter(i=>!i.ack&&!i.snz).length;}
/* An acknowledgement lasts as long as its alert. Once the controller says the alert is gone, forget it. */
function ackPrune(){let ch=false;const live=new Set(alertItems().map(i=>i.key)),now=Date.now();
  Object.keys(DB.acks||{}).forEach(k=>{const sid=k.split(":")[1],s=DB.sites.find(x=>x.id===sid),L=s&&LIVE[s.id];
    if(!s){delete DB.acks[k];ch=true;return;}
    const fresh=k.indexOf("off:")===0?s.online:(s.online&&L&&L.events&&L.at&&now-L.at<120000);
    if(fresh&&!live.has(k)){delete DB.acks[k];ch=true;}});
  Object.keys(DB.snooze||{}).forEach(id=>{if(DB.snooze[id]<=now||!DB.sites.find(x=>x.id===id)){delete DB.snooze[id];ch=true;}});
  if(ch)save();}
function tabBadges(){const b=document.querySelector('.tab[data-tab="alerts"]');if(!b)return;const n=openAlertCount();b.innerHTML="Alerts"+(n?` <span class="tbadge">${n}</span>`:"");}

function snoozeUntil(v){const now=Date.now();if(v==="am"){const d=new Date(now);d.setDate(d.getDate()+(d.getHours()>=7?1:0));d.setHours(7,0,0,0);return d.getTime();}return now+(+v)*3600000;}
function offenders(days){const from=Date.now()-days*86400000,m=new Map();
  DB.sites.forEach(s=>((LIVE[s.id]||{}).events||[]).forEach(e=>{if(e.at<from)return;const k=s.id+":"+(e.brand?"x:"+e.key:(e.kind==="odu"?"odu":"u")+":"+e.addr);let o=m.get(k);
    if(!o){o={s,odu:e.kind==="odu",addr:e.addr,ext:e.brand?(e.name||"Rheem / Ruud system"):null,n:0,codes:new Map(),last:0};m.set(k,o);}
    o.n++;const c=e.kind==="silent"?"went silent":evTag(e);o.codes.set(c,(o.codes.get(c)||0)+1);o.last=Math.max(o.last,e.at);}));
  return [...m.values()].filter(o=>o.n>=2).sort((a,b)=>b.n-a.n||b.last-a.last).slice(0,12);}
function unitSearch(q){const words=q.toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return [];const out=[];
  DB.sites.forEach(s=>((LIVE[s.id]||{}).list||[]).forEach(u=>{

    if(words.every(w=>hay.indexOf(w)>=0))out.push({s,u});}));
  return out.sort((a,b)=>(b.u.c?2:b.u.off?1:0)-(a.u.c?2:a.u.off?1:0)||a.u.n.localeCompare(b.u.n,undefined,{numeric:true}));}

    return `<div class="trow urow" data-uopen="${x.s.id}"><span class="pill ${st[0]}"><span class="pdot"></span>${esc(st[1])}</span><div class="tinfo"><div class="tname">${esc(u.n)}</div><div class="tsub">${esc(x.s.name)}${u.g?" · "+esc(u.g):""}${typeof u.r==="number"?" · room "+Math.round(u.r)+"°":""}${typeof u.sp==="number"&&u.on?" · set "+Math.round(u.sp*9/5+32)+"°":""}${u.f?" · filter due":""}</div></div><span class="tsub">Open ↗</span></div>`;};

    <div class="err-text" id="lg-err">${esc(msg||"")}</div>
    <button class="btn primary" id="lg-go" style="width:100%;margin-top:6px">Sign in</button>
    <div style="text-align:center;margin-top:14px"><button class="linklike" id="lg-forgot" style="background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:13px;text-decoration:underline">Forgot password?</button></div>`;
  $("lg-go").onclick=()=>{
    const acct=loadAcct();if(!acct){showSetup();return;}
    const u=$("lg-user").value.trim(),p=$("lg-pass").value;
    if(u===acct.user&&hash(p)===acct.passhash)signedIn(acct);
    else $("lg-err").textContent="Wrong username or password.";
  };
  $("lg-forgot").onclick=showRecovery;
  $("lg-pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("lg-go").click();});
}
/* recovery: enter the code, set a new password */
function showRecovery(){
  CARD().innerHTML=head("Account recovery","Reset your password")+`
    <label class="flabel">Recovery code</label>
    <input class="inp" id="rec-code" placeholder="CORTEX-XXXX-XXXX-XXXX" autocomplete="off" style="font-family:ui-monospace,Menlo,monospace">
    <div class="err-text" id="rec-err"></div>
    <button class="btn primary" id="rec-go" style="width:100%;margin-top:6px">Verify</button>
    <div style="text-align:center;margin-top:14px"><button class="linklike" id="rec-back" style="background:none;border:0;color:var(--text-dim);cursor:pointer;font-size:13px;text-decoration:underline">Back to sign in</button></div>`;
  $("rec-back").onclick=()=>showSignin();
  $("rec-go").onclick=()=>{
    const acct=loadAcct();
    if(acct&&$("rec-code").value.trim().toUpperCase()===acct.recovery){
      CARD().innerHTML=head("Set a new password","Recovery verified")+`
        <input class="inp" id="np" type="password" placeholder="new password">
        <input class="inp" id="np2" type="password" placeholder="confirm new password" style="margin-top:8px">
        <div class="err-text" id="np-err"></div>
        <button class="btn primary" id="np-go" style="width:100%;margin-top:10px">Save password</button>`;
      $("np-go").onclick=()=>{
        const p=$("np").value,p2=$("np2").value;
        if(p.length<4){$("np-err").textContent="Password must be at least 4 characters.";return;}
        if(p!==p2){$("np-err").textContent="Passwords don't match.";return;}
        acct.passhash=hash(p);acct.recovery=genRecovery(acct.name);saveAcct(acct);
        showRecoveryCode(acct);
      };
    } else $("rec-err").textContent="That code doesn't match this console.";
  };
}

/* boot */
(function(){
  const acct=loadAcct();
  if(!acct){showSetup();}
  else if(sessionStorage.getItem("cortex_cmd_in")==="1"){OWNER.user=acct.user;OWNER.name=acct.name;PREFS=loadPrefs();applyTheme();lastTouch=+sessionStorage.getItem("cortex_cmd_touch")||Date.now();enter();}
  else {showSignin();}
})();
</script>
</body>
