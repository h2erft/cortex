<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Room comfort</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#1b2027;--dim:#5a6372;--faint:#8a93a1;--border:#e2e6ec;--accent:#0e7c66;--accent-soft:#d9efe9;--cool:#2f86d6;--heat:#d9682c;--err:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--text:#e7ebf0;--dim:#9aa4b2;--faint:#6b7585;--border:#262d37;--accent:#2fb79a;--accent-soft:#143029;--cool:#5aa6e8;--heat:#e8955a}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 28px}
h1{font-size:22px;margin:4px 0 0}.site{color:var(--dim);font-size:13.5px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.uname{font-weight:650;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent)}.pill.off{background:var(--border);color:var(--dim)}.pill.bad{background:#fbe3e3;color:var(--err)}
.now{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px}.now b{font-size:54px;font-weight:650;letter-spacing:-1.5px;line-height:1}.now span{color:var(--dim);font-size:14px}
.set{display:flex;align-items:center;gap:14px;margin-top:16px}.set .v{flex:1;text-align:center}.set .v b{font-size:30px;font-weight:650;transition:transform .15s}.set .v b.bump{transform:scale(1.12)}.set .v small{display:block;color:var(--dim);font-size:12.5px}
button{font:inherit;cursor:pointer;border:0}.rnd{width:58px;height:58px;border-radius:50%;background:var(--bg);border:1px solid var(--border);font-size:28px;color:var(--text);transition:transform .08s,background .15s}.rnd:active{transform:scale(.92);background:var(--accent-soft)}.rnd:disabled{opacity:.35}
.pw{display:flex;gap:8px;margin-top:16px}.pw button{flex:1;padding:13px;border-radius:14px;background:var(--bg);border:1px solid var(--border);font-weight:600;color:var(--dim);transition:all .15s}.pw button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--border);margin-top:12px;position:relative;overflow:hidden}.bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px;transition:left .3s,width .3s}
.lim{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:4px}
.msg{font-size:13.5px;color:var(--dim);text-align:center;padding:10px}.msg.err{color:var(--err)}.foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:18px}
.big{padding:60px 10px;text-align:center;color:var(--dim)}.big b{display:block;font-size:19px;color:var(--text);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#1b2027;color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap" id="app"><div class="big">Loading…</div></div><div id="toast"></div>
<script>
/* Cortex occupant view. Shows one room and lets the person in it adjust the temperature inside the
   limits the building's admin chose. It can only reach /api/room/<key>; it holds no login. */
const KEY=(location.hash||"").replace(/^#/,"")||new URLSearchParams(location.search).get("k")||"";
let S=null,pending={},sendT=null,holdUntil=0,busy=false;
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const disp=c=>S.unit==="C"?(Math.round(c*2)/2):Math.round(c*9/5+32), dispRoom=f=>f==null?"--":(S.unit==="C"?Math.round((f-32)*5/9):Math.round(f));
const stepC=()=>S.unit==="C"?0.5:5/9;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600);}
function gone(){$("app").innerHTML='<div class="big"><b>This page is not available</b>The link may have been turned off or replaced. Ask the building office for a new one.</div>';}
function draw(){if(!S)return;
  $("app").innerHTML=`<h1>${esc(S.name)}</h1><div class="site">${esc(S.site)}</div>`+
   (S.units.length?S.units.map(u=>{const set=pending[u.addr]&&pending[u.addr].setC!=null?pending[u.addr].setC:u.setC,on=pending[u.addr]&&pending[u.addr].on!=null?pending[u.addr].on:u.on;
     const pct=set==null?0:Math.max(0,Math.min(100,(set-S.loC)/Math.max(.5,S.hiC-S.loC)*100));
     return `<div class="card"><div class="uname"><span>${esc(u.name)}</span>${u.offline?'<span class="pill bad">Not answering</span>':(u.fault?'<span class="pill bad">Needs service</span>':`<span class="pill ${on?'':'off'}">${on?(u.mode==="heat"?"Heating":u.mode==="fan"?"Fan":u.mode==="dry"?"Drying":"Cooling"):"Off"}</span>`)}</div>
      <div class="now"><b>${dispRoom(u.roomF)}°</b><span>in the room now</span></div>
      ${u.offline?'<div class="msg">This unit is not answering the building controller right now.</div>':`
      <div class="set"><button class="rnd" data-dn="${u.addr}" ${set==null||set<=S.loC?"disabled":""} aria-label="Cooler">−</button>
        <div class="v"><b id="sv${u.addr}">${set==null?"--":disp(set)}°</b><small>set to</small></div>
        <button class="rnd" data-up="${u.addr}" ${set==null||set>=S.hiC?"disabled":""} aria-label="Warmer">+</button></div>
      <div class="bar"><i style="left:0;width:${pct}%"></i></div><div class="lim"><span>${disp(S.loC)}°</span><span>allowed range</span><span>${disp(S.hiC)}°</span></div>
      ${S.power?`<div class="pw"><button data-on="${u.addr}" class="${on?'sel':''}">On</button><button data-off="${u.addr}" class="${on?'':'sel'}">Off</button></div>`:""}`}
     </div>`;}).join(""):'<div class="big"><b>No units yet</b>The building controller has not found this room’s equipment yet.</div>')+
   (S.ready?"":'<div class="msg err">The building controller is not connected to the equipment right now. You can look, but changes will not go through.</div>')+
   `<div class="foot">Changes can take up to a minute to show on the unit.</div>`;
  const q=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
  q("[data-up]",b=>nudge(+b.dataset.up,1));q("[data-dn]",b=>nudge(+b.dataset.dn,-1));q("[data-on]",b=>power(+b.dataset.on,true));q("[data-off]",b=>power(+b.dataset.off,false));}
function nudge(addr,dir){const u=S.units.find(x=>x.addr===addr);if(!u)return;const cur=pending[addr]&&pending[addr].setC!=null?pending[addr].setC:u.setC;if(cur==null)return;
  let next;if(S.unit==="C")next=cur+dir*0.5;else next=(Math.round(cur*9/5+32)+dir-32)*5/9;
  next=Math.max(S.loC,Math.min(S.hiC,next));if(Math.abs(next-cur)<0.01){toast(dir>0?"That is the highest allowed here":"That is the lowest allowed here");return;}
  (pending[addr]=pending[addr]||{}).setC=next;holdUntil=Date.now()+20000;draw();const el=$("sv"+addr);if(el){el.classList.add("bump");setTimeout(()=>el.classList.remove("bump"),160);}queue();}
function power(addr,on){(pending[addr]=pending[addr]||{}).on=on;holdUntil=Date.now()+20000;draw();queue();}
function queue(){clearTimeout(sendT);sendT=setTimeout(flush,1700);}
async function flush(){if(busy){queue();return;}busy=true;const jobs=Object.entries(pending);
  for(const [addr,p] of jobs){const body={addr:+addr};if(p.setC!=null)body.setC=Math.round(p.setC*2)/2;if(p.on!=null)body.on=p.on;
    try{const r=await fetch("/api/room/"+encodeURIComponent(KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
      if(r.status===404){gone();busy=false;return;}
      if(r.status===429){busy=false;queue();return;}
      if(!r.ok){toast(j.err||"That did not go through");delete pending[addr];holdUntil=0;}
      else{const u=S.units.find(x=>x.addr===+addr);if(u){if(j.setC!=null)u.setC=j.setC;if(p.on!=null)u.on=p.on;}delete pending[addr];toast("Sent");}
    }catch(e){toast("No connection to the building controller");delete pending[addr];holdUntil=0;}
    await new Promise(r=>setTimeout(r,1600));}
  busy=false;draw();}
async function pull(){if(!KEY){gone();return;}
  try{const r=await fetch("/api/room/"+encodeURIComponent(KEY),{cache:"no-store"});if(r.status===404){gone();S=null;return;}if(!r.ok)return;const j=await r.json();
    if(S&&Date.now()<holdUntil){j.units.forEach(u=>{const o=S.units.find(x=>x.addr===u.addr);if(o){u.setC=o.setC;u.on=o.on;}});}   // what the person just chose wins until the unit catches up
    S=j;document.title=j.name+" · comfort";if(!Object.keys(pending).length||!document.querySelector(".card"))draw();}
  catch(e){if(!S)$("app").innerHTML='<div class="big"><b>Can’t reach the building controller</b>Check that this device is on the building network, then try again.</div>';}}
pull();setInterval(pull,10000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull();});
</script></body></html>
