name: command-build
# Proves the Windows installer still builds whenever the desktop app or the Command page changes.
# The installer is kept as a build artifact for 14 days; real releases come from release.yml.
on:
  push:
    branches: [main]
    paths: ['command-app/**', 'command-center.html', '.github/workflows/command-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        shell: bash
        working-directory: command-app
        run: |
          set -euo pipefail
          cp ../command-center.html .
          npm install --no-audit --no-fund
          npm version "0.0.0-ci.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish never
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-command-installer
          path: command-app/dist/Cortex-Command-Setup-*.exe
          retention-days: 14
