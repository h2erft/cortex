name: release
# Tag a version and push it, and this publishes a GitHub Release that every
# appliance pulls automatically:   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build payload + manifest
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"                 # v1.1.0 -> 1.1.0
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          printf '%s\n' "$VER" > appliance/VERSION

          STAGE="$(mktemp -d)"
          cp appliance/server.js appliance/package.json appliance/VERSION appliance/cortex-update.sh appliance/cortex.sudoers appliance/cortex-appliance.service appliance/cortex-updater.service appliance/cortex-updater.timer "$STAGE/"
          [ -f appliance/package-lock.json ] && cp appliance/package-lock.json "$STAGE/"
          for f in cortex.html command-center.html setup.html LGAP_reference.md; do
            [ -f "$f" ] && cp "$f" "$STAGE/" || echo "warning: $f missing"
          done

          chmod +x "$STAGE/cortex-update.sh" 2>/dev/null || true   # keep the updater executable in the tarball
          mkdir -p dist
          tar -czf "dist/cortex-$VER.tgz" -C "$STAGE" .
          SHA="$(sha256sum "dist/cortex-$VER.tgz" | cut -d' ' -f1)"
          cat > dist/manifest.json <<JSON
          {
            "version": "$VER",
            "url": "$BASE/cortex-$VER.tgz",
            "sha256": "$SHA",
            "released": "$(date -Is)",
            "notes": ""
          }
          JSON
          echo "built release $VER"; cat dist/manifest.json

      - name: Publish release (create if missing, always (re)attach assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release already exists (e.g. created in the UI) — just attach/replace the files
            gh release upload "$GITHUB_REF_NAME" dist/cortex-*.tgz dist/manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/cortex-*.tgz dist/manifest.json \
              --title "Cortex $GITHUB_REF_NAME" \
              --notes "Automated Cortex appliance release."
          fi
