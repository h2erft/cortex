name: release
# Tag a version and push it, and this publishes a GitHub Release that every
# appliance pulls automatically:   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build payload + manifest
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"                 # v1.1.0 -> 1.1.0
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          printf '%s\n' "$VER" > appliance/VERSION

          STAGE="$(mktemp -d)"
          cp appliance/server.js appliance/scheduler.js appliance/busmaster.js appliance/recorder.js appliance/pwa.js appliance/push.js appliance/diagwatch.js appliance/fleetwatch.js appliance/occupant.js appliance/commandstore.js appliance/cortex-https.sh appliance/package.json appliance/VERSION appliance/cortex-update.sh appliance/cortex.sudoers appliance/cortex-appliance.service appliance/cortex-updater.service appliance/cortex-updater.timer "$STAGE/"
          [ -f appliance/package-lock.json ] && cp appliance/package-lock.json "$STAGE/"
          FILES="cortex.html command-center.html room.html setup.html LGAP_reference.md"
          case "$GITHUB_REF_NAME" in *-*) FILES="$FILES uart-sniffer.html" ;; esac   # experimental UART tool ships in pre-releases only
          for f in $FILES; do
            [ -f "$f" ] && cp "$f" "$STAGE/" || echo "warning: $f missing"
          done

          chmod +x "$STAGE/cortex-update.sh" 2>/dev/null || true   # keep the updater executable in the tarball
          mkdir -p dist
          tar -czf "dist/cortex-$VER.tgz" -C "$STAGE" .
          SHA="$(sha256sum "dist/cortex-$VER.tgz" | cut -d' ' -f1)"
          cat > dist/manifest.json <<JSON
          {
            "version": "$VER",
            "url": "$BASE/cortex-$VER.tgz",
            "sha256": "$SHA",
            "released": "$(date -Is)",
            "notes": ""
          }
          JSON
          echo "built release $VER"; cat dist/manifest.json

      - name: Publish release (create if missing, always (re)attach assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release already exists (e.g. created in the UI) — just attach/replace the files
            gh release upload "$GITHUB_REF_NAME" dist/cortex-*.tgz dist/manifest.json --clobber
          else
            # A tag with a suffix (v1.5.0-beta.1, -rc.1, -alpha.2) is a PRE-release. Marking it so is
            # what keeps it away from customer boxes: the stable channel only installs GitHub's
            # "latest" release, and GitHub never counts a pre-release as latest.
            PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" \
              dist/cortex-*.tgz dist/manifest.json \
              --title "Cortex $GITHUB_REF_NAME" \
              --notes "Automated Cortex appliance release." $PRE
          fi

  # Cortex Command for Windows: an installer (.exe) plus command-manifest.json, attached to the same
  # release. The app's own updater reads that manifest; a release without it is simply skipped.
  command-win:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        shell: bash
        working-directory: command-app
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cp ../command-center.html .
          npm install --no-audit --no-fund
          npm version "$VER" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish never
          EXE="Cortex-Command-Setup-$VER.exe"
          test -f "dist/$EXE"
          SHA="$(sha256sum "dist/$EXE" | cut -d' ' -f1)"
          printf '{\n  "version": "%s",\n  "file": "%s",\n  "sha256": "%s"\n}\n' "$VER" "$EXE" "$SHA" > dist/command-manifest.json
          cat dist/command-manifest.json
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" command-app/dist/Cortex-Command-Setup-*.exe command-app/dist/command-manifest.json --clobber

  # Cortex for Windows (the customer app): finds the controller on the local network, opens it, notifies.
  desktop-win:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        shell: bash
        working-directory: desktop-app
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cp ../command-app/updater.js .
          npm install --no-audit --no-fund
          npm version "$VER" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish never
          EXE="Cortex-Setup-$VER.exe"
          test -f "dist/$EXE"
          SHA="$(sha256sum "dist/$EXE" | cut -d' ' -f1)"
          printf '{\n  "version": "%s",\n  "file": "%s",\n  "sha256": "%s"\n}\n' "$VER" "$EXE" "$SHA" > dist/cortex-desktop-manifest.json
          cat dist/cortex-desktop-manifest.json
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop-app/dist/Cortex-Setup-*.exe desktop-app/dist/cortex-desktop-manifest.json --clobber

